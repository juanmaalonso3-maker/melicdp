<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDP Kenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F4F7F6; --panel:#FFFFFF; --panel2:#EDF2F1; --panel3:#E3EAE8;
  --ink:#15201E; --ink2:#4C5D59; --ink3:#7A8B87;
  --line:#D8E0DD; --line2:#BDC9C5;
  --acc:#0E6B63; --acc2:#DBEDEA;
  --ok:#2C7A4B; --okbg:#DDF0E4;
  --warn:#8A5D06; --warnbg:#F8EBD1;
  --bad:#A63A2E; --badbg:#F8E2DE;
  --shadow:0 1px 2px rgba(21,32,30,.06),0 10px 28px -20px rgba(21,32,30,.3);
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1312; --panel:#151E1C; --panel2:#1C2624; --panel3:#24302D;
  --ink:#E2E9E6; --ink2:#A3B3AF; --ink3:#788A86;
  --line:#28352F; --line2:#3A4844;
  --acc:#54B8AB; --acc2:#123029;
  --ok:#6BC489; --okbg:#132F1D;
  --warn:#D9A63F; --warnbg:#31260C;
  --bad:#E2786A; --badbg:#351A16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -20px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#0D1312; --panel:#151E1C; --panel2:#1C2624; --panel3:#24302D;
  --ink:#E2E9E6; --ink2:#A3B3AF; --ink3:#788A86;
  --line:#28352F; --line2:#3A4844;
  --acc:#54B8AB; --acc2:#123029;
  --ok:#6BC489; --okbg:#132F1D;
  --warn:#D9A63F; --warnbg:#31260C;
  --bad:#E2786A; --badbg:#351A16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.015em}
.n{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc)}

#app{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:900px){#app{grid-template-columns:206px 1fr}}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:18px 12px}
@media(min-width:900px){aside{position:sticky;top:0;height:100vh}}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:"Bricolage Grotesque";font-size:17px;font-weight:700}
.brand span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-family:"JetBrains Mono"}
.nav{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r);border:0;background:none;
  cursor:pointer;text-align:left;width:100%;font-family:"Bricolage Grotesque";font-weight:500;font-size:13.5px;color:var(--ink2)}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--acc2);color:var(--acc);font-weight:700}
.nav .b{margin-left:auto;font:600 10.5px "JetBrains Mono";background:var(--panel3);color:var(--ink2);padding:1px 6px;border-radius:20px}
.nav[aria-current="true"] .b{background:var(--acc);color:var(--panel)}
.nav-sep{font:600 9.5px "JetBrains Mono";letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);padding:14px 10px 5px;margin-top:6px;border-top:1px solid var(--line)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot small{color:var(--ink3);font-size:11px;line-height:1.45}

main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;background:var(--ground);border-bottom:1px solid var(--line);
  padding:14px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-size:19px;font-weight:700}
.frescura{margin-right:auto;display:flex;gap:7px;align-items:center;font-size:12px;color:var(--ink3)}
.frescura b{font-family:"JetBrains Mono";font-weight:600}
.frescura.vieja{color:var(--warn)}
.frescura.muyvieja{color:var(--bad);font-weight:600}
/* Barra de progreso arriba de todo: se ve aunque el botón que disparó la
   operación haya quedado fuera de pantalla. */
.barra{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;pointer-events:none}
.barra i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s linear;
  box-shadow:0 0 8px var(--acc)}
.pill{display:inline-flex;gap:7px;align-items:center;background:var(--acc2);color:var(--acc);
  border-radius:20px;padding:5px 12px;font:600 12px "Bricolage Grotesque";white-space:nowrap}
.pill b{font-family:"JetBrains Mono";font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.pill small{font:400 11px "JetBrains Mono";opacity:.75}
[hidden]{display:none!important}
.frescura .ver{font:400 10px "JetBrains Mono";color:var(--ink3);background:var(--panel3);
  padding:2px 5px;border-radius:4px;margin-left:4px}
.frescura .ver.desfasado{background:var(--badbg);color:var(--bad);font-weight:600}
.wrap{padding:20px 22px 60px;display:flex;flex-direction:column;gap:16px}

.btn{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 13px;cursor:pointer;
  font-family:"Bricolage Grotesque";font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.xs{padding:2px 7px;font-size:11px;font-family:"JetBrains Mono"}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
input[type=text],input[type=number],input[type=password],select{
  border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 10px}
input:focus-visible,select:focus-visible,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* ── buscador SKU grande ── */
.buscador{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#qsku{font-family:"JetBrains Mono";font-size:17px;padding:12px 14px;min-width:230px;flex:1;max-width:420px;letter-spacing:.02em}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sug{border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:5px 12px;cursor:pointer;
  font:600 12px "JetBrains Mono"}
.sug:hover{border-color:var(--acc);color:var(--acc)}
.sug small{font-family:system-ui;font-weight:400;color:var(--ink3);margin-left:6px}

/* ── leyenda ── */
.leyenda{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.leyenda summary{padding:12px 16px;cursor:pointer;font-family:"Bricolage Grotesque";font-weight:600;
  font-size:13px;color:var(--acc);list-style:none;display:flex;align-items:center;gap:8px}
.leyenda summary::-webkit-details-marker{display:none}
.leyenda summary::before{content:"›";font-size:17px;line-height:1;transition:transform .15s;display:inline-block}
.leyenda[open] summary::before{transform:rotate(90deg)}
.ley-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ley-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px}
.ley-g div{display:flex;flex-direction:column;gap:3px}
.ley-g b{font:400 10px "JetBrains Mono";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.ley-g span{font-size:12.5px;color:var(--ink2);line-height:1.5}
.ley-g span b{font-family:inherit;font-size:inherit;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600}
.ley-n{background:var(--panel2);border-radius:6px;padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.55}

/* ── cabecera de SKU ── */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;
  display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero img{width:64px;height:64px;object-fit:contain;border-radius:6px;background:var(--panel2);flex:none}
.hero .txt{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.hero .sk{font:600 12px "JetBrains Mono";letter-spacing:.1em;color:var(--acc);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .sk .btn{letter-spacing:0;font-family:inherit}
.hero h2{font-size:19px;font-weight:700;line-height:1.2}
.hero .stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px}
.hero .stats div{display:flex;flex-direction:column}
.hero .stats span{font:400 10px "JetBrains Mono";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.hero .stats b{font-family:"JetBrains Mono";font-size:17px;font-variant-numeric:tabular-nums}

/* ── matriz ── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.panel>h3{font-size:13.5px;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:center}
.panel>h3 .hint{font-family:system-ui;font-weight:400;font-size:12px;color:var(--ink3);margin-left:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);z-index:2;font:400 10px/1.3 "JetBrains Mono";
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:9px 11px;
  border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:bottom}
th.r,td.r{text-align:right}
th.c,td.c{text-align:center}
td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
.matriz th:first-child,.matriz td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;min-width:150px}
.matriz thead th:first-child{background:var(--panel2);z-index:3}
.matriz tr:hover td:first-child{background:var(--panel2)}
.celda{display:flex;flex-direction:column;gap:2px;align-items:center;font-size:11px}
.celda .pz{font-family:"JetBrains Mono";font-variant-numeric:tabular-nums;font-size:11.5px}

.chip{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1 "JetBrains Mono";letter-spacing:.05em;
  text-transform:uppercase;padding:3px 6px;border-radius:4px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.mut{background:var(--panel3);color:var(--ink3)}
.chip.acc{background:var(--acc2);color:var(--acc)}
.chip.cat{background:var(--acc);color:var(--panel);font-weight:700}
.pub.escat{border-color:var(--acc)}
.pub.escat .pub-h{background:var(--acc2)}

/* ── bloque publicación ── */
.pub{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.pub-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:var(--panel2)}
.pub-h .cuota{font-family:"Bricolage Grotesque";font-weight:700;font-size:14.5px}
.pub-h .lapiz{font-size:10.5px;padding:3px 8px;opacity:.55}
.pub-h .lapiz:hover{opacity:1}
.pub-h .id{font:400 10.5px "JetBrains Mono";color:var(--ink3)}
.pub-h .sep{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.pub-h .sep b{font-family:"JetBrains Mono";font-variant-numeric:tabular-nums}
.conds{display:flex;gap:5px;flex-wrap:wrap}

/* ── desplegable para elegir qué publicación se muestra ── */
.selpub{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 15px;display:flex;gap:11px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.selpub label[for]{font:600 10.5px "JetBrains Mono";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.selpub select{flex:1;min-width:270px;max-width:640px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line2);border-radius:6px;padding:8px 11px;font-family:"JetBrains Mono";
  font-size:12.5px;cursor:pointer}
.selpub select:focus{outline:2px solid var(--acc);outline-offset:1px}
.selpub .nav-pub{display:flex;gap:4px}
.selpub .nav-pub .btn{font-family:"Bricolage Grotesque";font-weight:700;font-size:15px;line-height:1;padding:5px 10px}
.selpub .hint2{font-size:11.5px;color:var(--ink3)}
.selpub .todas{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;
  color:var(--ink2);cursor:pointer;user-select:none}
.selpub .todas input{accent-color:var(--acc);cursor:pointer}
.reloj{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2)}
.prog{height:5px;width:64px;border-radius:3px;background:var(--panel3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc)}
.prog.done i{background:var(--ok)}

/* ── tablero de estados: las tarjetas de arriba del listado ── */
.tablero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.tab-salud{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;
  box-shadow:var(--shadow);transition:border-color .12s,transform .12s;position:relative;overflow:hidden}
.tab-salud:hover{transform:translateY(-1px)}
.tab-salud::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.tab-salud.sin::before{background:var(--bad)}
.tab-salud.parcial::before{background:var(--warn)}
.tab-salud.vence::before{background:var(--warn)}
.tab-salud.relampago::before{background:var(--acc)}
.tab-salud.ok::before{background:var(--ok)}
.tab-salud .n{font-family:"JetBrains Mono";font-weight:600;font-size:26px;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tab-salud .t{font-family:"Bricolage Grotesque";font-weight:700;font-size:13px}
.tab-salud .s{font-size:11px;color:var(--ink3);line-height:1.35}
.tab-salud.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.tab-salud.sin .n{color:var(--bad)}
.tab-salud.parcial .n{color:var(--warn)}
.tab-salud.vence .n{color:var(--warn)}
.tab-salud.relampago .n{color:var(--acc)}
.tab-salud.ok .n{color:var(--ok)}

/* ── listado de productos ── */
.listado td{vertical-align:middle}
.listado tbody tr{cursor:pointer}
.listado tbody tr:hover{background:var(--panel2)}
.listado .mini{width:38px;height:38px;object-fit:contain;border-radius:5px;background:var(--panel2);display:block}
.listado .sub{font:400 11px "JetBrains Mono";color:var(--ink3);margin-top:2px}
.listado b{font-size:13px}
.resultado{display:flex;gap:12px;align-items:flex-start}
.resultado .ico{font:700 15px/1.3 "Bricolage Grotesque";flex:none;width:20px;text-align:center}
.resultado>div{flex:1}
.resultado .btn{flex:none}
.barra-sel{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:11px 16px;
  border-bottom:1px solid var(--line);background:var(--panel2);font-size:12.5px}
.barra-sel label{display:flex;gap:6px;align-items:center;cursor:pointer}
.barra-sel input[type=checkbox]{accent-color:var(--acc);cursor:pointer}
.sep-flex{margin-left:auto}
.barra-sel select{background:var(--panel);color:var(--ink);border:1px solid var(--line2);
  border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.precio-modo{font:600 10.5px "JetBrains Mono";letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.listado tr.sel{background:var(--acc2)}
.listado th.ordenable{cursor:pointer;user-select:none;white-space:nowrap}
.listado th.ordenable:hover{color:var(--acc)}
.listado .ver-mas{font-size:11.5px;color:var(--acc);white-space:nowrap;opacity:0;transition:opacity .12s}
.listado tbody tr:hover .ver-mas{opacity:1}

/* ── editor de precios ── */
.abre-precio.activa{background:var(--acc2)}
.fila-precio td{padding:0!important;background:var(--panel2)}
.editor{padding:16px 18px;display:flex;flex-direction:column;gap:13px;border-left:3px solid var(--acc)}
.ed-cab{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ed-cab b{font-family:"Bricolage Grotesque";font-size:15px}
.ed-desc{margin-left:auto;display:flex;flex-direction:column;gap:4px;
  font:600 10.5px "JetBrains Mono";letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ed-desc span{display:flex;align-items:center;gap:6px;font:400 13px "JetBrains Mono";
  text-transform:none;letter-spacing:0;color:var(--ink)}
.ed-desc input{width:74px;text-align:right;font:600 17px "JetBrains Mono";padding:7px 9px;
  border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--ink)}
.tprecios input{width:120px;text-align:right;font:400 13px "JetBrains Mono";padding:6px 9px;
  border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--ink)}
.tprecios input:focus{outline:2px solid var(--acc);outline-offset:1px}
.tprecios .pLista{font-size:14px}
.tprecios input.pDesc{width:66px}
.ed-pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* ── flechita de desplegar ── */
.flecha{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--ink2);
  font-size:10px;line-height:1;transition:transform .14s,border-color .14s,color .14s;flex:0 0 auto}
tr:hover .flecha{border-color:var(--acc);color:var(--acc)}
tr.activa .flecha{transform:rotate(90deg);border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.celda-flecha{width:34px;text-align:center;cursor:pointer}
.tprecios tr.cambia td{background:var(--acc2)}
.tprecios .aplicar-fila{opacity:.35}
.tprecios tr.cambia .aplicar-fila{opacity:1}

/* ── mi página ── */
.cupones{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px}
.cupon{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
  display:flex;flex-direction:column;gap:9px;border-top:3px solid var(--acc)}
.cupon.off{border-top-color:var(--line2);opacity:.72}
.cupon-cab{display:flex;gap:9px;align-items:flex-start;justify-content:space-between}
.cupon h4{font-family:"Bricolage Grotesque";font-size:14.5px;font-weight:600;margin:0;line-height:1.3}
.cupon .benef{font:600 21px "JetBrains Mono";letter-spacing:-.02em;color:var(--acc);
  display:flex;align-items:baseline;gap:7px}
.cupon .benef small{font:400 10px "JetBrains Mono";letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3)}
.cupon .benef.sinben{font-size:13px;color:var(--ink3)}
.cupon .meta{font:400 11px "JetBrains Mono";color:var(--ink3);line-height:1.65}
.cupon .meta .cod{color:var(--acc);font-weight:600;letter-spacing:.04em}
.cupon .cuenta{display:flex;gap:16px;margin-top:2px}
.cupon .cuenta div{display:flex;flex-direction:column}
.cupon .cuenta b{font:600 16px "JetBrains Mono"}
.cupon .cuenta small{font:400 9.5px "JetBrains Mono";letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.cupon-pie{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.presu{display:flex;flex-direction:column;gap:5px}
.presu-barra{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.presu-barra i{display:block;height:100%;background:var(--acc);border-radius:3px}
.presu-barra.casi i{background:var(--bad)}
.presu-alerta{font:400 11px/1.5 "JetBrains Mono";color:var(--bad);
  background:var(--badbg);border-radius:5px;padding:6px 8px}
.presu-pie{display:flex;justify-content:space-between;gap:10px;
  font:400 10.5px "JetBrains Mono";color:var(--ink3)}

.form-desc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.form-desc label{display:flex;flex-direction:column;gap:5px;

.form-desc input,.form-desc select{font:400 13px "JetBrains Mono";padding:8px 10px;

.form-desc input:disabled,.form-desc select:disabled{opacity:.5;cursor:not-allowed}

/* ── registro ── */
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:8px 13px;cursor:pointer;

.tab .b{font:600 10.5px "JetBrains Mono";background:var(--line2);color:var(--ink2);

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}

.card .tipo{font:400 9.5px "JetBrains Mono";letter-spacing:.09em;color:var(--ink3)}
.card .nom{font-family:"Bricolage Grotesque";font-weight:700;font-size:14.5px;line-height:1.2}
.card .venc{font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.card .venc b{font-family:"JetBrains Mono";font-variant-numeric:tabular-nums}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;
  max-width:520px;width:calc(100% - 32px);box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,18,16,.55)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);font-family:"Bricolage Grotesque";font-weight:700;font-size:16px}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}

.fld{display:flex;flex-direction:column;gap:5px}

/* El par precio ⟷ descuento: se escribe en cualquiera de los dos. */
.par{display:flex;gap:11px;align-items:flex-end}
.par>div{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.par-lbl{font:400 10px "JetBrains Mono";letter-spacing:.05em;color:var(--ink3)}

.par-pct input{flex:1;min-width:0}

  animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:360px}

<script>
"use strict";

const S = {
  url: localStorage.getItem('cdp_url') || '',
  key: localStorage.getItem('cdp_key') || '',
  data:null, filas:[], items:[], skus:[], camps:[], reloj:{}, log:[], etiquetas:{}, relampagos:[], selRel:new Set(),
  vista:'listado', q:'', filtroSalud:'todos', logFiltro:'todos', descGlobal:30, skuSel: localStorage.getItem('cdp_sku') || '', campFiltro:null, sel:new Set(),
  // Precios: se pueden tener varios productos desplegados a la vez, y el
  // descuento se recuerda POR CONDICIÓN DE VENTA, no por producto.
  preciosAbiertos:new Set(), precioEdit:{},
  // Cupones: null = todavía no se pidió el detalle (presupuesto, código,
  // usados). Va aparte de la sincronización porque cambia con cada venta.
  cupones:null, cuponesLeidos:0, cuponAbierto:null, cuponForm:null, soloAdentro:false
};
/* Subilo cada vez que cambie el archivo. Sirve para saber, mirando la app,
   si el navegador está sirviendo la versión nueva o una cacheada: GitHub Pages
   guarda el index.html un rato y es fácil quedarse con el viejo sin notarlo. */
const VERSION = '2026.08.30-40';
/* Qué necesita el front del backend. Subir SOLO cuando se agrega o cambia una
   acción del /exec, no en cada retoque visual. */
const CONTRATO_MINIMO = 4;

/**
 * Qué deja hacer Meli con los cupones en una cuenta argentina. Esto NO es una
 * suposición: se midió contra la cuenta el 29-ago con el paso 15, endpoint por
 * endpoint, y las respuestas fueron literales.
 *
 *   crear campaña   400 · "User is not allowed to create this type of promotion"
 *   editar campaña  400 · "Site MLA is not enabled for update seller coupon campaigns"
 *   borrar campaña  no probado (destructivo), casi seguro igual que editar
 *   leer            200 · anda, con presupuesto, restante, usados y código
 *   sumar ítem      201 · anda
 *   sacar ítem      anda, pero hay que darle unos segundos después de sumar
 *
 * O sea: la campaña se arma y se toca en el seller center; desde acá se mira y
 * se decide qué publicaciones entran.
 *
 * Los formularios de crear y editar siguen escritos y probados, apagados detrás
 * de esta llave. Si algún día Meli habilita Argentina, no hay que tocar código:
 * abrí la consola del navegador (F12) y pegá
 *     localStorage.setItem('cdp_cupones_api','1')
 * y vuelven. Para apagarlos de nuevo, removeItem con la misma clave.
 */
const CUPONES_SOLO_ITEMS = localStorage.getItem('cdp_cupones_api') !== '1';
const VENTANA = 7;
/* Con cuántos días de anticipación avisar que una oferta se cae sin reemplazo.
   Diez: las campañas de Meli se arman con semanas de anticipación, así que
   enterarse tres días antes ya es tarde para conseguir lugar en la que viene. */
const DIAS_AVISO = 10;
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => (n === '' || n == null || isNaN(n)) ? '—' :
  new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(Math.round(n));
const pes = n => (n === '' || n == null || isNaN(n)) ? '—' : '$ ' + num(n);
const pct = n => (n == null || isNaN(n)) ? '—' : n.toFixed(1).replace('.',',') + '%';
const fecha = s => { if(!s) return '—'; const d = new Date(s);
  return isNaN(d) ? '—' : d.toLocaleDateString('es-AR',
    {day:'2-digit', month:'short', timeZone:'America/Argentina/Buenos_Aires'}); };

/** Los listing_type de Meli en castellano, como los llamás vos. */
const TIPOS = {
  gold_pro:'Premium', gold_special:'Clásica', gold:'Oro', gold_premium:'Oro Premium',
  silver:'Plata', bronze:'Bronce', free:'Gratuita'
};
const tipoLabel = t => TIPOS[t] || t || '—';

/** Meli devuelve varias promociones SIN nombre: la relámpago y el descuento
 *  individual vienen con name vacío, y quedaban en pantalla como "LIGHTNING" o
 *  "PRICE_DISCOUNT". Estos son los nombres con los que las muestra la interfaz. */
const NOMBRE_TIPO = {
  LIGHTNING:'⚡ Oferta relámpago', PRICE_DISCOUNT:'Descuento individual',
  DOD:'Oferta del día', SMART:'Oferta inteligente', DEAL:'Campaña de Mercado Libre',
  PRICE_MATCHING:'Igualación de precio', PRE_NEGOTIATED:'Acuerdo pre-negociado',
  VOLUME:'Descuento por volumen', UNHEALTHY_STOCK:'Liquidación de stock',
  MARKETPLACE_CAMPAIGN:'Campaña de marketplace', SELLER_COUPON_CAMPAIGN:'Cupón'
};
const nombrePromo = x => x.promo || NOMBRE_TIPO[x.tipo] || x.tipo || '—';

/** "3x_campaign" → "3 cuotas" · vacío → "Contado" */
/** Número tolerante: '', null, undefined o basura → null. Evita los NaN en pantalla
 *  cuando la hoja todavía tiene los nombres de columna viejos. */
const nn = v => (v === '' || v == null || isNaN(+v)) ? null : +v;

/**
 * Cómo se llama la opción de cuota de una publicación.
 *
 * Prioridad: la etiqueta que pusiste vos → la campaña de cuotas que trae Meli
 * ("3x_campaign") → nada.
 *
 * Ojo con el "Contado" de antes: era una conclusión, no un dato. La API solo
 * informa las cuotas cuando LAS PAGÁS VOS (sale_terms INSTALLMENTS_CAMPAIGN).
 * Las que ofrece el banco no son un atributo de la publicación y no hay
 * endpoint que las devuelva, así que decir "Contado" ahí era inventar.
 */
const etiquetaDe = p => (S.etiquetas && S.etiquetas[String(p.id)]) || '';
const cuotasPub = p => etiquetaDe(p) || cuotasLabel(p.cuotas) || 'sin definir';

const cuotasLabel = c => {
  const t = String(c || '').trim();
  if (!t) return '';
  const m = t.match(/(\d+)/);
  return m ? m[1] + ' cuotas' : t;
};

async function api(accion, extra) {
  if (!S.url || !S.key) { abrirCfg(); throw new Error('Falta configurar la conexión'); }
  const r = await fetch(S.url, {
    method:'POST', redirect:'follow',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ accion, clave:S.key }, extra || {}))
  });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch(e) { throw new Error('Respuesta inesperada: ' + t.slice(0,140)); }
  if (!j.ok) throw new Error(j.error === 'clave_invalida' ? 'Clave incorrecta' : j.error);
  return j.data;
}
function toast(msg, tipo) {
  const d = document.createElement('div');
  if (tipo) d.className = tipo; d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), tipo === 'bad' ? 9000 : 4500);
}

/* ══ normalización ══ */
const ACEPTAR_SOLO = ['MARKETPLACE_CAMPAIGN','SMART','PRICE_MATCHING','PRE_NEGOTIATED','VOLUME','UNHEALTHY_STOCK'];

/**
 * En estas dos campañas la doc dice "el usuario acuerda Y acepta": Meli propone
 * y vos decidís. Para ellas, status "pending" NO es una promo programada, es una
 * propuesta esperando tu respuesta — así la muestra el seller center.
 * En el resto (co-fondeadas, DEAL, relámpago) "pending" sí es programada.
 */
const ACUERDA_ACEPTA = ['PRE_NEGOTIATED','UNHEALTHY_STOCK'];

/**
 * De qué campañas NO se puede salir por API.
 *
 * Medido sobre PRICE_MATCHING el 30-ago, tres formas distintas:
 *   con promotion_id   404 not_found
 *   sin promotion_id   403 "User doesn't have permissions, you must consume
 *                          the correct access group"
 *   con offer_id       403 el mismo
 *
 * O sea: de las campañas que arma Mercado Libre —las de "solo aceptar"— no se
 * sale desde acá. Ofrecer un botón "Salir" que siempre falla es peor que no
 * ofrecerlo: hace pensar que algo se rompió, y ya vimos que eso termina en
 * apretar tres veces.
 *
 * Solo se lista lo que se midió. SMART es de la misma familia y probablemente
 * esté igual, pero no lo probé, así que no se supone: si algún día Meli
 * contesta ese 403 para otro tipo, se agrega solo (ver aprenderSalidaBloqueada).
 */
/**
 * El link al seller center, filtrado por el producto.
 *
 * La Central de Promociones vive en vendedores.mercadolibre.com.ar y su
 * listado acepta un buscador por SKU. Llevar a la home de promociones obligaba
 * a buscar el producto a mano; con el SKU en la URL cae parado en la fila que
 * hace falta. Si la publicación no tiene SKU cargado, se busca por el MLA, que
 * el mismo buscador acepta.
 */
const SELLER_PROMOS = 'https://vendedores.mercadolibre.com.ar/publicaciones/listado/promos';
const linkPromos = busq => busq
  ? SELLER_PROMOS + '?page=1&search=' + encodeURIComponent(String(busq).trim())
  : SELLER_PROMOS;

const SALIDA_BLOQUEADA = {
  PRICE_MATCHING: 'Meli no habilita salir de esta campaña por API — la arma ella y ' +
                  'contesta "no tenés permisos". Se sale desde el seller center.'
};
try {
  (JSON.parse(localStorage.getItem('cdp_salida_bloqueada') || '[]') || []).forEach(t => {
    if (!SALIDA_BLOQUEADA[t])
      SALIDA_BLOQUEADA[t] = 'Meli rechazó la baja de este tipo de campaña por falta de ' +
                            'permisos cuando lo intentaste. Se sale desde el seller center.';
  });
} catch (e) {}

/** Si Meli rechaza una baja por permisos, se anota para no volver a ofrecerla. */
function aprenderSalidaBloqueada(tipo, mensaje) {
  if (!tipo || SALIDA_BLOQUEADA[tipo]) return false;
  if (!/access group|permis/i.test(String(mensaje || ''))) return false;
  SALIDA_BLOQUEADA[tipo] = 'Meli rechazó la baja de este tipo de campaña por falta de ' +
                           'permisos cuando lo intentaste. Se sale desde el seller center.';
  try {
    const y = JSON.parse(localStorage.getItem('cdp_salida_bloqueada') || '[]');
    if (y.indexOf(tipo) < 0) { y.push(tipo);
      localStorage.setItem('cdp_salida_bloqueada', JSON.stringify(y)); }
  } catch (e) {}
  return true;
}

/* ═══════════════════════════════════════════════════════════
   SALUD DE UN PRODUCTO
   Tres estados, ordenados por urgencia. Es lo que decide el color en el
   listado y lo que cuenta el tablero de arriba.
   ═══════════════════════════════════════════════════════════ */
const SALUD = {
  sin:       { txt:'Sin oferta',        clase:'bad',  ayuda:'Ninguna publicación de este producto muestra descuento hoy. Se vende a precio de lista.' },
  parcial:   { txt:'A medias',          clase:'warn', ayuda:'Algunas publicaciones tienen oferta y otras no. Las que no, se ven caras al lado de las que sí.' },
  // Tener oferta hoy no alcanza si mañana no hay ninguna. Este estado es el
  // único que mira para adelante: avisa antes de que el producto se caiga.
  vence:     { txt:'Se le termina',     clase:'warn', ayuda:'Tiene oferta hoy pero se le vence dentro de los próximos ' + DIAS_AVISO + ' días y no hay ninguna aceptada que tome la posta. Si no se suma a algo, queda a precio de lista.' },
  relampago: { txt:'Falta relámpago',   clase:'acc',  ayuda:'Tiene ofertas corriendo, pero hay relámpagos disponibles sin aceptar: es exposición gratis que estás dejando pasar.' },
  ok:        { txt:'Al día',            clase:'ok',   ayuda:'Todas las publicaciones muestran oferta hoy, y las que se vencen ya tienen quién las reemplace.' }
};
const ORDEN_SALUD = { sin:0, parcial:1, vence:2, relampago:3, ok:4 };

function saludDe(g) {
  if (g.nVig === 0)            return 'sin';
  if (g.nVig < g.pubs.length)  return 'parcial';
  // Antes que la relámpago: perder la oferta cuesta más que no aprovechar una.
  if (g.nSeCae > 0)            return 'vence';
  if (g.nRelampago > 0)        return 'relampago';
  return 'ok';
}

/* ═══════════════════════════════════════════════════════════
   VIGENCIA · cuál de todas las promos manda hoy en la vidriera
   ───────────────────────────────────────────────────────────
   La API marca "started" a todo lo que aceptaste y ya arrancó, pero en la
   publicación se ve UN solo precio. La regla, tal como funciona la CDP:

     · Si dos tarjetas comparten fechas, manda la del precio más bajo.
       La otra sigue adentro pero queda TAPADA — no se ve.
     · Si no comparten (una termina el 31/08 y la otra arranca el 31/08),
       corre la primera hasta que se vence y recién ahí entra la segunda:
       esa segunda es PROGRAMADA, aunque la API ya la haya dado por buena.

   Por eso la app decía "activa" donde el seller center dice "programada".
   ═══════════════════════════════════════════════════════════ */
/* Meli mezcla husos horarios: las fechas del ítem vienen en -03:00
   (2026-08-31T00:00:00-03:00) y las de la campaña en UTC
   (2026-08-31T03:00:00Z). Son el mismo instante, pero comparados crudos dan
   días distintos. Todo se normaliza al día calendario de Buenos Aires, que es
   el que ves en el seller center. Queda como "2026-08-31": se compara como
   texto y ordena bien. */
const TZ_AR = 'America/Argentina/Buenos_Aires';
const _fdia = new Intl.DateTimeFormat('en-CA', {timeZone:TZ_AR, year:'numeric', month:'2-digit', day:'2-digit'});
const _fhora = new Intl.DateTimeFormat('en-GB', {timeZone:TZ_AR, hour:'2-digit', minute:'2-digit', hour12:false});
const diaAR = v => { const d = new Date(v); return isNaN(d) ? null : _fdia.format(d); };
const HOY   = diaAR(new Date());
const horaAR = v => { const d = new Date(v); return isNaN(d) ? null : _fhora.format(d); };

/**
 * ¿La fecha trae hora propia, o es un día suelto?
 * Meli manda las campañas de varios días como 2026-08-31T00:00:00-03:00, que
 * quiere decir "todo el 31", no "hasta la medianoche del 31". Las relámpago en
 * cambio traen hora de verdad —el 31/08 de 0 a 12— y ahí hay que comparar al
 * instante, no al día, porque a las 13 ya se terminó.
 */
const conHora = v => { const h = horaAR(v); return !!h && h !== '00:00'; };

// Argentina no tiene horario de verano, así que el día calendario arranca y
// termina siempre en -03:00.
const _iniDia = v => Date.parse(diaAR(v) + 'T00:00:00-03:00');
const _finDia = v => Date.parse(diaAR(v) + 'T23:59:59.999-03:00');
const AHORA   = Date.now();

/** El instante en que arranca y termina una promo, o ±Infinity si no se sabe. */
const tIni = x => !x.inicio ? -Infinity : (conHora(x.inicio) ? new Date(x.inicio).getTime() : _iniDia(x.inicio));
const tFin = x => !x.fin    ?  Infinity : (conHora(x.fin)    ? new Date(x.fin).getTime()    : _finDia(x.fin));

/** Una promo es intradía si empieza y termina el mismo día: una relámpago. */
const esIntradia = x => x.inicio && x.fin && diaAR(x.inicio) === diaAR(x.fin);

function resolverVigencia(it) {
  // Lo comprometido: aceptado y con fecha. Las propuestas todavía no cuentan.
  const comp = it.promos.filter(x => !x.esCupon && !x.esPropuesta &&
    (x.status === 'started' || x.status === 'pending'));
  comp.forEach(x => { x.vigencia = null; });

  // Cuándo corre cada una. Sin fechas, la API no dice nada: ahí lo único
  // confiable es el estado — "pending" es algo aceptado que TODAVÍA NO arrancó,
  // y dar por corriendo una relámpago que sale el 31 de 0 a 12 la ponía a
  // mandar hoy solo por ser la más barata.
  comp.forEach(x => {
    x._ini = tIni(x); x._fin = tFin(x);
    if (!x.inicio && !x.fin) {
      x._cuando = x.status === 'pending' ? 'futura' : 'corriendo';
      x._sinFecha = true;
    } else {
      x._cuando = AHORA < x._ini ? 'futura' : AHORA > x._fin ? 'vencida' : 'corriendo';
      x._sinFecha = false;
    }
  });

  const corriendo = comp.filter(x => x._cuando === 'corriendo');
  // Las que sí tienen fecha van primero: son las únicas de las que se puede
  // decir cuándo toman la posta.
  const futuras   = comp.filter(x => x._cuando === 'futura')
    .sort((a,b) => (a._sinFecha - b._sinFecha) || (a._ini - b._ini));
  const vencidas  = comp.filter(x => x._cuando === 'vencida');

  // Entre las que comparten fecha gana la más barata.
  const conP  = corriendo.filter(x => x.precio);
  const orden = (conP.length ? conP : corriendo).slice()
    .sort((a,b) => (a.precio ?? Infinity) - (b.precio ?? Infinity));
  const gana  = orden[0] || null;

  corriendo.forEach(x => { x.vigencia = (x === gana) ? 'vigente' : 'tapada'; });
  futuras .forEach(x => { x.vigencia = 'futura';  });
  vencidas.forEach(x => { x.vigencia = 'vencida'; });

  it.vigente  = gana;
  it.activas  = corriendo;
  it.tapadas  = corriendo.filter(x => x !== gana);
  it.futuras  = futuras;
  it.vencidas = vencidas;
  it.proxima  = futuras[0] || null;
  // Hasta cuándo se sostiene el precio de hoy.
  it.hasta = gana && gana.fin ? gana.fin : null;

  /* ¿Se queda sin oferta en los próximos días?
     Tener oferta hoy no alcanza: si la que manda vence el 31 y no hay nada
     aceptado que arranque después, el 1 la publicación queda a precio de lista
     sin que nadie avise. Eso es lo que hay que ver venir, no descubrirlo el
     lunes.

     "Cubierto" quiere decir que hay una promoción futura que arranca antes de
     que se caiga la de hoy, o el mismo día. Se da un día de tolerancia porque
     Meli encadena campañas con el borde justo —DESCUENTAZOS termina el 31-ago
     y CYBER FEST arranca el 31-ago— y eso es continuidad, no un hueco. */
  it.diasHasta = null;
  it.cubierto  = false;
  if (gana && gana.fin && gana._fin !== Infinity) {
    /* Días contados por calendario, no por horas. Una oferta que termina hoy
       a las 23:59 no "queda 1 día": se cae hoy. Restar milisegundos y
       redondear para arriba daba siempre un día de más. */
    it.diasHasta = Math.max(0, Math.round((_iniDia(gana.fin) - _iniDia(new Date())) / DIA));
    it.cubierto  = futuras.some(f => !f._sinFecha && f._ini <= gana._fin + DIA);
  }
  // Se queda colgada: hoy tiene oferta, se le termina pronto y no viene nada.
  it.seCae = !!(gana && it.diasHasta != null &&
                it.diasHasta <= DIAS_AVISO && !it.cubierto);
}

/** "3x_campaign" → 3 · contado → 0. Sirve para ordenar las opciones. */
const nCuotas = p => { const m = String(p.cuotas || '').match(/(\d+)/); return m ? +m[1] : 0; };

/**
 * Familias: una publicación cabecera —la de catálogo, o la de menor lista si el
 * SKU no tiene catálogo— y detrás de la flechita el resto de las opciones de
 * cuota del mismo producto.
 */
function armarFamilia(pubs) {
  const cats = pubs.filter(p => p.catalogo);
  const pool = cats.length ? cats : pubs;
  const cabeza = pool.slice().sort((a,b) => (a.lista || 0) - (b.lista || 0))[0];
  const hijos  = pubs.filter(p => p !== cabeza)
    .sort((a,b) => (b.catalogo - a.catalogo) || (nCuotas(a) - nCuotas(b)) || ((a.lista||0)-(b.lista||0)));
  return { cabeza, hijos };
}

function procesar(d) {
  S.data = d; S.camps = d.campanias || []; S.reloj = d.reloj || {}; S.log = d.log || [];
  S.etiquetas = d.etiquetas || {};
  const vence = {}, fechaCamp = {};
  S.camps.forEach(c => {
    vence[c.promo_id] = c.vence_aceptacion;
    // Las campañas automáticas (SMART, PRICE_MATCHING) no traen fecha en la fila
    // del ítem: la fecha vive en la campaña. Se usa como respaldo.
    if (c.inicio || c.fin) fechaCamp[c.promo_id] = {inicio: c.inicio, fin: c.fin};
  });

  S.filas = (d.datos || []).map(r => {
    const lista = nn(r.original_price) || nn(r.precio_vidriera) || nn(r.precio_lista) || 0;
    const max = nn(r.max_disc), min = nn(r.min_disc), sug = nn(r.sugerido);
    const pp  = nn(r.precio_promo);
    return {
      id:String(r.item_id||''), sku:String(r.sku||''), titulo:String(r.titulo||''),
      foto:r.foto, link:r.link, lista, stock:+r.stock||0,
      listingType:r.listing_type||'', cuotas:r.cuotas||'',
      envioGratis:r.envio_gratis==='SI', catalogo:r.catalogo==='SI',
      tipo:r.promo_tipo||'', promoId:String(r.promo_id||''), promo:r.promo_nombre||'', status:r.status||'',
      precio: pp && pp > 0 ? pp : null, max, min, sug,
      meliPct: nn(r['meli_%']), sellerPct: nn(r['seller_%']),
      boost:r.boost==='SI', precioBoost: nn(r.precio_boost),
      // El inicio y el fin pueden venir de fuentes distintas: la publicación
      // puede traer su día de arranque propio y no el de cierre. Mezclarlos sin
      // avisar produce un rango que no existe —"01-sept → 05-oct" cuando la
      // oferta es de un día—, así que se marca cuál de los dos vino prestado.
      inicio: r.inicio || (fechaCamp[String(r.promo_id||'')]||{}).inicio || '',
      fin:    r.fin    || (fechaCamp[String(r.promo_id||'')]||{}).fin    || '',
      iniDeCamp: !r.inicio && !!(fechaCamp[String(r.promo_id||'')]||{}).inicio,
      finDeCamp: !r.fin    && !!(fechaCamp[String(r.promo_id||'')]||{}).fin,
      fechaDeCamp: !r.inicio && !!(fechaCamp[String(r.promo_id||'')]||{}).inicio,
      offerId: String(r.offer_id||''),
      vence: vence[String(r.promo_id||'')] || '',
      stockMin: nn(r.stock_min), stockMax: nn(r.stock_max),
      subType:r.sub_type||'', montoFijo: nn(r.monto_fijo), pctFijo: nn(r.pct_fijo),
      pisoPct: (max && lista) ? (1 - max/lista)*100 : null,
      techoPct:(min && lista) ? (1 - min/lista)*100 : null,
      sugPct:  (sug && lista) ? (1 - sug/lista)*100 : null,
      promoPct:(pp && lista)  ? (1 - pp/lista)*100  : null,
      comPct: nn(r.com_pct), comFijo: nn(r.com_fijo), envioCosto: nn(r.envio_costo),
      aceptaSolo: ACEPTAR_SOLO.includes(r.promo_tipo),
      esCupon: r.promo_tipo === 'SELLER_COUPON_CAMPAIGN',
      esPropuesta: r.status === 'pending' && ACUERDA_ACEPTA.includes(r.promo_tipo)
    };
  });

  // publicaciones
  const m = new Map();
  S.filas.forEach(f => {
    if (!m.has(f.id)) m.set(f.id, {
      id:f.id, sku:f.sku, titulo:f.titulo, foto:f.foto, link:f.link, lista:f.lista, stock:f.stock,
      listingType:f.listingType, cuotas:f.cuotas, envioGratis:f.envioGratis, catalogo:f.catalogo,
      comPct:f.comPct, comFijo:f.comFijo, envioCosto:f.envioCosto, promos:[]
    });
    // La hoja guarda una fila con las columnas de promo vacías para las
    // publicaciones que no tienen ninguna. Esa fila describe la publicación,
    // no una promoción: no va a la lista.
    if (f.tipo) m.get(f.id).promos.push(f);
  });
  S.items = [...m.values()].map(it => {
    // "dentro" incluye las programadas —ya están comprometidas aunque no hayan
    // arrancado— pero NO las propuestas, que todavía no aceptaste.
    it.dentro = it.promos.filter(p => !p.esCupon && !p.esPropuesta &&
      (p.status==='started' || p.status==='pending'));
    it.propuestas = it.promos.filter(p => p.esPropuesta);
    // Quién manda hoy: fija it.vigente / tapadas / futuras / vencidas.
    resolverVigencia(it);
    it.precioActivo = it.vigente ? it.vigente.precio : null;
    it.descActivo = it.precioActivo && it.lista ? (1 - it.precioActivo/it.lista)*100 : null;
    // Una propuesta es accionable igual que una candidata: se puede aceptar.
    it.candidatas = it.promos.filter(p => !p.esCupon && (p.status==='candidate' || p.esPropuesta));
    it.cupones = it.promos.filter(p => p.esCupon);
    it.dias = (S.reloj[it.id]||{}).diasSinOferta ?? null;
    it.muestras = (S.reloj[it.id]||{}).muestras ?? 0;
    it.sinPromo = it.dentro.length === 0;
    // Lo que importa para la vidriera: hoy no se ve ninguna oferta.
    // Incluye las que tienen algo aceptado pero que todavía no arrancó.
    it.sinVigente = !it.vigente;
    return it;
  });

  // SKUs
  const g = new Map();
  S.items.forEach(it => {
    const k = it.sku || ('s/sku · ' + it.titulo.slice(0,24));
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(it);
  });
  S.skus = [...g.entries()].map(([sku, pubs]) => {
    // Catálogo primero: son las que más exposición dan.
    pubs.sort((a,b) => (b.catalogo - a.catalogo) || ((a.lista||0) - (b.lista||0)));
    const campSet = new Map();
    pubs.forEach(p => p.promos.forEach(x => {
      if (x.esCupon) return;
      const k = x.tipo + '|' + x.promoId;
      if (!campSet.has(k)) campSet.set(k, {clave:k, tipo:x.tipo, promoId:x.promoId, nombre:x.promo, vence:x.vence});
    }));
    return {
      sku, pubs, familia: armarFamilia(pubs),
      titulo: pubs[0].titulo, foto: pubs[0].foto,
      stock: Math.max(...pubs.map(p => p.stock || 0)),
      campanias: [...campSet.values()].sort((a,b) => (a.tipo+a.nombre).localeCompare(b.tipo+b.nombre)),
      nCand: pubs.reduce((a,p) => a + p.candidatas.length, 0),
      nAct:  pubs.reduce((a,p) => a + p.dentro.length, 0),
      nProp: pubs.reduce((a,p) => a + p.propuestas.length, 0),
      nCat:  pubs.filter(p => p.catalogo).length,
      nVig:  pubs.filter(p => p.vigente).length,
      // Relámpago disponible y sin aceptar: exposición gratis que estás dejando pasar.
      nRelampago: pubs.reduce((a,p) => a + p.candidatas.filter(x => x.tipo === 'LIGHTNING').length, 0),
      // Publicaciones con oferta hoy que se caen sin reemplazo, y en cuántos
      // días se cae la primera: es el número que dice cuánto tiempo queda.
      nSeCae: pubs.filter(p => p.seCae).length,
      // Cuál es el escalón que se cae primero y en cuántos días. Un producto
      // puede tener el Contado cubierto un mes y las 6 cuotas cayéndose
      // pasado mañana: decir solo "se le termina" deja la pregunta abierta.
      cae: (() => {
        const c = pubs.filter(p => p.seCae).sort((a,b) => a.diasHasta - b.diasHasta)[0];
        return c ? { dias: c.diasHasta, escalon: cuotasPub(c), id: c.id } : null;
      })(),
      diasSeCae: (() => {
        const d = pubs.filter(p => p.seCae).map(p => p.diasHasta);
        return d.length ? Math.min(...d) : null;
      })(),
      nSinDefinir: pubs.filter(p => !etiquetaDe(p) && !p.cuotas).length,
      nTap:  pubs.reduce((a,p) => a + p.tapadas.length, 0),
      nFut:  pubs.reduce((a,p) => a + p.futuras.length, 0)
    };
  }).map(g => Object.assign(g, { salud: saludDe(g) }))
    .sort((a,b) => (ORDEN_SALUD[a.salud] - ORDEN_SALUD[b.salud]) ||
                   a.sku.localeCompare(b.sku, 'es', {numeric:true}));

  // Todas las relámpago de la cuenta, aceptadas o no. Una fila por publicación.
  S.relampagos = [];
  S.items.forEach(it => it.promos.forEach(x => {
    if (x.tipo !== 'LIGHTNING') return;
    S.relampagos.push({ it, x, puedeSumar: sePuedeSumar(x) });
  }));
  S.relampagos.sort((a,b) =>
    (b.puedeSumar - a.puedeSumar) ||
    String(a.it.sku).localeCompare(String(b.it.sku), 'es', {numeric:true}) ||
    (a.it.lista - b.it.lista));

  // huérfanas: hoy no muestran oferta. Las que tienen una programada para más
  // adelante entran igual —hoy no venden con descuento— pero se marcan aparte.
  S.huerfanas = S.items.filter(it => it.sinVigente)
    .sort((a,b) => (b.lista||0) - (a.lista||0));

}

/* ══ router ══ */
/**
 * Vuelve a dibujar sin perder dónde estabas.
 *
 * Cada sincronización redibuja la pantalla entera y te tiraba al principio de
 * la tabla — con 64 relámpagos en la lista, eso es perder el hilo. Se guarda la
 * posición y se restaura en el mismo cuadro, así no se ve el salto.
 */
function render() {
  const y = window.scrollY;
  _render();
  if (y) requestAnimationFrame(() => window.scrollTo(0, y));
}

function _render() {
  if (!S.data) {
    $('#wrap').innerHTML = vacio('Sin datos todavía',
      S.url ? 'Tocá <b>Sincronizar con Meli</b> para traer publicaciones y promociones.'
            : 'Primero configurá la URL del Apps Script y la clave.');
    return;
  }
  $('#bL').textContent = S.skus.length;
  $('#bS').textContent = S.skus.length;
  $('#bH').textContent = S.huerfanas.length;
  $('#bR').textContent = S.relampagos.filter(r => r.puedeSumar).length;
  $('#bT').textContent = S.camps.length;
  $('#bC').textContent = S.items.filter(i => i.dias != null && i.dias > 0 && i.dias < VENTANA).length;
  $('#bM').textContent = S.camps.filter(c => c.tipo === 'SELLER_COUPON_CAMPAIGN').length;
  ({listado:vListado, sku:vSku, sinpromo:vSinPromo, relampago:vRelampago, precios:vPrecios,
    mipagina:vMiPagina, tarjetas:vCamp, credibilidad:vCred, registro:vLog})[S.vista]();

  // El resultado de la última escritura va arriba de todo, en todas las vistas.
  const ban = bannerResultado();
  if (ban) {
    $('#wrap').insertAdjacentHTML('afterbegin', ban);
    const c = $('#cerrarRes');
    if (c) c.onclick = () => { S.resultado = null; render(); };
  }
}
const vacio = (t,p) => `<div class="panel"><div class="empty"><b>${t}</b><p>${p}</p></div></div>`;

/* ═══════════════════════════════════════════════════════════
   LISTADO DE PRODUCTOS
   La pantalla de entrada: los 28 productos, el estado de cada uno, y un
   tablero arriba para filtrar por lo que hay que hacer.
   ═══════════════════════════════════════════════════════════ */
function vListado() {
  $('#tit').textContent = 'Listado de productos';
  const filtro = S.filtroSalud || 'todos';

  /* "Se le termina" no es un estado más: es una alerta que cruza a los otros.
     Un producto puede estar "a medias" —una publicación sin oferta— y ADEMAS
     tener otra que se cae en dos dias. Con el resto de las tarjetas, que se
     reparten los productos sin repetir, ese caso quedaba escondido: el badge
     mostraba "a medias" y al filtrar por "se le termina" no aparecia, aunque
     tuviera una publicacion por caerse.

     Asi que esta tarjeta cuenta y filtra por lo que de verdad importa —hay o
     no hay algo cayendose— aunque se superponga con otra. Vale mas encontrarlo
     que mantener la prolijidad de que los numeros sumen justo. */
  const seCae = g => g.nSeCae > 0;
  const cuenta = k => k === 'vence'
    ? S.skus.filter(seCae).length
    : S.skus.filter(g => g.salud === k).length;

  const pasa = g => filtro === 'todos' ? true
    : filtro === 'vence' ? seCae(g) : g.salud === filtro;

  const visibles = S.skus.filter(pasa)
    .filter(g => !S.q || (g.sku + ' ' + g.titulo).toLowerCase().includes(S.q.toLowerCase()));

  const tarjeta = (k, titulo, sub) => {
    const n = k === 'todos' ? S.skus.length : cuenta(k);
    const act = filtro === k;
    return `<button class="tab-salud ${k}${act?' on':''}" data-salud="${k}"
      title="${k==='todos'?'Todos los productos':esc(SALUD[k].ayuda)}">
      <span class="n">${n}</span><span class="t">${titulo}</span><span class="s">${sub}</span></button>`;
  };

  // Orden: por defecto el estado (lo urgente arriba). Se puede cambiar
  // tocando cualquier encabezado; el SKU va en su propia columna para poder
  // ordenar por código, que es como está armada tu planilla.
  const ord = S.ordenListado || { col: 'salud', dir: 1 };
  const valor = {
    sku:    g => g.sku,
    titulo: g => g.titulo.toLowerCase(),
    salud:  g => ORDEN_SALUD[g.salud],
    vig:    g => g.pubs.length ? g.nVig / g.pubs.length : 0,
    rel:    g => g.nRelampago,
    // Dentro de los que se caen, primero el que se cae antes.
    cae:    g => g.diasSeCae == null ? Infinity : g.diasSeCae,
    cand:   g => g.nCand,
    lista:  g => Math.min(...[...g.pubs.map(p => p.lista).filter(Boolean), Infinity]),
    stock:  g => g.stock
  };
  const orden = (a, b) => {
    const f = valor[ord.col] || valor.salud;
    const va = f(a), vb = f(b);
    var c = typeof va === 'string' ? va.localeCompare(vb, 'es', {numeric:true}) : (va - vb);
    if (!c) c = a.sku.localeCompare(b.sku, 'es', {numeric:true});
    return c * ord.dir;
  };
  const flecha = c => ord.col === c ? (ord.dir > 0 ? ' ▲' : ' ▼') : '';
  const th = (c, txt, cls) => `<th class="${cls||''} ordenable" data-ord="${c}">${txt}${flecha(c)}</th>`;

  const fila = g => {
    const s = SALUD[g.salud];
    const rango = g.pubs.map(p => p.lista).filter(Boolean);
    return `<tr data-sku="${esc(g.sku)}" class="fila-sku">
      <td>${g.foto?`<img class="mini" src="${esc(g.foto)}" alt="" loading="lazy">`:''}</td>
      <td class="n"><b>${esc(g.sku)}</b></td>
      <td><b>${esc(g.titulo.slice(0,48))}</b>
        <div class="sub">${g.pubs.length} publicaciones${g.nCat?` · ${g.nCat} de catálogo`:''}</div></td>
      <td><span class="chip ${s.clase}" title="${esc(s.ayuda)}">${s.txt}</span>
        ${g.cae ? `<div class="sub" style="color:var(--warn)"
            title="Se le termina la oferta de ${esc(g.cae.escalon)} (${esc(g.cae.id)})${
              g.nSeCae > 1 ? ' y de ' + (g.nSeCae - 1) + ' más' : ''}, y no hay ninguna aceptada que la reemplace.">${

        <div><b>Clásica / Premium</b><span>Es el tipo de publicación. Premium habilita cuotas sin interés pero

        <div><b>Estados</b><span><span class="chip ok">vigente hoy</span> es la que se ve ahora en la publicación ·

          <span class="chip warn">programada</span> aceptada, arranca en su fecha de inicio ·

      </div>

/**
 * Estimación de lo que te queda de una venta a ese precio.
 * comisión = pct·precio + fijo, más el envío si lo regalás.
 * Medido contra el seller center da dentro del ~1%; por eso va como estimado.
 */
function neto(it, precio) {
  if (!precio || it.comPct == null) return null;
  const com = it.comPct * precio + (it.comFijo || 0);
  const env = it.envioGratis ? (it.envioCosto || 0) : 0;
  return precio - com - env;
}

/** Cómo se lee el estado de una promo. Devuelve [clase, texto, explicación]. */
function estadoDe(x) {
  if (x.esPropuesta) return ['warn','propuesta',
    'Mercado Libre te la ofrece con aporte suyo. Todavía no la aceptaste: no está programada ni corriendo.'];
  switch (x.vigencia) {
    case 'vigente': return ['ok','vigente hoy',
      'Es la que se ve en la publicación ahora mismo. Está corriendo y es la más barata de las que comparten fecha.'];
    case 'tapada':  return ['warn','tapada',
      'Estás adentro y corre en las mismas fechas, pero hay otra más barata: esta no se ve. Meli muestra siempre el precio menor.'];
    case 'futura':  return x._sinFecha
      ? ['warn','programada',
         'Aceptada, pero todavía no arrancó y la API no informa cuándo. Las relámpago son así: duran unas horas y Meli fija la ventana el día que salen. Recién ahí pasa a mandar en la vidriera.']
      : ['warn','programada',
         'Aceptada, pero todavía no arrancó. Entra en su fecha de inicio, cuando se vaya la que está corriendo.'];
    case 'vencida': return ['mut','vencida',
      'Su ventana ya pasó. La API la puede seguir informando, pero no afecta el precio.'];
  }
  if (x.status === 'started') return ['ok','adentro','Aceptada y corriendo, sin fechas para ubicarla en el calendario.'];
  if (x.status === 'pending') return ['warn','programada','Aceptada, arranca después.'];
  return ['acc','disponible','Te invitaron y podés entrar cuando quieras.'];
}

/* ═══════════════════════════════════════════════════════════
   SELECTOR DE PUBLICACIÓN
   Con 10 publicaciones por SKU, apilarlas todas es ilegible. Se elige una
   en el desplegable y se muestra solo esa. El Panorama de arriba sigue
   dando la foto completa.
   ═══════════════════════════════════════════════════════════ */
const etiquetaPub = p => [
  cuotasPub(p),
  tipoLabel(p.listingType),
  p.catalogo ? '★ catálogo' : 'propia',
  pes(p.lista),
  p.vigente ? 'con oferta' : p.proxima ? 'arranca ' + fecha(p.proxima.inicio) : 'SIN OFERTA'
].join(' · ');

/* ═══════════════════════════════════════════════════════════
   ESCALERA DE CUOTAS
   Mercado Libre tiene campañas de 3, 9 y 12 cuotas — de 6 no. Por eso el
   escalón de 6 llega siempre vacío desde la API, en todos los productos.
   Pero el precio de lista lo delata: dentro de un SKU, las Premium suben
   ordenadas por cantidad de cuotas, porque el financiamiento se absorbe
   inflando la lista. Con los escalones que la API sí informa como anclas, el
   hueco se deduce solo. Es una propuesta, no un dato: se confirma con un click.
   ═══════════════════════════════════════════════════════════ */
const ESCALERA = [3, 6, 9, 12, 18, 24];

function sugerirEscalera(g) {
  const num = p => { const m = String(p.cuotas || '').match(/(\d+)/); return m ? +m[1] : null; };
  // Las publicaciones espejo (catálogo y propia) son el mismo escalón.
  const escalones = new Map();
  g.pubs.forEach(p => {
    const k = p.listingType + '|' + p.lista;
    if (!escalones.has(k)) escalones.set(k, {lista:p.lista, tipo:p.listingType, pubs:[], sabe:null});
    const e = escalones.get(k);
    e.pubs.push(p);
    if (num(p) != null) e.sabe = num(p);
  });

  const prem = [...escalones.values()].filter(e => e.tipo === 'gold_pro')
    .sort((a,b) => a.lista - b.lista);

  const props = [];

  // Las Clásicas no pueden llevar campaña de cuotas: son el escalón de contado.
  [...escalones.values()].filter(e => e.tipo === 'gold_special' && e.sabe == null)
    .forEach(e => {
      if (e.pubs.every(p => !etiquetaDe(p)))
        props.push({ etiqueta: 'Contado', lista: e.lista, ids: e.pubs.map(p => p.id) });
    });
  var ultimo = null;                     // última cantidad de cuotas asignada
  prem.forEach(e => {
    if (e.sabe != null) { ultimo = e.sabe; return; }
    if (ultimo == null) return;          // sin ancla debajo no se arriesga nada
    const sig = ESCALERA.find(n => n > ultimo);
    if (sig == null) return;
    ultimo = sig;
    // Solo se propone donde todavía no hay etiqueta puesta a mano.
    if (e.pubs.every(p => !etiquetaDe(p)))
      props.push({ etiqueta: sig + ' cuotas', lista: e.lista, ids: e.pubs.map(p => p.id) });
  });
  return props;
}

function pubElegida(g) {
  const guardado = localStorage.getItem('cdp_pub_' + g.sku);
  return g.pubs.find(p => p.id === guardado) || g.familia.cabeza;
}

function selectorPub(g) {
  if (g.pubs.length < 2) return '';
  const sel  = pubElegida(g);
  const cat  = g.pubs.filter(p => p.catalogo);
  const prop = g.pubs.filter(p => !p.catalogo);
  const opt  = p => `<option value="${esc(p.id)}"${p.id===sel.id?' selected':''}>${esc(etiquetaPub(p))}</option>`;
  const grupo = (t, arr) => arr.length ? `<optgroup label="${t}">${arr.map(opt).join('')}</optgroup>` : '';

  return `<div class="selpub">
    <label for="selPub">Ver publicación</label>
    <select id="selPub">${grupo('★ Catálogo — más exposición', cat)}${grupo('Publicaciones propias', prop)}</select>
    <span class="nav-pub">
      <button class="btn xs" id="pubPrev" title="Anterior">‹</button>
      <button class="btn xs" id="pubNext" title="Siguiente">›</button>
    </span>
    <span class="hint2">${g.pubs.length} publicaciones · ${g.nVig} con oferta hoy</span>
    <label class="todas"><input type="checkbox" id="verTodas"${TODAS.has(g.sku)?' checked':''}> ver todas apiladas</label>
  </div>`;
}

const TODAS = new Set(JSON.parse(localStorage.getItem('cdp_todas') || '[]'));

function bloquesPub(g) {
  if (g.pubs.length < 2) return bloquePub(g.familia.cabeza, g, true);
  if (TODAS.has(g.sku)) {
    const orden = [g.familia.cabeza, ...g.familia.hijos];
    return orden.map(p => bloquePub(p, g, p === g.familia.cabeza)).join('');
  }
  return bloquePub(pubElegida(g), g, true);
}
/** Una propuesta o una candidata se pueden sumar; el resto se abandona. */
const sePuedeSumar = x => x.status === 'candidate' || x.esPropuesta;

const diasPara = s => { if (!s) return null; const d = new Date(s);
  return isNaN(d) ? null : Math.ceil((d - new Date())/864e5); };

/* ═══════════════════════════════════════════════════════════
   ¿ESTA OFERTA SE VA A VER?
   Sumarse a una campaña más CARA que la que ya corre en esas fechas no hace
   nada: manda siempre la más barata, y la nueva queda tapada. Podés quedar
   comprometido con una promoción que el comprador no ve un solo día.
   Esto simula día por día la ventana de la candidata contra lo que ya tenés
   aceptado, y dice en cuántos días llegaría a mandar.
   ═══════════════════════════════════════════════════════════ */
const DIA = 864e5;

function visibilidad(pub, precio, inicio, fin) {
  if (!precio || !pub) return null;
  // Sin fechas no se puede simular: una relámpago sin ventana, por ejemplo.
  const desde = Math.max(inicio ? _iniDia(inicio) : _iniDia(new Date()), _iniDia(new Date()));
  const hasta = fin ? _finDia(fin) : null;
  if (!hasta || hasta < desde) return null;

  // Lo ya comprometido, con precio y fechas, que compite en esos días.
  const rivales = pub.promos.filter(x =>
    !x.esCupon && !x.esPropuesta && x.precio &&
    (x.status === 'started' || x.status === 'pending') &&
    x.inicio && x.fin);

  const dias = [];
  for (var t = desde; t <= hasta && dias.length < 400; t += DIA) {
    const compiten = rivales.filter(x => tIni(x) <= t + DIA - 1 && tFin(x) >= t);
    const masBarata = compiten.length ? Math.min(...compiten.map(x => x.precio)) : Infinity;
    dias.push({ t: t, gana: precio < masBarata,
                rival: compiten.filter(x => x.precio === masBarata)[0] || null });
  }
  if (!dias.length) return null;

  const gana = dias.filter(d => d.gana);
  // El rival que más días la tapa, para poder nombrarlo.
  const cuenta = new Map();
  dias.filter(d => !d.gana && d.rival).forEach(d => {
    cuenta.set(d.rival, (cuenta.get(d.rival) || 0) + 1);
  });
  const principal = [...cuenta.entries()].sort((a,b) => b[1] - a[1])[0];

  return {
    total: dias.length,
    visibles: gana.length,
    desde: gana.length ? new Date(gana[0].t).toISOString() : null,
    hasta: gana.length ? new Date(gana[gana.length-1].t).toISOString() : null,
    tapadaPor: principal ? principal[0] : null
  };
}

/** El aviso en castellano, listo para pintar. */
function avisoVisibilidad(v) {
  if (!v) return '';
  if (v.visibles === 0) {
    const r = v.tapadaPor;
    return `<div class="aviso bad"><b>Esta oferta no se va a ver ni un día.</b>
      ${r ? `<b>${esc(nombrePromo(r))}</b> corre a <b>${pes(r.precio)}</b> en todo ese período y es más barata,
             así que manda esa. ` : ''}Te comprometés con una promoción que el comprador nunca ve.</div>`;
  }
  if (v.visibles < v.total) {
    const r = v.tapadaPor;
    return `<div class="aviso"><b>Se va a ver ${v.visibles} de ${v.total} ${v.total===1?'día':'días'}</b>${
      v.visibles === 1 ? ', el ' + fecha(v.desde) : ', del ' + fecha(v.desde) + ' al ' + fecha(v.hasta)}.
      ${r ? `Los otros ${v.total - v.visibles} queda tapada por <b>${esc(nombrePromo(r))}</b> a ${pes(r.precio)}.` : ''}</div>`;
  }
  return `<div class="aviso ok">Se va a ver <b>${v.total === 1 ? 'el único día que dura' : 'los ' + v.total + ' días'}</b>: es la más barata de las que corren en esas fechas.</div>`;
}

/** La ventana de una promo, en el formato que corresponda a su duración. */
function vigenciaTexto(x) {
  if (!x.inicio && !x.fin) {
    return x.tipo === 'LIGHTNING'
      ? `<span style="color:var(--ink3)" title="Las relámpago duran unas horas y Meli fija la ventana el día que salen; hasta entonces la API no la informa.">la ventana la fija Meli</span>`
      : `<span style="color:var(--ink3)" title="Ni el ítem ni la campaña traen fecha en la API">sin fecha en la API</span>`;
  }
  // Relámpago y ofertas del día: importa la hora, no el día. Pero si la ventana
  // cubre el día entero —caso de un acuerdo ofrecido solo para el 1/sep— poner
  // "00:00 a 23:59" es ruido: alcanza con la fecha.
  if (esIntradia(x)) {
    const h1 = horaAR(x.inicio), h2 = horaAR(x.fin);
    const diaEntero = h1 === '00:00' && h2 >= '23:00';
    return `<b>${fecha(x.inicio)}</b><div style="color:var(--acc)">${
      diaEntero ? 'solo ese día' : h1 + ' a ' + h2 + ' h'}</div>`;
  }
  // Si solo el fin vino de la campaña, decirlo: la oferta puede terminar mucho
  // antes y ese "→ 05-oct" sería el de la campaña, no el tuyo.
  const nota = x.iniDeCamp && x.finDeCamp ? 'fecha de la campaña'
             : x.finDeCamp ? 'el cierre es el de la campaña'
             : x.iniDeCamp ? 'el inicio es el de la campaña' : '';
  return fecha(x.inicio) + ' → ' + fecha(x.fin) + (nota
    ? `<div style="font-size:10px;color:var(--ink3)" title="La publicación no informa esa punta de la ventana; se completa con la de la campaña.">${nota}</div>` : '');
}

/** Un bloque por publicación con TODAS sus promos y todos los campos. */
function bloquePub(p, g, esCabeza) {
  const conds = [
    p.catalogo
      ? '<span class="chip cat" title="Publicación de catálogo: compite por la caja de compra y da mucha más exposición">★ catálogo</span>'
      : '<span class="chip mut" title="Publicación propia, no compite en catálogo">publicación propia</span>',
    `<span class="chip mut">${esc(tipoLabel(p.listingType))}</span>`,
    `<span class="chip ${p.cuotas?'acc':'mut'}">${esc(cuotasPub(p))}</span>`,
    p.envioGratis ? '<span class="chip mut">envío gratis</span>' : '<span class="chip mut">envío comprador</span>'
  ].filter(Boolean).join('');

  const rel = p.muestras > 0 ? (() => {
    const ok = p.dias >= VENTANA;
    const w = Math.min(100, Math.round((p.dias/VENTANA)*100));
    return `<div class="reloj" title="Días consecutivos sin oferta activa">
      <div class="prog ${ok?'done':''}"><i style="width:${w}%"></i></div>
      <span>${p.dias}/${VENTANA} d ${ok?'· podés subir precio':''}</span></div>`;
  })() : `<span style="font-size:11.5px;color:var(--ink3)">reloj: sin histórico aún</span>`;

  // Orden de lectura: la que manda hoy arriba, después las tapadas, las que
  // vienen, las disponibles, y al final lo vencido.
  const RANGO = {vigente:0, tapada:1, futura:2, vencida:9};
  const rango = x => x.vigencia != null ? RANGO[x.vigencia]
    : x.esPropuesta ? 3 : x.status === 'candidate' ? 4 : 5;
  const promos = p.promos.filter(x => !x.esCupon)
    .sort((a,b) => (rango(a) - rango(b)) || ((a.precio ?? 9e12) - (b.precio ?? 9e12)));

  // El renglón que explica por qué el precio de la vidriera es ese y no otro.
  const linea = (() => {
    if (p.vigente) {
      const tap = p.tapadas.length
        ? ` Hay ${p.tapadas.length} tarjeta${p.tapadas.length===1?'':'s'} más corriendo en las mismas fechas, pero a precio mayor: quedan tapadas.` : '';
      const sig = !p.proxima ? ''
        : p.proxima._sinFecha
          ? ` Hay además <b>${esc(nombrePromo(p.proxima))}</b> aceptada${p.proxima.precio?` a ${pes(p.proxima.precio)}`:''}, pero la API no dice cuándo sale: cuando salga, va a mandar ella.`
          : ` Después toma la posta <b>${esc(nombrePromo(p.proxima))}</b> el ${fecha(p.proxima.inicio)}${esIntradia(p.proxima)?` de ${horaAR(p.proxima.inicio)} a ${horaAR(p.proxima.fin)} h`:''}${p.proxima.precio?` a ${pes(p.proxima.precio)}`:''}.`;
      return `<div class="aviso ok" style="margin:12px 16px 0">Hoy manda
        <b>${esc(nombrePromo(p.vigente))}</b> a <b>${pes(p.vigente.precio)}</b>${p.hasta?` hasta el ${fecha(p.hasta)}`:''}.${tap}${sig}</div>`;
    }
    if (p.proxima) {
      return `<div class="aviso" style="margin:12px 16px 0">Hoy se vende
        <b>sin oferta</b>, a ${pes(p.lista)}. Ya está aceptada
        <b>${esc(nombrePromo(p.proxima))}</b>${p.proxima.precio?` a ${pes(p.proxima.precio)}`:''}, pero ${p.proxima._sinFecha
          ? 'la API no informa cuándo sale — hasta que salga, no se ve'
          : `arranca el ${fecha(p.proxima.inicio)}${esIntradia(p.proxima)?` de ${horaAR(p.proxima.inicio)} a ${horaAR(p.proxima.fin)} h`:''} — hasta ahí no se ve`}.</div>`;
    }
    if (p.vencidas.length) {
      return `<div class="aviso bad" style="margin:12px 16px 0">Sin oferta hoy.
        La última (<b>${esc(p.vencidas[p.vencidas.length-1].promo || '—')}</b>) venció el ${fecha(p.vencidas[p.vencidas.length-1].fin)}.</div>`;
    }
    return `<div class="aviso bad" style="margin:12px 16px 0">Sin ninguna oferta corriendo ni programada.</div>`;
  })();

  const filas = promos.map(x => {
    const est = estadoDe(x);
    const d = diasPara(x.vence);
    const accion = sePuedeSumar(x)
      ? `<button class="btn xs" data-add="${esc(p.id)}|${esc(x.tipo)}|${esc(x.promoId)}">${x.esPropuesta?'Aceptar':'Sumar'}</button>`
      : SALIDA_BLOQUEADA[x.tipo]
        ? `<a class="btn xs" href="${esc(linkPromos(p.sku || p.id))}"
             target="_blank" rel="noopener"
             title="${esc(SALIDA_BLOQUEADA[x.tipo])} — te lleva al listado del seller center filtrado por ${esc(p.sku || p.id)}.">Salir en Meli ↗</a>`
        : `<button class="btn xs danger" data-del="${esc(p.id)}|${esc(x.tipo)}|${esc(x.promoId)}">Salir</button>`;
    return `<tr>
      <td><span class="chip ${est[0]}" title="${esc(est[2])}">${est[1]}</span>
        <div style="font:400 9.5px 'JetBrains Mono';color:var(--ink3);margin-top:3px"
             title="Estado literal que devuelve la API">api: ${esc(x.status)}</div></td>
      <td><b style="font-size:12px">${esc(nombrePromo(x))}</b>
        <div style="font:400 10px 'JetBrains Mono';color:var(--ink3)">${esc(x.tipo)}${
          x.aceptaSolo?' · solo aceptar':' · definís precio'}</div>
        ${!sePuedeSumar(x) && SALIDA_BLOQUEADA[x.tipo]
          ? `<div style="font:400 10px 'JetBrains Mono';color:var(--warn);margin-top:2px"
               title="${esc(SALIDA_BLOQUEADA[x.tipo])}">la baja va por el seller center</div>` : ''}</td>
      <td class="r n">${x.precio?pes(x.precio):'—'}
        <div style="font-size:10.5px;color:var(--ink3)">${x.promoPct!=null?'−'+pct(x.promoPct)+' de lista':''}</div>
        ${(() => {
          /* El segundo porcentaje, que es el que decide si Meli acepta.
             La regla del 5% NO se mide contra el precio de lista sino contra
             lo que estás vendiendo hoy, y son números muy distintos: con
             lista 11.427, vendiendo a 7.999 y una relámpago a 7.599, contra
             la lista da 33,5% y contra lo que vendés da 5,0%. Restando los
             porcentajes de lista salen "3,5 puntos", que no es ninguna de las
             dos cosas — y es la cuenta que uno hace sin querer si solo ve una
             columna. Por eso van los dos, cada uno con su referencia escrita. */
          const ref = p.precioActivo;
          if (!x.precio || !ref || x.precio >= ref) return '';
          const c = (1 - x.precio / ref) * 100;
          return `<div style="font-size:10.5px;color:${c >= 5 ? 'var(--ok)' : 'var(--bad)'}"
            title="La regla del 5% se mide contra lo que vendés hoy (${pes(ref)}), no contra la lista.">
            −${pct(c)} de lo que vendés</div>`;
        })()}</td>
      ${(() => {
        // En las campañas de "solo aceptar" no hay ventana de precio: Meli fija
        // el número y vos aceptás o no. Mostrar "—" ahí hacía pensar en un dato
        // que falta, cuando en realidad no existe.
        if (x.aceptaSolo && !x.max && !x.sug && !x.min)
          return `<td class="r" colspan="3" style="color:var(--ink3);font-size:11.5px">
            Sin ventana de precio — <b style="color:var(--ink2)">lo fija Mercado Libre</b>. Aceptás o no.</td>`;
        return `<td class="r n">${x.max?pes(x.max):'—'}<div style="font-size:10.5px;color:var(--ink3)">${x.pisoPct!=null?'−'+pct(x.pisoPct):''}</div></td>
      <td class="r n">${x.sug?pes(x.sug):'—'}<div style="font-size:10.5px;color:var(--ink3)">${x.sugPct!=null?'−'+pct(x.sugPct):''}</div></td>
      <td class="r n">${x.min?pes(x.min):'—'}<div style="font-size:10.5px;color:var(--ink3)">${x.techoPct!=null?'−'+pct(x.techoPct):''}</div></td>`;
      })()}
      <td class="r n" title="Estimado: precio menos comisión y envío">${(() => {
        const v = neto(p, x.precio || x.sug || x.max);
        return v == null ? '—' : `<b>${pes(v)}</b>`;
      })()}</td>
      <td class="c">${x.meliPct!=null?`<span class="chip ok">ML ${x.meliPct}%</span><div style="font-size:10.5px;color:var(--ink3);margin-top:2px">vos ${x.sellerPct}%</div>`:'<span style="color:var(--ink3)">—</span>'}</td>
      <td style="font-size:11px;color:var(--ink2);white-space:nowrap">
        ${vigenciaTexto(x)}
        ${d!=null?`<div style="color:${d<3?'var(--bad)':'var(--ink3)'}">${d<0?'vencida':'quedan '+d+'d'}</div>`:''}</td>
      <td>${x.boost?'<span class="chip warn">boost</span>':''}
        ${x.stockMin!=null&&x.stockMax!=null?`<span class="chip mut">stock ${x.stockMin}–${x.stockMax}</span>`:''}</td>
      <td class="r">${accion}${(() => {
        // Aviso corto en la fila: si sumarse no va a mover la vidriera, decirlo acá.
        if (!sePuedeSumar(x)) return '';
        const v = visibilidad(p, x.precio, x.inicio, x.fin);
        if (!v || v.visibles === v.total) return '';
        return v.visibles === 0
          ? `<div class="chip bad" style="margin-top:5px" title="Ya tenés una promoción más barata corriendo en esas mismas fechas: esta quedaría tapada todos los días.">no se vería</div>`
          : `<div class="chip warn" style="margin-top:5px" title="Los otros días queda tapada por una más barata.">se vería ${v.visibles}/${v.total} d</div>`;
      })()}</td>
    </tr>`;
  }).join('');

  return `<div class="pub${p.catalogo?' escat':''}${esCabeza?' cab':''}">
    <div class="pub-h">
      <span class="cuota">${esc(cuotasPub(p))}</span>
      <button class="btn xs lapiz" data-etq="${esc(p.id)}"
        title="Meli no expone por API la opción de cuota de esta publicación. Escribila una vez y queda guardada.">${etiquetaDe(p)?'editar':'poner cuotas'}</button>
      ${p.vigente ? '<span class="chip ok">con oferta hoy</span>'
        : p.proxima ? '<span class="chip warn">arranca ' + fecha(p.proxima.inicio) + '</span>'
        : '<span class="chip bad">sin oferta hoy</span>'}
      <span class="id">${esc(p.id)}</span>
      ${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener" style="font-size:11.5px">ver en Meli ↗</a>`:''}
      <a href="${esc(linkPromos(p.sku || p.id))}" target="_blank" rel="noopener"
         style="font-size:11.5px"
         title="Abre la Central de Promociones del seller center ya filtrada por ${esc(p.sku || p.id)}">promos en Meli ↗</a>
      <div class="conds">${conds}</div>
      <div class="sep">
        <span>Lista <b>${pes(p.lista)}</b></span>
        <span>Stock <b>${num(p.stock)}</b></span>
        <span>Vendiendo a <b>${p.precioActivo?pes(p.precioActivo):'—'}</b>${p.descActivo?` <small style="color:var(--ink3)">−${pct(p.descActivo)}</small>`:''}</span>
        <span title="Promociones que la app tiene guardadas para esta publicación, sin contar cupones. Si acá dice menos de las que ves en Meli, faltan datos: sincronizá.">Promos <b>${promos.length}</b>${p.cupones.length?` <small style="color:var(--ink3)">+${p.cupones.length} cup.</small>`:''}</span>
        ${neto(p, p.precioActivo)!=null?`<span title="Estimado: precio menos comisión${p.envioGratis?' y envío':''}">Recibís <b>${pes(neto(p,p.precioActivo))}</b></span>`:''}
        ${p.comPct!=null?`<span style="font-size:11px;color:var(--ink3)">com. ${(p.comPct*100).toFixed(1).replace('.',',')}%${p.envioGratis&&p.envioCosto?` + envío ${pes(p.envioCosto)}`:''}</span>`:''}
        ${rel}
      </div>
    </div>
    ${linea}
    <div class="scroll"><table>
      <thead><tr>
        <th>Estado</th><th>Campaña</th><th class="r">Precio</th>
        <th class="r">Techo<br>máx. permitido</th><th class="r">Sugerido<br>por Meli</th><th class="r">Piso<br>mín. permitido</th>
        <th class="r">Recibís<br>estimado</th>
        <th class="c">Co-fondeo</th><th>Vigencia</th><th></th><th></th>
      </tr></thead>
      <tbody>${filas || '<tr><td colspan="11" style="color:var(--ink3);padding:16px">Sin promociones para esta publicación.</td></tr>'}</tbody>
    </table></div>
    ${!p.candidatas.length ? `<div style="padding:11px 16px;border-top:1px solid var(--line);
        display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink2)">
      <span>${p.promos.length
        ? 'No queda ninguna campaña disponible para sumar ahora.'
        : 'Ninguna campaña invitó a esta publicación.'}</span>
      <button class="btn xs p" data-man="${esc(p.id)}">Crear descuento individual</button>
    </div>` : ''}
  </div>`;
}

function cuponesSku(g) {
  const cup = g.pubs[0] ? g.pubs[0].cupones : [];
  if (!cup.length) return '';
  return `<div class="panel"><h3>Cupones del vendedor
    <span class="hint">Aplican a nivel cuenta, no por publicación</span></h3>
    <div class="scroll"><table>
      <thead><tr><th>Cupón</th><th>Tipo</th><th class="r">Beneficio</th><th>Vigencia</th><th>Estado</th></tr></thead>
      <tbody>${cup.map(c => `<tr>
        <td><b style="font-size:12px">${esc(c.promo)}</b></td>
        <td><span class="chip mut">${esc(c.subType)}</span></td>
        <td class="r n">${c.montoFijo!=null?pes(c.montoFijo):c.pctFijo!=null?c.pctFijo+'%':'—'}</td>
        <td style="font-size:11.5px">${fecha(c.inicio)} → ${fecha(c.fin)}</td>
        <td><span class="chip ${c.status==='started'?'ok':'acc'}">${esc(c.status)}</span></td>
      </tr>`).join('')}</tbody></table></div></div>`;
}

function engancharBuscador() {
  const i = $('#qsku');
  if (i) {
    let t;
    i.oninput = e => { clearTimeout(t); t = setTimeout(() => {
      S.q = e.target.value.trim();
      const exacto = S.skus.find(x => x.sku.toLowerCase() === S.q.toLowerCase());
      if (exacto) { S.skuSel = exacto.sku; localStorage.setItem('cdp_sku', exacto.sku); }
      else if (S.skuSel && !S.q) { }
      render();
      const j = $('#qsku'); if (j) { j.focus(); j.setSelectionRange(j.value.length, j.value.length); }
    }, 200); };
  }
  $$('[data-sku]').forEach(b => b.onclick = () => {
    S.skuSel = b.dataset.sku; S.q = ''; localStorage.setItem('cdp_sku', S.skuSel); render();
  });
  if ($('#limpiarSku')) $('#limpiarSku').onclick = () => {
    S.skuSel = ''; S.q = ''; localStorage.removeItem('cdp_sku'); render();
  };
}

function engancharAcciones() {
  const sc = $('#sugCuotas');
  if (sc) sc.onclick = async () => {
    const g = S.skus.find(x => x.sku === S.skuSel);
    const props = sugerirEscalera(g);
    if (!props.length) return;
    const detalle = props.map(p => '   ' + pes(p.lista) + '  →  ' + p.etiqueta +
      (p.ids.length > 1 ? '  (' + p.ids.length + ' publicaciones)' : '')).join('\n');
    if (!confirm('Deducido del precio de lista del SKU ' + g.sku + ':\n\n' + detalle +
      '\n\nMercado Libre informa los escalones de 3, 9 y 12 cuotas pero no el de 6.\n' +
      'Estos salen de ordenar por precio y completar el hueco.\n\n¿Los guardo? Después podés corregir cualquiera a mano.')) return;
    const fin = ocupar(sc, 'Guardando', 'etiqueta');
    try {
      await api('etiquetas', { lote: props.map(p => ({ item_ids: p.ids, texto: p.etiqueta })) });
      props.forEach(p => p.ids.forEach(id => { S.etiquetas[id] = p.etiqueta; }));
      fin(); toast(props.length + ' escalones etiquetados', 'ok'); render();
    } catch (e) { fin(false); toast(e.message, 'bad'); }
  };
  // La opción de cuota se escribe a mano: la API no la informa (ver paso11).
  $$('[data-etq]').forEach(b => b.onclick = async () => {
    const it = S.items.find(x => x.id === b.dataset.etq);
    if (!it) return;
    const actual = (S.etiquetas || {})[it.id] || '';
    // El espejo catálogo/propia es la misma oferta publicada dos veces: mismo
    // precio de lista y mismo tipo. Se etiquetan juntas para no cargar el doble.
    const g = S.skus.find(x => x.sku === it.sku);
    const hermanas = g ? g.pubs.filter(x => x.lista === it.lista && x.listingType === it.listingType) : [it];
    const txt = prompt('¿En cuántas cuotas se vende esta publicación?\n\n' +
      tipoLabel(it.listingType) + ' · ' + pes(it.lista) +
      (hermanas.length > 1 ? '\n\nSon ' + hermanas.length + ' publicaciones con este precio (catálogo y propia): se etiquetan las dos.' : '\n' + it.id) +
      '\n\nEscribí por ejemplo "6 cuotas" o "Contado". Vacío la borra.', actual);
    if (txt === null) return;
    const fin = ocupar(b, 'Guardando', 'etiqueta');
    try {
      await api('etiqueta', { item_ids: hermanas.map(x => x.id), texto: txt });
      hermanas.forEach(x => { S.etiquetas[x.id] = String(txt).trim(); });
      fin(); toast(hermanas.length > 1 ? hermanas.length + ' publicaciones etiquetadas' : 'Etiqueta guardada', 'ok');
      render();
    } catch (e) { fin(false); toast(e.message, 'bad'); }
  });
  // Traer de Meli solo este SKU: ~1 s contra los ~15 del sync completo.
  const rs = $('#refSku');
  if (rs) rs.onclick = async () => {
    const sku = S.skuSel;
    const fin = ocupar(rs, 'Actualizando', 'sku');
    try {
      const r = await api('sku', { sku: sku });
      const seg = fin();
      const ids = new Set((r.filas || []).map(x => String(x.item_id)));
      S.data.datos = S.data.datos.filter(x => !ids.has(String(x.item_id))).concat(r.filas || []);
      procesar(S.data); render();
      toast(r.publicaciones + ' publicaciones al día · ' + seg + 's', 'ok');
    } catch (e) { fin(false); toast(e.message, 'bad'); }
  };
  // Desplegable de publicación: se acuerda de la última que miraste por SKU.
  const s = $('#selPub');
  if (s) {
    const g = S.skus.find(x => x.sku === S.skuSel);
    s.onchange = () => { localStorage.setItem('cdp_pub_' + S.skuSel, s.value); render(); };
    const mover = paso => {
      const i = g.pubs.findIndex(p => p.id === pubElegida(g).id);
      const n = g.pubs[(i + paso + g.pubs.length) % g.pubs.length];
      localStorage.setItem('cdp_pub_' + S.skuSel, n.id); render();
    };
    const pv = $('#pubPrev'), nx = $('#pubNext');
    if (pv) pv.onclick = () => mover(-1);
    if (nx) nx.onclick = () => mover(1);
    const v = $('#verTodas');
    if (v) v.onchange = () => {
      v.checked ? TODAS.add(S.skuSel) : TODAS.delete(S.skuSel);
      localStorage.setItem('cdp_todas', JSON.stringify([...TODAS])); render();
    };
  }
  $$('[data-man]').forEach(b => b.onclick = () => {
    const it = S.items.find(x => x.id === b.dataset.man);
    if (it) abrirManual(it);
  });
  $$('[data-add]').forEach(b => b.onclick = () => {
    const [id,tipo,pid] = b.dataset.add.split('|');
    const it = S.items.find(x => x.id === id);
    const p  = it && it.promos.find(x => x.tipo===tipo && x.promoId===pid);
    if (p) abrirSumar({it, p}); else toast('No encontré esa promoción','bad');
  });
  $$('[data-del]').forEach(b => b.onclick = async () => {
    const [id,tipo,pid] = b.dataset.del.split('|');
    if (!confirm('¿Sacar esta publicación de ' + tipo + '?\n\nOjo: el reloj de credibilidad de 7 días arranca recién ahora.')) return;
    try { await escribir('salir', {item_id:id, promotion_type:tipo, promotion_id:pid||undefined},
                         'Salió de ' + tipo, b); }
    catch(e){ toast(e.message,'bad'); }
  });
}

/** La candidata que deja el mejor precio: el techo más alto. */
function mejorCandidata(it) {
  const c = it.candidatas.filter(p => p.max || p.sug || p.precio);
  if (!c.length) return it.candidatas[0] || null;
  return c.slice().sort((a,b) => (b.max||b.sug||b.precio||0) - (a.max||a.sug||a.precio||0))[0];
}

    <div class="kpis">
      <div class="kpi good"><span class="k">Podés sumarte</span><span class="v">${libres.length}</span><span class="d">publicaciones invitadas</span></div>

      <b>no cuentan para la ventana de credibilidad</b> — junto con las del Día son las únicas
      que no ensucian el piso de los ${VENTANA} días. Podés vender con descuento sin frenar el reloj.</div>

    ${libres.length ? `<div class="panel">
      <h3>Disponibles para sumar <span class="hint">${libres.length} publicaciones</span></h3>
      <div class="barra-sel">
        <label><input type="checkbox" id="ckTodas"> Seleccionar todas</label>
        <span id="selCuenta">${nSel} seleccionadas</span>
        <span class="sep-flex"></span>
        <label class="precio-modo">Precio a usar
          <select id="modoPrecio">
            <option value="max"${S.modoRel!=='sug'?' selected':''}>Techo — el de mejor margen</option>

    ${dentro.length ? `<div class="panel"><h3>Ya adentro
      <span class="hint">${dentro.length} publicaciones</span></h3>

  $$('.ckRel').forEach(ck => ck.onclick = e => {

  });

    libres.forEach(r => ct.checked ? sel.add(clave(r)) : sel.delete(clave(r)));

    refrescarBarra();
  };

  if (mp) mp.onchange = () => { S.modoRel = mp.value; };

  $$('[data-rel]').forEach(b => b.onclick = () => {
    const r = libres.find(x => x.it.id === b.dataset.rel);
    if (r) abrirSumar({ it: r.it, p: r.x });
  });

  const sr = $('#sumarRel');
  if (sr) sr.onclick = async () => {
    const modo = (($('#modoPrecio')||{}).value) || 'max';
    const elegidas = libres.filter(r => sel.has(clave(r)));
    const acciones = [], detalle = [];
    elegidas.forEach(r => {
      const { it, x } = r;
      const precio = modo === 'sug' ? (x.sug || x.max) : (x.max || x.sug);
      const stock = x.stockMin || 1;
      if (!precio) return;
      acciones.push({ accion:'sumar', item_id: it.id, promotion_type:'LIGHTNING',
                      promotion_id: x.promoId || undefined,
                      deal_price: Math.round(precio), stock: stock });
      detalle.push('   ' + it.sku + ' · ' + cuotasPub(it) + '  →  ' + pes(precio) + '  (' + stock + ' u.)');
    });
    if (!acciones.length) { toast('Ninguna tiene precio para usar','warn'); return; }

      'la publicación entera.\n\n¿Confirmás?')) return;

    const fin = ocupar(sr, 'Sumando', 'lote');
    try {
      const res = await api('lote', { acciones });
      const ok = (res||[]).filter(x => x.ok).length;
      const mal = (res||[]).filter(x => !x.ok);
      const seg = fin();
      // Con un lote no alcanza un toast: hay que poder leer cuáles fallaron y
      // por qué, sin que se vaya solo.
      S.resultado = {
        ok: mal.length === 0 ? true : (ok ? null : false),
        seg: seg,
        titulo: mal.length === 0
          ? ok + ' publicaciones sumadas a relámpago'
          : ok + ' sumadas y ' + mal.length + ' rechazadas',
        detalle: mal.length
          ? 'Rechazadas: ' + mal.slice(0,6).map(x => x.item_id + ' (' + x.error + ')').join(' · ') +
            (mal.length > 6 ? ' y ' + (mal.length-6) + ' más' : '') + '. El detalle completo está en Registro.'
          : 'Verificalas en la tabla de abajo: tienen que haber pasado a "ya adentro".'
      };
      sel.clear();
      await cargar();
    } catch (e) { fin(false); toast(e.message,'bad'); }
  };
}

/* ═══════════════════════════════════════════════════════════
   ACTUALIZACIÓN DE PRECIOS
   El precio de lista no se escribe a mano: se arma desde el precio que querés
   que vea el cliente y el descuento que querés mostrar.
       lista = target / (1 − descuento)
   Con target $129.999 y 30%, la lista es $185.713 — la misma cuenta de tu
   planilla. Cada escalón de cuotas tiene su propio target.
   ═══════════════════════════════════════════════════════════ */
const listaDesde = (target, desc) =>
  (!target || desc >= 100) ? null : Math.round(target / (1 - desc / 100));

/** Los escalones de un SKU: catálogo y propia del mismo precio son uno solo. */
function escalonesDe(g) {
  const m = new Map();
  g.pubs.forEach(p => {
    const k = p.listingType + '|' + p.lista;
    if (!m.has(k)) m.set(k, { lista: p.lista, tipo: p.listingType, etiqueta: cuotasPub(p), pubs: [] });
    m.get(k).pubs.push(p);
  });
  return [...m.values()].sort((a,b) => a.lista - b.lista);
}

     y el cambio que estabas por aplicar se perdía sin avisar.

            <td class="c"><span class="pDelta" data-i="${i}" style="color:var(--ink3);font-size:11.5px">sin cambio</span></td>
            <td class="r"><span class="sub">${e.pubs.map(p=>p.id).join('<br>')}</span></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>

      <div class="ed-pie">
        <div class="aviso bad" style="flex:1;margin:0">

function engancharPrecios() {
  $$('.abre-precio').forEach(t => t.onclick = () => {
    const k = t.dataset.sku;
    S.preciosAbiertos.has(k) ? S.preciosAbiertos.delete(k) : S.preciosAbiertos.add(k);
    render();
  });
  const at = $('#abrirTodos');
  if (at) at.onclick = () => {
    if (S.preciosAbiertos.size) S.preciosAbiertos.clear();
    else S.skus.filter(g => !S.q || (g.sku+' '+g.titulo).toLowerCase().includes(S.q.toLowerCase()))
               .forEach(g => S.preciosAbiertos.add(g.sku));
    render();
  };
  const i = $('#qprecio');
  if (i) { let t; i.oninput = e => { clearTimeout(t);
    t = setTimeout(() => { S.q = e.target.value.trim(); render(); const c=$('#qprecio'); if(c) c.focus(); }, 250); }; }

  // Cada tabla abierta se engancha por separado: se pueden tener varios
  // productos desplegados a la vez y cada uno recalcula lo suyo.
  $$('.tprecios').forEach(tabla => {
    const sku = tabla.dataset.sku;
    const g = S.skus.find(x => x.sku === sku);
    if (!g) return;
    const escs = escalonesDe(g);
    const q = sel => [...tabla.querySelectorAll(sel)];

    /* Recalcula sin volver a dibujar la pantalla: así se puede tipear de
       corrido sin que el foco salte de campo. */
    const recalcular = () => {
      q('.pTarget').forEach(inp => {
        const idx = +inp.dataset.i, e = escs[idx];
        const dInp = tabla.querySelector(`.pDesc[data-i="${idx}"]`);
        const d = dInp ? (+dInp.value || 0) : 0;
        const nueva = listaDesde(+inp.value, d);
        const celda = tabla.querySelector(`.pLista[data-i="${idx}"]`);
        const delta = tabla.querySelector(`.pDelta[data-i="${idx}"]`);
        const fila  = tabla.querySelector(`tr[data-esc="${idx}"]`);
        if (celda) celda.textContent = nueva ? pes(nueva) : '—';
        if (!delta) return;
        // Tolerancia de 2 pesos: ida y vuelta por el redondeo puede dar $1 de
        // diferencia sin que hayas tocado nada, y eso no es un cambio.
        if (!nueva || Math.abs(nueva - e.lista) <= 2) {
          delta.textContent = 'sin cambio'; delta.style.color = 'var(--ink3)';
          if (fila) fila.classList.remove('cambia');
          return;
        }
        const dif = nueva - e.lista, pc = (dif / e.lista) * 100;
        delta.textContent = (dif > 0 ? '▲ ' : '▼ ') + pes(Math.abs(dif)) + '  (' + pct(Math.abs(pc)) + ')';
        delta.style.color = dif > 0 ? 'var(--ok)' : 'var(--bad)';
        if (fila) fila.classList.add('cambia');
      });
    };
    // Los dos campos se recuerdan apenas se tocan: si cerrás y volvés a abrir,
    // o abrís otro producto, lo que estabas por aplicar sigue ahí.
    const recordar = inp => {
      const idx = +inp.dataset.i;
      const guarda = (S.precioEdit[sku] || (S.precioEdit[sku] = {}));
      const e = guarda[idx] || (guarda[idx] = {});
      if (inp.classList.contains('pDesc')) { e.desc = +inp.value || 0; S.descGlobal = e.desc || S.descGlobal; }
      else e.target = +inp.value || 0;
      recalcular();
    };
    q('.pTarget').forEach(inp => inp.oninput = () => recordar(inp));
    q('.pDesc').forEach(inp => inp.oninput = () => recordar(inp));
    recalcular();
  });

  $$('[data-aplicar]').forEach(ap => ap.onclick = () => aplicarPrecios(ap, ap.dataset.aplicar));
}

async function aplicarPrecios(boton, sku) {
  const tabla = $(`.tprecios[data-sku="${CSS.escape(sku)}"]`);
  const g = S.skus.find(x => x.sku === sku);
  if (!tabla || !g) return;
  const escs = escalonesDe(g);
  const cambios = [];
  [...tabla.querySelectorAll('.pTarget')].forEach(inp => {
    const idx = +inp.dataset.i, e = escs[idx];
    const dInp = tabla.querySelector(`.pDesc[data-i="${idx}"]`);
    const d = dInp ? (+dInp.value || 0) : 0;
    const nueva = listaDesde(+inp.value, d);
    if (nueva && Math.abs(nueva - e.lista) > 2)
      cambios.push({ item_ids: e.pubs.map(p => p.id), precio: nueva,
                     etiqueta: e.etiqueta, antes: e.lista, desc: d });
  });
  if (!cambios.length) { toast('No hay ninguna condición con precio distinto del actual', 'warn'); return; }

  const detalle = cambios.map(c =>
    '   ' + c.etiqueta + ' (−' + c.desc + '%):  ' + pes(c.antes) + '  →  ' + pes(c.precio) +
    '   (' + c.item_ids.length + ' publicación' + (c.item_ids.length>1?'es':'') + ')').join('\n');
  if (!confirm('SKU ' + sku + ' — se van a cambiar ' + cambios.length +
    ' precios de lista en Mercado Libre:\n\n' + detalle +
    '\n\nOJO: si estas publicaciones tienen ofertas corriendo, Meli las va a sacar y la ' +
    'base de credibilidad queda anclada al precio viejo.\n\n¿Confirmás?')) return;

  const fin = ocupar(boton, 'Aplicando', 'precios');
  try {
    const r = await api('precios', { cambios: cambios.map(c => ({ item_ids: c.item_ids, precio: c.precio })) });
    const okN = (r.resultados||[]).filter(x => x.ok).length;
    const mal = (r.resultados||[]).filter(x => !x.ok);
    const seg = fin();
    S.resultado = {
      ok: mal.length === 0 ? true : (okN ? null : false),
      seg: seg,
      titulo: mal.length === 0
        ? okN + ' precios de lista actualizados en el SKU ' + sku
        : okN + ' actualizados y ' + mal.length + ' rechazados',
      detalle: mal.length
        ? 'Rechazados: ' + mal.slice(0,6).map(x => x.item_id + ' (' + x.error + ')').join(' · ') +
          (mal.length > 6 ? ' y ' + (mal.length-6) + ' más' : '') + '. El detalle completo está en Registro.'
        : 'Revisá la columna "Lista actual": tiene que coincidir con lo que pusiste.'
    };
    await cargar();
  } catch (e) { fin(false); toast(e.message, 'bad'); }
}

/* ═══════════════════════════════════════════════════════════
   MI PÁGINA
   Los cupones que armás vos: son la única campaña que se crea entera desde
   acá. Las otras las propone Meli y uno acepta.

   Cómo funciona un cupón, según la doc:
     · El descuento NO toca el precio de la publicación. Se aplica en el
       checkout, sobre el total del carrito, y se acumula con la oferta que la
       publicación ya tenga puesta. Por eso los ítems adentro figuran siempre
       con precio 0: no hay precio que mandar.
     · Solo entra un cupón por venta.
     · El presupuesto lo ponés vos entero —Meli no aporta nada acá— y cuando
       se agota, la campaña se termina sola.
     · Sin código, lo ve cualquiera que entre a la publicación y Meli le pone
       el cartel. Con código, solo lo usa quien lo tenga.
     · Máximo 31 días.

   Lo que se puede y lo que no, contra la documentación:
     · Cupones — se crean, se editan y se borran por API. Todo desde acá.
     · Descuento individual (PRICE_DISCOUNT) — se crea de cero, con precio y
       fechas puestas por vos. También está acá abajo.
     · Ofertas relámpago (LIGHTNING) — se aceptan, no se inventan: Meli decide
       qué publicaciones son candidatas y con qué precio y stock. Están en ⚡.
   ═══════════════════════════════════════════════════════════ */

/** Trae los cupones con su detalle. Va aparte de la sincronización porque el
 *  presupuesto se consume con cada venta y conviene mirarlo fresco. */
async function cargarCupones(boton) {
  const fin = boton ? ocupar(boton, 'Leyendo cupones', 'cupones') : null;
  try {
    const r = await api('cupones');
    S.cupones = r.cupones || [];
    S.cuponesLeidos = Date.now();
  } catch (e) { toast(e.message, 'bad'); }
  finally { if (fin) fin(); render(); }
}

const SUBTIPO = { FIXED_AMOUNT:'Monto fijo', FIXED_PERCENTAGE:'Porcentaje' };

function vMiPagina() {
  $('#tit').textContent = 'Mi página';

  // Los cupones vienen de la acción "cupones", que trae el detalle completo.
  // Mientras no se haya pedido, se muestra lo que sí bajó en la sincronización
  // —nombre y fechas— y se avisa que falta el resto.
  const detallado = S.cupones !== null;
  const cupones = detallado ? S.cupones : S.camps
    .filter(c => c.tipo === 'SELLER_COUPON_CAMPAIGN')
    .map(c => ({ id:c.promo_id, nombre:c.nombre, status:c.status,
                 inicio:c.inicio, fin:c.fin, items:[] }));

  // Qué publicaciones son candidatas: cualquiera activa que no esté ya adentro.
  // Meli usa el mismo criterio que para el descuento individual, así que si un
  // ítem entra en uno entra en el otro.
  const beneficioDe = c =>
    c.sub_type === 'FIXED_AMOUNT'     && c.monto_fijo !== '' ? pes(c.monto_fijo) :
    c.sub_type === 'FIXED_PERCENTAGE' && c.pct_fijo   !== '' ? c.pct_fijo + '%' : null;

  const consumo = c => {
    if (c.presupuesto === '' || c.presupuesto == null) return null;
    const gastado = c.presupuesto - (c.restante ?? c.presupuesto);
    return { gastado, pct: c.presupuesto ? (gastado / c.presupuesto) * 100 : 0 };
  };

  const tarjeta = c => {
    const ben = beneficioDe(c);
    const adentro = (c.items||[]).filter(i => i.status === 'started' || i.status === 'pending');
    const cand    = (c.items||[]).filter(i => String(i.status).indexOf('candidat') === 0);
    const viva    = c.status === 'started' || c.status === 'pending';
    const con     = consumo(c);
    return `<div class="cupon${viva?'':' off'}">
      <div class="cupon-cab">
        <h4>${esc(c.nombre || 'Cupón sin nombre')}</h4>
        <span class="chip ${c.status==='started'?'ok':c.status==='pending'?'acc':'mut'}">${
          esc({started:'corriendo', pending:'programado', finished:'terminado',
               deleted:'eliminado'}[c.status] || c.status || '—')}</span>
      </div>
      ${ben ? `<span class="benef">${ben} <small>${esc(SUBTIPO[c.sub_type]||'')}</small></span>`
            : `<span class="benef sinben">detalle sin leer</span>`}
      <div class="meta">
        ${c.compra_min !== '' && c.compra_min != null
          ? 'Compra mínima ' + pes(c.compra_min) : ''}${
          c.tope !== '' && c.tope != null ? ' · tope ' + pes(c.tope) : ''}
        ${c.inicio || c.fin ? '<br>' + esc(fecha(c.inicio) + ' → ' + fecha(c.fin)) : ''}
        <br>${c.codigo
          ? 'Código <b class="cod">' + esc(c.codigo) + '</b>'
          : (detallado ? 'Sin código: lo ve cualquier comprador' : '')}
        <br><span style="opacity:.6">${esc(c.id)}</span></div>

      ${con ? `<div class="presu">
        <div class="presu-barra${con.pct >= 80 ? ' casi' : ''}"><i style="width:${
          Math.min(100, con.pct).toFixed(1)}%"></i></div>
        <div class="presu-pie"><span>Quedan <b>${pes(c.restante)}</b> de ${pes(c.presupuesto)}</span>
          <span>${c.usados || 0} usado${c.usados === 1 ? '' : 's'}</span></div>
        ${con.pct >= 80 && c.status === 'started' ? `<div class="presu-alerta">Queda el ${
          pct(100 - con.pct)} del presupuesto. Cuando se agota, la campaña se apaga sola${
          c.sub_type === 'FIXED_AMOUNT' && c.monto_fijo
            ? (n => ' — te alcanza para ' + n + (n === 1 ? ' venta más' : ' ventas más'))
              (Math.floor(c.restante / c.monto_fijo)) : ''}.</div>` : ''}
      </div>` : ''}

      <div class="cuenta">

          : (detallado ? `<button class="btn xs" data-cup-editar="${esc(c.id)}">Editar</button>
             <button class="btn xs" data-cup-borrar="${esc(c.id)}">Borrar</button>` : '')}
      </div>
    </div>`;
  };

  /* La lista de publicaciones de un cupón: las que ya están adentro y las que

  const listaCupon = () => {

            <td class="r"><button class="btn xs" data-cup-accion="${dentro?'salir':'sumar'}"

      <div class="aviso" style="margin:0 16px 14px">El cupón <b>no toca el precio</b> de la

  };

  /* ── formulario de cupón: sirve para crear y para editar ── */
  const ed = S.cuponForm;
  const editando = ed && ed.id;
  const enEdicion = editando ? cupones.find(c => c.id === ed.id) : null;

    if (!ed) return '';
    const esPct = ed.sub_type === 'FIXED_PERCENTAGE';
    // Con la campaña ya corriendo Meli solo deja tres campos. Se bloquean los

    const bloq = arrancado ? ' disabled' : '';
    return `<div class="panel"><h3>${editando ? 'Editar cupón' : 'Crear un cupón'}
        <span class="hint">${editando ? esc(ed.id) : 'SELLER_COUPON_CAMPAIGN'}</span></h3>
      <div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:13px">
        ${arrancado ? `<div class="aviso"><b>Este cupón ya arrancó.</b> Con la campaña corriendo
          Meli solo deja cambiar el nombre, la fecha de fin y el presupuesto —y el presupuesto
          solo hacia arriba—. El resto está bloqueado.</div>` : ''}
        ${editando ? '' : (CUPONES_SOLO_ITEMS
          ? `<div class="aviso bad"><b>Mercado Libre no te deja crear cupones por API.</b>
              Lo probamos y contestó <i>"User is not allowed to create this type of promotion"</i>:
              la creación de campañas de cupones es solo para Brasil (MLB). La documentación lo
              decía y resultó ser cierto —tus cupones actuales los creó el seller center, no la API—.
              <br><br><b>El cupón se crea en el seller center</b>, y una vez creado aparece acá:
              desde esta pantalla le sumás y sacás publicaciones, mirás el presupuesto y lo ampliás.
              El formulario queda por si algún día lo habilitan para Argentina.</div>`
          : `<div class="aviso"><b>Una advertencia:</b> la documentación de Mercado Libre dice que
              esta campaña está <b>"disponible solo para MLB"</b> (Brasil). Tu cuenta es MLA, así
              que puede rebotar. Si pasa, el error te lo va a decir y queda en <b>Registro</b>;
              crearlo desde el seller center funciona igual.</div>`)}

        <div class="form-desc">
          <label>Nombre <span class="lbl-nota">solo lo ves vos</span>
            <input type="text" id="cuNombre" value="${esc(ed.name||'')}" placeholder="AGUINALDO2"></label>
          <label>Tipo de descuento
            <select id="cuSub"${bloq}>
              <option value="FIXED_AMOUNT"${!esPct?' selected':''}>Monto fijo en pesos</option>
              <option value="FIXED_PERCENTAGE"${esPct?' selected':''}>Porcentaje</option>
            </select></label>
          ${esPct
            ? `<label>Porcentaje de descuento
                 <input type="number" id="cuValor" value="${esc(ed.fixed_percentage??'')}" min="1" max="99"${bloq}></label>
               <label>Tope de reintegro <span class="lbl-nota">por venta</span>
                 <input type="number" id="cuTope" value="${esc(ed.max_purchase_amount??'')}" min="1"${bloq}></label>`
            : `<label>Monto de descuento
                 <input type="number" id="cuValor" value="${esc(ed.fixed_amount??'')}" min="1"${bloq}></label>`}
          <label>Compra mínima <span class="lbl-nota">para que aplique</span>
            <input type="number" id="cuMin" value="${esc(ed.min_purchase_amount??'')}" min="1"${bloq}></label>
          <label>Presupuesto total
            <input type="number" id="cuPresu" value="${esc(ed.budget??'')}" min="1"></label>
          <label>Desde<input type="date" id="cuDesde" value="${esc(ed.start_date||hoyISO)}"${bloq}></label>
          <label>Hasta<input type="date" id="cuHasta" value="${esc(ed.finish_date||'')}"></label>
          ${editando ? '' : `<label>Código <span class="lbl-nota">opcional</span>
            <input type="text" id="cuCodigo" value="${esc(ed.partial_coupon_code||'')}"
              maxlength="10" placeholder="dejalo vacío y lo ve cualquiera"></label>`}
        </div>

        <div id="cuAviso"></div>

        <div class="ed-pie">
          <div class="aviso" style="flex:1;margin:0">El presupuesto es <b>tuyo entero</b> —Meli no
            aporta nada en los cupones— y cuando se agota la campaña se termina sola. Máximo
            <b>31 días</b>. El descuento se aplica en el checkout sobre el total del carrito y
            <b>se suma</b> a la oferta que la publicación ya tenga; entra un solo cupón por venta.</div>
          <button class="btn" id="cuCancelar">Cancelar</button>
          <button class="btn p" id="cuGuardar">${editando ? 'Guardar cambios' : 'Crear el cupón'}</button>
        </div>
      </div>
    </div>`;
  };

  /* ── descuento individual ── */
  const en7 = new Date(Date.now() - 3*36e5 + 6*DIA).toISOString().slice(0,10);
  const opciones = S.items.slice()
    .sort((a,b) => (a.sku||'').localeCompare(b.sku||'', 'es', {numeric:true}))
    .map(it => `<option value="${esc(it.id)}">${esc((it.sku||'s/sku') + ' · ' + cuotasPub(it) +
      ' · ' + pes(it.lista) + ' · ' + it.titulo.slice(0,34))}</option>`).join('');

  const totPresu = cupones.reduce((a,c) => a + (+c.presupuesto || 0), 0);
  const totResta = cupones.reduce((a,c) => a + (+c.restante || 0), 0);
  const totUsa   = cupones.reduce((a,c) => a + (+c.usados || 0), 0);

  $('#wrap').innerHTML = `
    <div class="kpis">
      <div class="kpi"><span class="k">Cupones</span><span class="v">${cupones.length}</span>
        <span class="d">${cupones.filter(c=>c.status==='started').length} corriendo</span></div>
      <div class="kpi ${totPresu && totResta/totPresu < .2 ? 'bad' : 'good'}">
        <span class="k">Presupuesto restante</span>
        <span class="v">${detallado ? pes(totResta) : '—'}</span>
        <span class="d">${detallado ? 'de ' + pes(totPresu) : 'leé el detalle'}</span></div>
      <div class="kpi"><span class="k">Cupones usados</span>
        <span class="v">${detallado ? totUsa : '—'}</span><span class="d">por compradores</span></div>
      <div class="kpi"><span class="k">Descuentos propios</span><span class="v">${
        S.filas.filter(f => f.tipo === 'PRICE_DISCOUNT' && (f.status==='started'||f.status==='pending')).length
      }</span><span class="d">PRICE_DISCOUNT activos</span></div>
    </div>

    <div class="panel"><h3>Tus cupones
        <span class="hint">${CUPONES_SOLO_ITEMS
          ? 'se crean en el seller center · acá se administran'
          : 'se crean, se editan y se borran desde acá'}</span></h3>
      <div class="barra-sel">
        <button class="btn sm" id="leerCup">${detallado ? 'Actualizar detalle' : 'Leer el detalle'}</button>
        ${S.cuponesLeidos ? `<span class="sub">leído hace ${
          Math.max(0, Math.round((Date.now() - S.cuponesLeidos)/60000))} min</span>` : ''}
        <span class="sep-flex"></span>
        ${CUPONES_SOLO_ITEMS
          ? `<a class="btn sm" href="${esc(linkPromos())}"
               target="_blank" rel="noopener">Crear en el seller center ↗</a>`
          : `<button class="btn p sm" id="nuevoCup">Crear un cupón</button>`}
      </div>
      <div style="padding:0 16px 16px">
        ${CUPONES_SOLO_ITEMS ? `<div class="aviso"><b>Qué se puede hacer desde acá y qué no.</b>
          Lo probamos endpoint por endpoint contra tu cuenta: Mercado Libre <b>no habilita
          Argentina</b> para crear ni editar campañas de cupones por API —contesta
          <i>"Site MLA is not enabled"</i>, es solo para Brasil—. Así que la campaña se arma y se
          retoca en el seller center: nombre, monto, presupuesto y fechas.
          <br><br>Lo que <b>sí</b> anda, y es el trabajo de todos los días: ver el presupuesto que
          te queda y <b>decidir qué publicaciones entran en cada cupón</b>.</div>
          <div style="height:11px"></div>` : ''}
        ${!detallado ? `<div class="aviso">El presupuesto restante, los cupones usados y el código
          no bajan en la sincronización: son dos llamadas por cupón y cambian con cada venta.
          Tocá <b>Leer el detalle</b> para traerlos.</div><div style="height:11px"></div>` : ''}
        ${cupones.length
          ? `<div class="cupones">${cupones.map(tarjeta).join('')}</div>`
          : `<div class="empty"><b>Todavía no hay cupones</b><p>Un cupón descuenta en el checkout
              sobre el total del carrito y se suma a la oferta que la publicación ya tenga.
              ${CUPONES_SOLO_ITEMS
                ? 'La campaña se arma en el seller center; cuando exista, aparece acá para cargarle publicaciones y manejarle el presupuesto.'
                : 'Lo armás vos: monto, compra mínima, presupuesto y fechas.'}</p></div>`}
      </div>
    </div>

    ${formCupon()}
    ${listaCupon()}

    <div class="panel"><h3>Crear un descuento propio
        <span class="hint">PRICE_DISCOUNT · este sí baja el precio de la publicación</span></h3>
      <div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:13px">
        <div class="aviso">A diferencia del cupón, este descuento <b>sí cambia el precio</b> que se
          ve en la publicación, y por eso <b>sí cuenta para la ventana de credibilidad</b>: tiene
          que estar al menos 5% abajo del más barato de los últimos ${VENTANA} días.</div>

        <div class="form-desc">
          <label>Publicación<select id="dcItem">${opciones}</select></label>
          <label>Precio al cliente<input type="number" id="dcPrecio" step="1" placeholder="0"></label>
          <label>Precio Mercado Puntos 3–6 <span class="lbl-nota">opcional</span>
            <input type="number" id="dcTop" step="1" placeholder="vacío si no segmentás"></label>
          <label>Desde<input type="date" id="dcDesde" value="${hoyISO}"></label>
          <label>Hasta<input type="date" id="dcHasta" value="${en7}"></label>
        </div>

        <div id="dcAviso"></div>

        <div class="ed-pie">
          <div class="aviso" style="flex:1;margin:0">Límites de Mercado Libre: descuento entre
            <b>5% y 80%</b>, plazo máximo <b>14 días</b>, y si ponés precio para Mercado Puntos 3–6
            tiene que ser al menos 5% más barato que el general (10% si el descuento pasa del 35%).
            Para editarlo hay que borrarlo y volver a crearlo.</div>
          <button class="btn p" id="dcCrear">Crear el descuento</button>
        </div>
      </div>
    </div>`;

  engancharMiPagina(cupones, arrancado);
}

function engancharMiPagina(cupones, arrancado) {
  const lc = $('#leerCup'); if (lc) lc.onclick = () => cargarCupones(lc);

  const nc = $('#nuevoCup');
  if (nc) nc.onclick = () => {
    S.cuponForm = { sub_type:'FIXED_AMOUNT' };
    S.cuponAbierto = null;
    render();
  };

  $$('[data-cupon]').forEach(b => b.onclick = () => {
    S.cuponAbierto = S.cuponAbierto === b.dataset.cupon ? null : b.dataset.cupon;
    S.cuponForm = null;
    render();
  });
  const cc = $('#cerrarCupon');
  if (cc) cc.onclick = () => { S.cuponAbierto = null; render(); };
  const sa = $('#ckSoloAdentro');
  if (sa) sa.onclick = () => { S.soloAdentro = sa.checked; render(); };

  $$('[data-cup-editar]').forEach(b => b.onclick = () => {
    const c = cupones.find(x => x.id === b.dataset.cupEditar);
    if (!c) return;
    // Se carga el formulario con lo que ya tiene, así editar es cambiar un
    // campo y no volver a escribir todo.
    S.cuponForm = { id:c.id, name:c.nombre, sub_type:c.sub_type,
      fixed_amount:c.monto_fijo, fixed_percentage:c.pct_fijo,
      min_purchase_amount:c.compra_min, max_purchase_amount:c.tope,
      budget:c.presupuesto,
      start_date:(c.inicio||'').slice(0,10), finish_date:(c.fin||'').slice(0,10) };
    S.cuponAbierto = null;
    render();
  });

  $$('[data-cup-borrar]').forEach(b => b.onclick = async () => {
    const c = cupones.find(x => x.id === b.dataset.cupBorrar);
    if (!c) return;
    const adentro = (c.items||[]).filter(i => i.status==='started'||i.status==='pending').length;
    if (!confirm('Borrar el cupón "' + (c.nombre||c.id) + '".\n\n' +
      (adentro ? 'Tiene ' + adentro + ' publicación' + (adentro>1?'es':'') + ' adentro.\n' : '') +
      (c.usados ? 'Ya lo usaron ' + c.usados + ' compradores.\n' : '') +
      '\nEsto no se deshace. ¿Confirmás?')) return;
    const fin = ocupar(b, 'Borrando', 'cupon');
    try {
      const r = await api('cupon_borrar', { promotion_id: c.id });
      S.cupones = (r.lista || {}).cupones || S.cupones;
      S.cuponesLeidos = Date.now();
      S.resultado = { ok:true, seg:fin(), titulo:'Cupón borrado',
        detalle:'"' + (c.nombre||c.id) + '" ya no está en tu lista.' };
      render();
    } catch (e) { fin(false); toast(e.message, 'bad'); }
  });

  /* ── sumar o sacar una publicación de un cupón ──
     La confirmación NO se hace contra las filas del ítem. Meli tiene dos
     vistas de lo mismo y no se actualizan juntas:

       /promotions/{cupón}/items   quiénes están en el cupón — es la que manda
       /items/{publicación}        qué promos tiene un ítem — tarda más

     Lo comprobamos en la cuenta: después de una baja con 200 OK, la lista del
     cupón ya no la traía y la vista del ítem seguía diciendo "started". Si
     confirmáramos contra la segunda, la app te diría "no quedó guardado"
     cuando en realidad sí quedó, que es peor que no decir nada. */
  $$('[data-cup-accion]').forEach(b => b.onclick = async () => {
    const esSalir = b.dataset.cupAccion === 'salir';
    const item = b.dataset.item, promo = b.dataset.promo;
    // El cupón no lleva precio: el descuento se aplica en el checkout.
    const cuerpo = { item_id: item, promotion_type: 'SELLER_COUPON_CAMPAIGN',
                     promotion_id: promo };
    const fin = ocupar(b, esSalir ? 'Sacando' : 'Sumando', 'cupon');
    try {
      await api(esSalir ? 'salir' : 'sumar', cuerpo);
      const seg = fin();
      await cargarCupones();          // relee la lista del cupón, la buena
      const c = (S.cupones || []).find(x => x.id === promo);
      const e = c && (c.items || []).find(x => String(x.id) === item);
      const adentro = !!(e && (e.status === 'started' || e.status === 'pending'));
      const nom = c ? (c.nombre || promo) : promo;
      S.resultado = adentro === !esSalir
        ? { ok:true, seg, titulo:'Confirmado por Mercado Libre',
            detalle: item + (esSalir ? ' quedó fuera de ' : ' quedó adentro de ') + '"' + nom +
              '". Lo comprobé releyendo la lista de publicaciones del cupón, no la del ítem: ' +
              'esa tarda en actualizarse y no sirve para confirmar.' }
        : { ok:false, seg, titulo:'No quedó guardado',
            detalle:'Mercado Libre aceptó el pedido pero la lista de "' + nom + '" ' +
              (esSalir ? 'sigue teniendo ' : 'no trae ') + item +
              '. Reintentá en unos segundos; si sigue igual, revisalo en el seller center.' };
      await cargar();
    } catch (e) { fin(false); toast(e.message, 'bad'); }
  });

  engancharFormCupon(arrancado);
  engancharDescuento();
}

function engancharFormCupon(arrancado) {
  const g = $('#cuGuardar'); if (!g) return;
  const ed = S.cuponForm, editando = !!(ed && ed.id);

  const leer = () => ({
    name: ($('#cuNombre')||{}).value || '',
    sub_type: ($('#cuSub')||{}).value || 'FIXED_AMOUNT',
    valor: +($('#cuValor')||{}).value || 0,
    tope: +($('#cuTope')||{}).value || 0,
    min: +($('#cuMin')||{}).value || 0,
    presu: +($('#cuPresu')||{}).value || 0,
    desde: ($('#cuDesde')||{}).value || '',
    hasta: ($('#cuHasta')||{}).value || '',
    codigo: (($('#cuCodigo')||{}).value || '').trim()
  });

  // El tipo cambia qué campos hacen falta, así que redibuja.
  const sub = $('#cuSub');
  if (sub) sub.onchange = () => {
    const v = leer();
    S.cuponForm = Object.assign({}, ed, { sub_type: sub.value, name: v.name,
      min_purchase_amount: v.min, budget: v.presu, start_date: v.desde,
      finish_date: v.hasta, partial_coupon_code: v.codigo });
    render();
  };

  const repasar = () => {
    const v = leer(), caja = $('#cuAviso'); if (!caja) return;
    const partes = [];
    if (v.desde && v.hasta) {
      const dias = Math.round((Date.parse(v.hasta) - Date.parse(v.desde)) / DIA) + 1;
      if (dias > 31) partes.push(`<div class="aviso bad"><b>Son ${dias} días.</b>
        El plazo máximo de una campaña de cupones es 31.</div>`);
      else if (dias < 1) partes.push(`<div class="aviso bad">La fecha de fin es anterior
        a la de inicio.</div>`);
      else partes.push(`<div class="aviso ok">La campaña dura <b>${dias} día${dias>1?'s':''}</b>.</div>`);
    }
    /* Los tres límites, contados con números. Un cupón se define por cómo
       interactúan: la compra mínima dice desde cuánto aplica, el tope cuánto
       es lo más que podés perder en una venta, y el presupuesto cuántas
       ventas aguanta antes de apagarse. */
    if (v.sub_type === 'FIXED_AMOUNT') {
      if (v.valor && v.min)
        partes.push(`<div class="aviso">Aplica desde <b>${pes(v.min)}</b> de compra y descuenta
          siempre <b>${pes(v.valor)}</b>, sea cual sea el carrito. En el mínimo eso es un
          <b>${pct((v.valor / v.min) * 100)}</b> — cuanto más grande el carrito, menos pesa.</div>`);
      if (v.presu && v.valor)
        partes.push(`<div class="aviso">Con ${pes(v.presu)} de presupuesto y ${pes(v.valor)} por
          cupón, te alcanza para <b>${Math.floor(v.presu / v.valor)} ventas</b>. Cuando se agota,
          la campaña se termina sola.</div>`);
    } else {
      if (v.valor && v.min)
        partes.push(`<div class="aviso">Aplica desde <b>${pes(v.min)}</b> de compra. En el mínimo,
          el ${v.valor}% son <b>${pes(Math.round(v.min * v.valor / 100))}</b>.</div>`);
      // El campo se llama max_purchase_amount pero NO es un monto de compra: la
      // doc dice "monto máximo de reintegro". Se nota en su propio ejemplo, que
      // pone mínima 1000 y "máxima" 200 —imposible si fuera una compra—. Acá se
      // muestra a partir de qué carrito empieza a morder, que lo deja claro.
      if (v.valor && v.tope)
        partes.push(`<div class="aviso">El tope corta el reintegro en <b>${pes(v.tope)}</b> por
          venta: con ${v.valor}% de descuento empieza a morder a partir de un carrito de
          <b>${pes(Math.round(v.tope * 100 / v.valor))}</b>. De ahí para arriba el comprador
          sigue pagando ${pes(v.tope)} menos, no más.</div>`);
      if (v.presu && v.tope)
        partes.push(`<div class="aviso">Con ${pes(v.presu)} de presupuesto y un tope de
          ${pes(v.tope)} por venta, en el peor caso te alcanza para
          <b>${Math.floor(v.presu / v.tope)} ventas</b>.</div>`);
      if (v.valor && v.min && !v.tope)
        partes.push(`<div class="aviso bad">Falta el <b>tope de reintegro</b>. Sin tope, un carrito
          grande se lleva buena parte del presupuesto en una sola venta.</div>`);
    }
    caja.innerHTML = partes.join('');
  };
  ['#cuNombre','#cuValor','#cuTope','#cuMin','#cuPresu','#cuDesde','#cuHasta'].forEach(s => {
    const el = $(s); if (el) { el.oninput = repasar; el.onchange = repasar; }
  });
  repasar();

  const can = $('#cuCancelar');
  if (can) can.onclick = () => { S.cuponForm = null; render(); };

  g.onclick = async () => {
    const v = leer();
    if (!v.name)   { toast('Falta el nombre', 'bad'); return; }
    if (!v.presu)  { toast('Falta el presupuesto', 'bad'); return; }
    if (!v.hasta)  { toast('Falta la fecha de fin', 'bad'); return; }
    if (!editando || !arrancado) {
      if (!v.valor) { toast('Falta el descuento', 'bad'); return; }
      if (!v.min)   { toast('Falta la compra mínima', 'bad'); return; }
      if (v.sub_type === 'FIXED_PERCENTAGE' && !v.tope) {
        toast('En un cupón por porcentaje el tope de reintegro es obligatorio', 'bad'); return; }
    }

    const desc = v.sub_type === 'FIXED_AMOUNT' ? pes(v.valor) : v.valor + '%';
    if (!confirm((editando ? 'Guardar cambios en "' : 'Crear el cupón "') + v.name + '"\n\n' +
      '   descuento     ' + desc + '\n' +
      (v.sub_type === 'FIXED_PERCENTAGE' ? '   tope          ' + pes(v.tope) + '\n' : '') +
      '   compra mínima ' + pes(v.min) + '\n' +
      '   presupuesto   ' + pes(v.presu) + '   (todo a tu cargo)\n' +
      '   ' + v.desde + '  →  ' + v.hasta + '\n' +
      (v.codigo ? '   código        ' + v.codigo + '  (Meli le pega tu nickname adelante)\n'
                : (editando ? '' : '   sin código: lo ve cualquier comprador\n')) +
      '\n¿Confirmás?')) return;

    /* Con la campaña ya arrancada Meli solo acepta tres campos y contesta
       "the field X not upgradable" si le llega cualquier otro. Los inputs están
       bloqueados, pero bloqueado no es lo mismo que vacío: si igual se mandaran
       sus valores, el PUT entero rebotaría. Así que acá se manda solo lo que
       Meli deja tocar. El sub_type no está en la lista de editables en ningún
       caso — el tipo de cupón no se cambia, se crea otro. */
    var cuerpo;
    if (editando && arrancado) {
      cuerpo = { name: v.name, budget: v.presu, finish_date: v.hasta + 'T00:00:00' };
    } else {
      cuerpo = { name: v.name, min_purchase_amount: v.min, budget: v.presu,
        start_date: v.desde + 'T00:00:00', finish_date: v.hasta + 'T00:00:00' };
      if (v.sub_type === 'FIXED_AMOUNT') cuerpo.fixed_amount = v.valor;
      else { cuerpo.fixed_percentage = v.valor; cuerpo.max_purchase_amount = v.tope; }
      // El subtipo se define al crear; en un PUT no es un campo editable.
      if (!editando) {
        cuerpo.sub_type = v.sub_type;
        if (v.codigo) cuerpo.partial_coupon_code = v.codigo;
      }
    }

    const fin = ocupar(g, editando ? 'Guardando' : 'Creando', 'cupon');
    try {
      const r = editando
        ? await api('cupon_editar', { promotion_id: ed.id, cambios: cuerpo })
        : await api('cupon_crear', { cupon: cuerpo });
      const seg = fin();
      S.cupones = (r.lista || {}).cupones || S.cupones;
      S.cuponesLeidos = Date.now();
      S.cuponForm = null;
      // Se confirma contra lo que contestó Meli, no contra lo que mandamos.
      const c = r.cupon || {};
      S.resultado = {
        ok: true, seg,
        titulo: editando ? 'Cupón actualizado' : 'Cupón creado',
        detalle: '"' + (c.name || v.name) + '" · ' +
          (c.coupon_code ? 'código ' + c.coupon_code + ' · ' : 'sin código · ') +
          'presupuesto ' + pes(c.budget != null ? c.budget : v.presu) + ' · estado ' +
          (c.status || '—') + '. Ahora sumale publicaciones desde su tarjeta.'
      };
      render();
    } catch (e) {
      fin(false);
      /* Un toast se va solo a los pocos segundos y quedás mirando un formulario
         lleno sin saber qué pasó. Los rechazos de sitio no habilitado quedan
         fijos en pantalla, con las palabras exactas de Meli. */
      if (/not allowed to create this type|is not enabled for|no te deja (crear|editar)/i.test(e.message)) {
        S.resultado = { ok:false, titulo:'Mercado Libre no habilita esto en Argentina',
          detalle: e.message + ' Se hace desde el seller center; acá seguís manejando qué ' +
            'publicaciones entran en cada cupón.' };
        render();
        return;
      }
      toast(e.message, 'bad');
    }
  };
}

function engancharDescuento() {
  const cr = $('#dcCrear'); if (!cr) return;

  // El aviso se recalcula mientras escribe, igual que en el diálogo de sumarse:
  // es la misma regla y el mismo dato.
  const repasar = () => {
    const it = S.items.find(x => x.id === ($('#dcItem')||{}).value);
    const p  = +($('#dcPrecio')||{}).value || 0;
    const caja = $('#dcAviso'); if (!caja) return;
    if (!it || !p) { caja.innerHTML = ''; return; }
    const partes = [];
    const d = it.lista ? (1 - p/it.lista)*100 : null;
    if (d != null && d < 5)
      partes.push(`<div class="aviso bad"><b>El descuento es de ${pct(d)}.</b> Meli exige mínimo 5%
        sobre el precio de lista (${pes(it.lista)}): con este precio te lo va a rechazar.</div>`);
    if (d != null && d > 80)
      partes.push(`<div class="aviso bad"><b>El descuento es de ${pct(d)}.</b> El máximo es 80%.</div>`);
    const cred = avisoCredibilidad(it, p);
    if (cred) partes.push(cred);
    const desde = ($('#dcDesde')||{}).value, hasta = ($('#dcHasta')||{}).value;
    if (desde && hasta) {
      const dias = Math.round((Date.parse(hasta) - Date.parse(desde)) / DIA) + 1;
      if (dias > 14) partes.push(`<div class="aviso bad"><b>Son ${dias} días.</b> El plazo máximo
        de un descuento individual es de 14.</div>`);
      if (dias < 1) partes.push(`<div class="aviso bad">La fecha de fin es anterior a la de inicio.</div>`);
    }
    caja.innerHTML = partes.join('');
  };
  ['#dcItem','#dcPrecio','#dcDesde','#dcHasta'].forEach(s => {
    const el = $(s); if (el) { el.oninput = repasar; el.onchange = repasar; }
  });
  repasar();

  cr.onclick = async () => {
    const id = ($('#dcItem')||{}).value;
    const precio = +($('#dcPrecio')||{}).value || 0;
    const top = +($('#dcTop')||{}).value || 0;
    const desde = ($('#dcDesde')||{}).value, hasta = ($('#dcHasta')||{}).value;
    const it = S.items.find(x => x.id === id);
    if (!it)     { toast('Elegí una publicación', 'bad'); return; }
    if (!precio) { toast('Falta el precio al cliente', 'bad'); return; }
    if (!desde || !hasta) { toast('Faltan las fechas', 'bad'); return; }

    const d = it.lista ? (1 - precio/it.lista)*100 : 0;
    if (!confirm('Descuento propio en ' + (it.sku || id) + ' — ' + cuotasPub(it) + '\n\n' +
      '   lista       ' + pes(it.lista) + '\n' +
      '   al cliente  ' + pes(precio) + '   (−' + pct(d) + ')\n' +
      (top ? '   MP 3–6     ' + pes(top) + '\n' : '') +
      '   ' + desde + '  →  ' + hasta + '\n\n' +
      'Este descuento SÍ cuenta para la ventana de credibilidad.\n\n¿Confirmás?')) return;

    const cuerpo = { item_id: id, promotion_type: 'PRICE_DISCOUNT', deal_price: precio,
      start_date: desde + 'T00:00:00', finish_date: hasta + 'T23:59:59' };
    if (top) cuerpo.top_deal_price = top;

    const fin = ocupar(cr, 'Creando', 'descuento');
    try {
      const r = await api('sumar', cuerpo);
      const seg = fin();
      S.resultado = Object.assign({ seg }, verificar('sumar', cuerpo, r.filas, r));
      await cargar();
    } catch (e) { fin(false); toast(e.message, 'bad'); }
  };
}

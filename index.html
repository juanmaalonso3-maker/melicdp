<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDP Kenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F4F7F6; --panel:#FFFFFF; --panel2:#EDF2F1; --panel3:#E3EAE8;
  --ink:#15201E; --ink2:#4C5D59; --ink3:#7A8B87;
  --line:#D8E0DD; --line2:#BDC9C5;
  --acc:#0E6B63; --acc2:#DBEDEA;
  --ok:#2C7A4B; --okbg:#DDF0E4;
  --warn:#8A5D06; --warnbg:#F8EBD1;
  --bad:#A63A2E; --badbg:#F8E2DE;
  --shadow:0 1px 2px rgba(21,32,30,.06),0 10px 28px -20px rgba(21,32,30,.3);
  --r:7px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1312; --panel:#151E1C; --panel2:#1C2624; --panel3:#24302D;
  --ink:#E2E9E6; --ink2:#A3B3AF; --ink3:#788A86;
  --line:#28352F; --line2:#3A4844;
  --acc:#54B8AB; --acc2:#123029;
  --ok:#6BC489; --okbg:#132F1D;
  --warn:#D9A63F; --warnbg:#31260C;
  --bad:#E2786A; --badbg:#351A16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -20px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#0D1312; --panel:#151E1C; --panel2:#1C2624; --panel3:#24302D;
  --ink:#E2E9E6; --ink2:#A3B3AF; --ink3:#788A86;
  --line:#28352F; --line2:#3A4844;
  --acc:#54B8AB; --acc2:#123029;
  --ok:#6BC489; --okbg:#132F1D;
  --warn:#D9A63F; --warnbg:#31260C;
  --bad:#E2786A; --badbg:#351A16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--ground);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.ui{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.mono,.n{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc)}

/* ── estructura ───────────────────────────────────────────── */
#app{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:900px){#app{grid-template-columns:210px 1fr}}

aside{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:18px 12px;
}
@media(min-width:900px){aside{position:sticky;top:0;height:100vh}}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:"Bricolage Grotesque";font-size:17px;font-weight:700}
.brand span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-family:"JetBrains Mono"}
nav{display:flex;flex-direction:column;gap:2px}
.nav{
  display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r);
  border:0;background:none;cursor:pointer;text-align:left;width:100%;
  font-family:"Bricolage Grotesque";font-weight:500;font-size:13.5px;color:var(--ink2);
}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--acc2);color:var(--acc);font-weight:700}
.nav .b{margin-left:auto;font:600 10.5px "JetBrains Mono";background:var(--panel3);color:var(--ink2);padding:1px 6px;border-radius:20px}
.nav[aria-current="true"] .b{background:var(--acc);color:var(--panel)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot small{color:var(--ink3);font-size:11px;line-height:1.45}

main{min-width:0;display:flex;flex-direction:column}
.bar{
  position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--line);padding:16px 22px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
}
.bar h1{font-size:20px;font-weight:700;margin-right:auto}
.bar .sub{font-size:12px;color:var(--ink3);width:100%;margin-top:-6px}
.wrap{padding:22px;display:flex;flex-direction:column;gap:18px}

/* ── controles ────────────────────────────────────────────── */
.btn{
  border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);
  padding:7px 13px;cursor:pointer;font-family:"Bricolage Grotesque";font-weight:500;font-size:13px;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{background:var(--panel2)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
:root[data-theme="dark"] .btn.p,
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#08201D}}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
input[type=text],input[type=number],input[type=password],select{
  border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:7px 10px;
}
input:focus-visible,select:focus-visible,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.search{min-width:190px;flex:1;max-width:320px}

/* ── tarjetas KPI ─────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.kpi .k{font:400 10.5px/1 "JetBrains Mono";letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-family:"JetBrains Mono";font-weight:600;font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .d{font-size:11.5px;color:var(--ink3)}
.kpi.hot .v{color:var(--bad)}
.kpi.good .v{color:var(--ok)}

/* ── paneles y tablas ─────────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.panel>h2{font-size:14px;font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.panel>h2 .hint{font-family:system-ui;font-weight:400;font-size:12px;color:var(--ink3);margin-left:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{
  position:sticky;top:0;background:var(--panel2);z-index:2;
  font:400 10px/1 "JetBrains Mono";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;
}
th.r,td.r{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
.tit{display:flex;gap:9px;align-items:center;min-width:230px}
.tit img{width:30px;height:30px;object-fit:contain;border-radius:4px;background:var(--panel2);flex:none}
.tit b{display:block;font-weight:600;font-size:12.5px;line-height:1.3}
.tit small{color:var(--ink3);font:400 10.5px "JetBrains Mono"}

.chip{display:inline-flex;align-items:center;gap:4px;font:600 10px/1 "JetBrains Mono";letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.mut{background:var(--panel3);color:var(--ink3)}
.chip.acc{background:var(--acc2);color:var(--acc)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ── tarjetas de campaña ──────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;display:flex;flex-direction:column;gap:9px;border-top:3px solid var(--line2);box-shadow:var(--shadow)}
.card.urg{border-top-color:var(--bad)}
.card.pron{border-top-color:var(--warn)}
.card.calm{border-top-color:var(--ok)}
.card .tipo{font:400 10px "JetBrains Mono";letter-spacing:.09em;color:var(--ink3)}
.card .nom{font-family:"Bricolage Grotesque";font-weight:700;font-size:15px;line-height:1.2}
.card .venc{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.card .venc b{font-family:"JetBrains Mono";font-variant-numeric:tabular-nums}
.card .cnt{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

/* ── barra de progreso reloj ──────────────────────────────── */
.prog{height:5px;border-radius:3px;background:var(--panel3);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--acc)}
.prog.done i{background:var(--ok)}

/* ── selección en lote ────────────────────────────────────── */
.lote{
  position:sticky;bottom:0;z-index:15;background:var(--panel);border:1px solid var(--acc);
  border-radius:var(--r);padding:11px 15px;display:flex;gap:11px;align-items:center;flex-wrap:wrap;
  box-shadow:0 -6px 24px -16px rgba(0,0,0,.4);
}
.lote b{font-family:"JetBrains Mono"}

/* ── modal ────────────────────────────────────────────────── */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;max-width:520px;width:calc(100% - 32px);box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,18,16,.55)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);font-family:"Bricolage Grotesque";font-weight:700;font-size:16px}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font:400 10.5px "JetBrains Mono";letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.fld .help{font-size:11.5px;color:var(--ink3)}
.rango{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2)}
.rango button{border:1px solid var(--line2);background:var(--panel2);border-radius:5px;padding:3px 8px;cursor:pointer;font:600 11px "JetBrains Mono"}
.rango button:hover{border-color:var(--acc);color:var(--acc)}

.aviso{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:10px 13px;font-size:12.5px;line-height:1.5}
.aviso.bad{background:var(--badbg);color:var(--bad)}
.aviso.ok{background:var(--okbg);color:var(--ok)}

.empty{padding:44px 22px;text-align:center;color:var(--ink3);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{font-family:"Bricolage Grotesque";font-size:15px;color:var(--ink2)}
.empty p{max-width:44ch;font-size:13px;line-height:1.6}

.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.toast{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast>div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r);padding:11px 14px;font-size:13px;box-shadow:var(--shadow)}
.toast>div.bad{border-left-color:var(--bad)}
.toast>div.ok{border-left-color:var(--ok)}
.hide{display:none !important}
</style>
</head>
<body>

<div id="app">
  <aside>
    <div class="brand"><b>CDP Kenta</b><span>Central de Promociones</span></div>
    <nav>
      <button class="nav" data-v="tarjetas" aria-current="true">Tarjetas <span class="b" id="bT">0</span></button>
      <button class="nav" data-v="oportunidades">Oportunidades <span class="b" id="bO">0</span></button>
      <button class="nav" data-v="publicaciones">Publicaciones <span class="b" id="bP">0</span></button>
      <button class="nav" data-v="credibilidad">Credibilidad <span class="b" id="bC">0</span></button>
      <button class="nav" data-v="registro">Registro</button>
    </nav>
    <div class="side-foot">
      <button class="btn sm" id="cfg">Configuración</button>
      <button class="btn sm" id="tema">Tema</button>
      <small id="pie">Sin conectar</small>
    </div>
  </aside>

  <main>
    <div class="bar">
      <h1 id="tit">Tarjetas</h1>
      <input type="text" class="search" id="q" placeholder="Buscar por SKU, título o #ID">
      <button class="btn" id="recargar">Recargar</button>
      <button class="btn p" id="sync">Sincronizar con Meli</button>
      <div class="sub" id="sub"></div>
    </div>
    <div class="wrap" id="wrap"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- ── configuración ── -->
<dialog id="dCfg">
  <div class="dlg-h">Conexión</div>
  <div class="dlg-b">
    <div class="fld">
      <label>URL del Apps Script</label>
      <input type="text" id="cUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <span class="help">Implementar → Administrar implementaciones → copiá la URL de la app web.</span>
    </div>
    <div class="fld">
      <label>Clave</label>
      <input type="password" id="cKey" placeholder="la que pusiste en CLAVE_APP">
      <span class="help">Queda guardada solo en este navegador.</span>
    </div>
  </div>
  <div class="dlg-f">
    <button class="btn" id="cCancel">Cancelar</button>
    <button class="btn p" id="cSave">Guardar</button>
  </div>
</dialog>

<!-- ── sumar a promoción ── -->
<dialog id="dSumar">
  <div class="dlg-h" id="sTit">Sumar a promoción</div>
  <div class="dlg-b" id="sBody"></div>
  <div class="dlg-f">
    <button class="btn" id="sCancel">Cancelar</button>
    <button class="btn p" id="sOk">Confirmar</button>
  </div>
</dialog>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   estado
   ══════════════════════════════════════════════════════════════ */
const S = {
  url: localStorage.getItem('cdp_url') || '',
  key: localStorage.getItem('cdp_key') || '',
  data: null, filas: [], items: [], camps: [], reloj: {}, log: [],
  vista: 'tarjetas', q: '', sel: new Set(), cargando: false
};
const VENTANA = 7;                       // días de credibilidad (hipótesis Fabiana)
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => (n === '' || n == null || isNaN(n)) ? '—' :
  new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(Math.round(n));
const pes = n => (n === '' || n == null || isNaN(n)) ? '—' : '$ ' + num(n);
const pct = n => (n == null || isNaN(n)) ? '—' : n.toFixed(1).replace('.',',') + '%';

/* ══════════════════════════════════════════════════════════════
   transporte — text/plain evita el preflight CORS de Apps Script
   ══════════════════════════════════════════════════════════════ */
async function api(accion, extra) {
  if (!S.url || !S.key) { abrirCfg(); throw new Error('Falta configurar la conexión'); }
  const r = await fetch(S.url, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ accion, clave: S.key }, extra || {}))
  });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('Respuesta inesperada: ' + t.slice(0,140)); }
  if (!j.ok) throw new Error(j.error === 'clave_invalida' ? 'Clave incorrecta' : j.error);
  return j.data;
}

function toast(msg, tipo) {
  const d = document.createElement('div');
  if (tipo) d.className = tipo;
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), tipo === 'bad' ? 9000 : 4500);
}

/* ══════════════════════════════════════════════════════════════
   normalización
   ══════════════════════════════════════════════════════════════ */
const ACEPTAR_SOLO = ['MARKETPLACE_CAMPAIGN','SMART','PRICE_MATCHING','PRE_NEGOTIATED','VOLUME','UNHEALTHY_STOCK'];
const DEFINE_PRECIO = ['DEAL','DOD','LIGHTNING','PRICE_DISCOUNT','SELLER_CAMPAIGN'];

function procesar(d) {
  S.data  = d;
  S.camps = d.campanias || [];
  S.reloj = d.reloj || {};
  S.log   = d.log || [];

  S.filas = (d.datos || []).map(r => {
    const lista = +r.original_price || +r.precio_lista || 0;
    const max   = r.max_disc  === '' ? null : +r.max_disc;
    const min   = r.min_disc  === '' ? null : +r.min_disc;
    const sug   = r.sugerido  === '' ? null : +r.sugerido;
    const pp    = r.precio_promo === '' ? null : +r.precio_promo;
    return {
      id:r.item_id, sku:r.sku, titulo:r.titulo, foto:r.foto, link:r.link,
      lista, stock:+r.stock||0, listingType:r.listing_type, cuotas:r.cuotas,
      envioGratis:r.envio_gratis==='SI', catalogo:r.catalogo==='SI',
      tipo:r.promo_tipo, promoId:r.promo_id, promo:r.promo_nombre, status:r.status,
      precio: pp && pp > 0 ? pp : null,
      max, min, sug,
      meliPct: r['meli_%']==='' ? null : +r['meli_%'],
      sellerPct: r['seller_%']==='' ? null : +r['seller_%'],
      boost: r.boost === 'SI',
      inicio:r.inicio, fin:r.fin, stockReq:r.stock_req,
      subType:r.sub_type, montoFijo:r.monto_fijo, pctFijo:r.pct_fijo,
      pisoPct: (max && lista) ? (1 - max/lista)*100 : null,
      techoPct:(min && lista) ? (1 - min/lista)*100 : null,
      sugPct:  (sug && lista) ? (1 - sug/lista)*100 : null,
      aceptaSolo: ACEPTAR_SOLO.includes(r.promo_tipo),
      esCupon: r.promo_tipo === 'SELLER_COUPON_CAMPAIGN'
    };
  });

  // agrupar por publicación
  const m = new Map();
  S.filas.forEach(f => {
    if (!m.has(f.id)) m.set(f.id, {
      id:f.id, sku:f.sku, titulo:f.titulo, foto:f.foto, link:f.link, lista:f.lista,
      stock:f.stock, listingType:f.listingType, cuotas:f.cuotas,
      envioGratis:f.envioGratis, catalogo:f.catalogo, promos:[]
    });
    m.get(f.id).promos.push(f);
  });
  S.items = [...m.values()].map(it => {
    const act = it.promos.filter(p => p.status === 'started' && p.precio);
    it.activas = act;
    it.precioActivo = act.length ? Math.min(...act.map(p => p.precio)) : null;
    it.descActivo = it.precioActivo && it.lista ? (1 - it.precioActivo/it.lista)*100 : null;
    it.candidatas = it.promos.filter(p => p.status === 'candidate' && !p.esCupon);
    it.dias = (S.reloj[it.id] || {}).diasSinOferta ?? null;
    it.muestras = (S.reloj[it.id] || {}).muestras ?? 0;
    return it;
  }).sort((a,b) => (a.sku||'zz').localeCompare(b.sku||'zz'));

  // oportunidades: candidatas con techo conocido y precio activo con el que comparar
  S.oport = [];
  S.items.forEach(it => {
    it.candidatas.forEach(p => {
      if (!p.max || !it.lista) return;
      const ref = it.precioActivo;
      const objetivo = p.sug || p.max;
      S.oport.push({
        it, p,
        objetivo,
        brechaSug: ref && p.sug ? p.sug - ref : null,
        brechaTecho: ref ? p.max - ref : null
      });
    });
  });
  S.oport.sort((a,b) => (b.brechaSug ?? -1e12) - (a.brechaSug ?? -1e12));
}

/* ══════════════════════════════════════════════════════════════
   filtro
   ══════════════════════════════════════════════════════════════ */
const coincide = it => {
  if (!S.q) return true;
  const q = S.q.toLowerCase();
  return (it.sku||'').toLowerCase().includes(q)
      || (it.titulo||'').toLowerCase().includes(q)
      || (it.id||'').toLowerCase().includes(q);
};

/* ══════════════════════════════════════════════════════════════
   vistas
   ══════════════════════════════════════════════════════════════ */
function render() {
  const w = $('#wrap');
  if (!S.data) {
    w.innerHTML = vacio('Sin datos todavía',
      S.url ? 'Tocá <b>Sincronizar con Meli</b> para traer publicaciones y promociones.'

}

function semaforo(o) {
  const {p} = o;
  if (o.brechaSug == null) return {c:'mut', t:'sin referencia'};
  if (o.brechaSug > 0)     return {c:'bad', t:'estás regalando'};
  if (o.brechaTecho > 0)   return {c:'warn',t:'hay margen al techo'};
  return {c:'ok', t:'bien calibrado'};
}

  const it = S.items.find(x => x.id === id);

  const filas = it.promos.map(p => `
    <tr>
      <td><span class="chip ${p.status==='started'?'ok':p.status==='pending'?'warn':'mut'}">${esc(p.status)}</span></td>

      <td class="r n">${p.sug?pes(p.sug):'—'}</td>
      <td class="r">${p.status==='candidate' && !p.esCupon
        ? `<button class="btn sm" data-add="${esc(p.tipo)}|${esc(p.promoId||'')}">Sumar</button>`
        : (p.status==='started'||p.status==='pending')
        ? `<button class="btn sm danger" data-del="${esc(p.tipo)}|${esc(p.promoId||'')}">Salir</button>` : ''}</td>
    </tr>`).join('');

  $('#sTit').textContent = it.titulo.slice(0,60);
  $('#sBody').innerHTML = `
    <div class="rango"><span>Lista <b class="n">${pes(it.lista)}</b></span>
      <span>Stock <b class="n">${num(it.stock)}</b></span>
      <span>${esc(it.listingType||'')}</span></div>
    <div class="scroll"><table>
      <thead><tr><th>Estado</th><th>Promoción</th><th class="r">Precio</th><th class="r">Techo</th><th class="r">Sugerido</th><th></th></tr></thead>
      <tbody>${filas}</tbody></table></div>`;
  $('#sOk').classList.add('hide');
  const dlg = $('#dSumar'); dlg.showModal();

  dlg.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const [tipo,pid] = b.dataset.add.split('|');
    const o = S.oport.find(x => x.it.id===id && x.p.tipo===tipo && (x.p.promoId||'')===pid);
    dlg.close(); if (o) abrirSumar(o); else toast('No hay datos de precio para esa promoción','bad');
  });
  dlg.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const [tipo,pid] = b.dataset.del.split('|');
    if (!confirm('¿Sacar esta publicación de ' + tipo + '?\n\nOjo: si después subís el precio, el reloj de credibilidad arranca recién ahora.')) return;
    dlg.close();
    try { await api('salir',{item_id:id, promotion_type:tipo, promotion_id:pid||undefined});
      toast('Salió de ' + tipo,'ok'); cargar(); }
    catch(e){ toast(e.message,'bad'); }
  });
}

    ${grupos.length ? `<div class="panel"><h2>Rotación de espejos

        <thead><tr><th>SKU</th><th>Publicaciones</th><th>Con oferta</th><th>Plan sugerido</th></tr></thead>

        <tbody>${filas}</tbody></table></div></div>`;
}

/** Agrupa publicaciones espejo por SKU y propone el escalonado. */
function agruparEspejos() {
  const m = new Map();
  S.items.forEach(it => {
    const k = it.sku || ('~' + it.titulo.slice(0,28));
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(it);
  });
  return [...m.entries()].filter(([,v]) => v.length > 1).map(([sku,items]) => {
    const conOferta = items.filter(i => i.activas.length);
    let plan;
    if (conOferta.length === items.length)
      plan = 'Sacá de ofertas una sola (la de cuotas), ajustale el precio y dejá la otra vendiendo. En ' + VENTANA + ' días invertí.';
    else if (conOferta.length === 0)
      plan = 'Ninguna tiene oferta. Sumá al menos una para no perder exposición mientras corre el reloj de la otra.';
    else
      plan = 'Escalonado en curso: ' + conOferta.length + ' de ' + items.length + ' con oferta. Cuando la que espera cumpla ' + VENTANA + ' días, invertí.';
    return {sku, items, plan};
  }).sort((a,b) => b.items.length - a.items.length);
}

let sumarActual = null;
function abrirSumar(o) {
  if (!o) return;
  sumarActual = o;
  const {it,p} = o;
  const solo = p.aceptaSolo;
  const lightning = p.tipo === 'LIGHTNING';
  const precioDef = p.sug || p.max;

  $('#sTit').textContent = 'Sumar a ' + (p.promo || p.tipo);
  $('#sOk').classList.remove('hide');
  $('#sBody').innerHTML = `
    <div class="rango">
      <span>${esc(it.titulo.slice(0,44))}</span>
    </div>
    <div class="rango"><span>Lista <b class="n">${pes(it.lista)}</b></span>
      ${it.precioActivo?`<span>Hoy <b class="n">${pes(it.precioActivo)}</b></span>`:''}
      <span class="chip mut">${esc(p.tipo)}</span></div>

    ${solo ? `<div class="aviso">Esta campaña la define Mercado Libre: vos solo aceptás.
        El precio será <b>${pes(p.precio || p.sug)}</b>${p.meliPct!=null?` — ML pone ${p.meliPct}% y vos ${p.sellerPct}%`:''}.</div>`
    : `
    <div class="fld">
      <label>Precio final al comprador</label>
      <input type="number" id="fPrecio" value="${precioDef?Math.round(precioDef):''}" step="1">
      <div class="rango">
        <button type="button" data-set="${p.max||''}">Techo ${pes(p.max)}</button>
        ${p.sug?`<button type="button" data-set="${p.sug}">Sugerido ${pes(p.sug)}</button>`:''}
        ${p.min?`<button type="button" data-set="${p.min}">Piso ${pes(p.min)}</button>`:''}
      </div>
      <span class="help" id="fCalc"></span>
    </div>
    ${lightning?`<div class="fld"><label>Stock a reservar</label>
      <input type="number" id="fStock" value="${p.stockReq?String(p.stockReq).split('-')[0]:1}" min="1">
      <span class="help">Requerido por Meli: ${esc(p.stockReq||'—')} unidades. Cuando se agota, la oferta termina.</span></div>`:''}
    ${p.tipo==='PRICE_DISCOUNT'?`<div class="aviso">Máximo 14 días. Descuento entre 5% y 80%.
      Si el ítem ya está en un DEAL, este descuento no se aplica hasta que el DEAL termine.</div>`:''}
    `}
    ${lightning?`<div class="aviso bad">Una vez activa, la oferta relámpago <b>no se puede eliminar</b>. Solo se puede pausar el ítem.</div>`:''}
  `;

  const calc = () => {
    const v = +($('#fPrecio')||{}).value;
    const el = $('#fCalc'); if (!el) return;
    if (!v || !it.lista) { el.textContent=''; return; }
    const d = (1 - v/it.lista)*100;
    const fuera = (p.max && v > p.max) || (p.min && v < p.min);
    el.innerHTML = `Descuento <b>${pct(d)}</b>` +
      (fuera ? ` — <span style="color:var(--bad)">fuera del rango permitido (${pes(p.min)} a ${pes(p.max)})</span>` : '');
  };
  $$('#sBody [data-set]').forEach(b => b.onclick = () => { $('#fPrecio').value = Math.round(+b.dataset.set); calc(); });
  if ($('#fPrecio')) { $('#fPrecio').oninput = calc; calc(); }
  $('#dSumar').showModal();
}

$('#sOk').onclick = async () => {
  const o = sumarActual; if (!o) return;
  const {it,p} = o;
  const body = { item_id: it.id, promotion_type: p.tipo };
  if (p.promoId) body.promotion_id = p.promoId;
  if (!p.aceptaSolo) {
    const v = +($('#fPrecio')||{}).value;
    if (!v) { toast('Falta el precio','bad'); return; }
    body.deal_price = v;
    if (p.tipo === 'LIGHTNING') body.stock = +($('#fStock')||{}).value || 1;
  }
  $('#sOk').disabled = true; $('#sOk').innerHTML = '<span class="spin"></span> Enviando';
  try {
    await api('sumar', body);
    $('#dSumar').close(); toast('Sumado a ' + (p.promo || p.tipo), 'ok'); cargar();
  } catch (e) { toast(e.message, 'bad'); }
  finally { $('#sOk').disabled = false; $('#sOk').textContent = 'Confirmar'; }
};

async function lote(lista, modo) {
  const acciones = [...S.sel].map(i => {
    const o = lista[i]; if (!o) return null;
    const b = { accion:'sumar', item_id:o.it.id, promotion_type:o.p.tipo };
    if (o.p.promoId) b.promotion_id = o.p.promoId;
    if (!o.p.aceptaSolo) b.deal_price = Math.round(modo==='max' ? o.p.max : (o.p.sug || o.p.max));
    if (o.p.tipo === 'LIGHTNING') return null;   // relámpago necesita stock, va una por una
    return b;
  }).filter(Boolean);

  if (!acciones.length) { toast('Nada aplicable en la selección','bad'); return; }
  if (!confirm('Vas a sumar ' + acciones.length + ' publicaciones. ¿Confirmás?')) return;

  toast('Procesando ' + acciones.length + '…');
  try {
    const r = await api('lote', { acciones });
    const ok = r.filter(x => x.ok).length;
    toast(ok + ' de ' + r.length + ' sumadas', ok === r.length ? 'ok' : 'bad');
    r.filter(x => !x.ok).slice(0,4).forEach(x => toast(x.item_id + ': ' + x.error, 'bad'));
    S.sel.clear(); cargar();
  } catch (e) { toast(e.message, 'bad'); }
}

/* ══════════════════════════════════════════════════════════════
   carga y navegación
   ══════════════════════════════════════════════════════════════ */
async function cargar() {
  if (!S.url || !S.key) { render(); return; }
  S.cargando = true; $('#recargar').innerHTML = '<span class="spin"></span>';
  try {
    procesar(await api('datos'));
    const u = S.data.ultimaSync || {};
    $('#pie').innerHTML = u.cuando
      ? 'Sync ' + new Date(u.cuando).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) +
        '<br>' + (u.publicaciones||0) + ' publicaciones · ' + (u.filas||0) + ' filas'
      : 'Conectado, sin sincronizar';
  } catch (e) { toast(e.message, 'bad'); }
  finally { S.cargando = false; $('#recargar').textContent = 'Recargar'; render(); }
}

$('#sync').onclick = async () => {
  const b = $('#sync'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Sincronizando';
  try {
    const r = await api('sync');
    toast(r.publicaciones + ' publicaciones y ' + r.filas + ' promociones en ' + r.segundos + 's', 'ok');
    await cargar();
  } catch (e) { toast(e.message, 'bad'); }
  finally { b.disabled = false; b.textContent = 'Sincronizar con Meli'; }
};
$('#recargar').onclick = cargar;

function ir(v) {
  S.vista = v;
  $$('.nav').forEach(n => n.setAttribute('aria-current', n.dataset.v === v ? 'true' : 'false'));
  if (v !== 'oportunidades') S.campFiltro = null;
  S.sel.clear();
  render();
}
$$('.nav').forEach(n => n.onclick = () => ir(n.dataset.v));

let tq; $('#q').oninput = e => { clearTimeout(tq); tq = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 180); };

/* configuración */
function abrirCfg(){ $('#cUrl').value = S.url; $('#cKey').value = S.key; $('#dCfg').showModal(); }
$('#cfg').onclick = abrirCfg;
$('#cCancel').onclick = () => $('#dCfg').close();
$('#cSave').onclick = () => {
  S.url = $('#cUrl').value.trim(); S.key = $('#cKey').value.trim();
  localStorage.setItem('cdp_url', S.url); localStorage.setItem('cdp_key', S.key);
  $('#dCfg').close(); cargar();
};
$('#sCancel').onclick = () => $('#dSumar').close();

/* tema */
$('#tema').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  next ? document.documentElement.setAttribute('data-theme', next)
       : document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('cdp_tema', next); } catch(e){}
};
try { const t = localStorage.getItem('cdp_tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){}

/* arranque */
if (!S.url) abrirCfg();
cargar();
</script>
</body>
</html>

/* ═══ VISTA 5 · REGISTRO ═══ */
/* ═══════════════════════════════════════════════════════════
   REGISTRO
   Todo lo que la app escribió en Mercado Libre, legible sin decodificar nada.

   La versión vieja mostraba cinco columnas crudas: hora, "salir",
   "MLA2800103864", "DEAL P-MLA17907074" y "OK". Con eso no se podía contestar
   la única pregunta que importa —¿quedó hecho o no?—, porque ese "OK" quería
   decir "Meli contestó 200", que no es lo mismo. Cuando la app avisó mal sobre
   una baja que sí había salido, el registro no sirvió para darse cuenta, y la
   acción se repitió tres veces esa noche.

   Ahora cada renglón dice de qué producto es, en qué campaña, a qué precio y
   —lo principal— si al releer la publicación el cambio estaba puesto:

     hecho      Meli aceptó y al releer figuraba. Es lo normal.
     dudoso     Meli aceptó pero al releer todavía no figuraba. Casi siempre
                es la vista de la publicación yendo atrasada, no un fallo.
     rechazado  Meli lo rechazó, con el motivo en castellano.

   Y marca las repeticiones: si la misma acción sobre el mismo producto
   aparece dos veces seguidas, es la firma de que la app avisó mal y vos lo
   volviste a hacer. Eso ahora se ve.
   ═══════════════════════════════════════════════════════════ */

const ACCION_LABEL = {
  sumar:'sumarse', salir:'salir', precio:'precio de lista',
  cupon_crear:'crear cupón', cupon_editar:'editar cupón', cupon_borrar:'borrar cupón',
  etiqueta:'etiqueta'
};

/** Los tres estados posibles, con el color y la explicación. */
const RESULTADO = {
  hecho:     { clase:'ok',   txt:'hecho',
               ayuda:'Meli lo aceptó y al releer la publicación el cambio estaba puesto.' },
  dudoso:    { clase:'warn', txt:'dudoso',
               ayuda:'Meli lo aceptó pero al releer todavía no figuraba. Casi siempre es la vista de la publicación yendo atrasada; fijate en Meli antes de rehacerlo.' },
  rechazado: { clase:'bad',  txt:'rechazado',
               ayuda:'Meli lo rechazó. El motivo está en la columna de al lado.' }
};

function estadoLog(l) {
  const r = String(l.resultado || '');
  if (RESULTADO[r]) return r;
  // Renglones viejos, de cuando solo se guardaba "OK" o "ERROR ...".
  return r.indexOf('OK') === 0 ? 'hecho' : r ? 'rechazado' : 'hecho';
}

function vLog() {
  $('#tit').textContent = 'Registro';
  const todo = [...S.log].reverse();

  /* Repeticiones: misma acción, mismo ítem, misma campaña, dentro de diez
     minutos. Es la huella de haber rehecho algo porque la app avisó mal. */
  const repes = new Set();
  todo.forEach((l, i) => {
    for (let j = i + 1; j < todo.length; j++) {
      const o = todo[j];
      if (Math.abs(Date.parse(l.ts) - Date.parse(o.ts)) > 10 * 60000) break;
      if (o.accion === l.accion && String(o.item_id) === String(l.item_id) &&
          String(o.campania || o.detalle) === String(l.campania || l.detalle)) {
        repes.add(i); repes.add(j);
      }
    }
  });

  const filtro = S.logFiltro || 'todos';
  const cuenta = k => todo.filter(l => estadoLog(l) === k).length;
  const visibles = todo
    .map((l, i) => ({ l, i }))
    .filter(({l}) => filtro === 'todos' || estadoLog(l) === filtro)
    .filter(({l}) => !S.q || (String(l.sku||'') + ' ' + String(l.producto||'') + ' ' +
      String(l.item_id||'') + ' ' + String(l.campania||'') + ' ' + String(l.detalle||''))
      .toLowerCase().includes(S.q.toLowerCase()));

  const fechaHora = ts => {
    const d = new Date(ts);
    return isNaN(d) ? String(ts).slice(0,16)
      : d.toLocaleString('es-AR', {day:'2-digit', month:'short', hour:'2-digit',
                                   minute:'2-digit', timeZone:TZ_AR});
  };

  const fila = ({l, i}) => {
    const e = estadoLog(l), R = RESULTADO[e];
    const rep = repes.has(i);
    return `<tr class="${e==='rechazado'?'log-mal':e==='dudoso'?'log-dudo':''}">
      <td class="n" style="white-space:nowrap;font-size:11.5px">${esc(fechaHora(l.ts))}</td>
      <td><span class="chip ${l.accion==='salir'?'warn':'acc'}">${
        esc(ACCION_LABEL[l.accion] || l.accion)}</span>
        ${rep ? '<div class="repe" title="La misma acción se repitió en pocos minutos. Suele pasar cuando la app avisa mal y uno lo rehace.">repetida</div>' : ''}</td>
      <td>${l.sku ? `<b class="n">${esc(l.sku)}</b>` : '<span style="color:var(--ink3)">—</span>'}
        <div class="sub">${esc(String(l.producto || l.item_id || '').slice(0,40))}</div></td>
      <td>${esc(l.campania || l.detalle || '—')}
        ${l.tipo ? `<div class="sub">${esc(tipoPromoCorto(l.tipo))}</div>` : ''}</td>
      <td class="r n">${l.precio ? pes(+l.precio) : '<span style="color:var(--ink3)">—</span>'}</td>
      <td><span class="chip ${R.clase}" title="${esc(R.ayuda)}">${R.txt}</span></td>
      <td style="font-size:11.5px;max-width:40ch">${
        l.motivo ? esc(String(l.motivo).slice(0,220))
                 : '<span style="color:var(--ink3)">—</span>'}
        ${l.tecnico ? `<details class="crudo"><summary>ver respuesta de Meli</summary><code>${
          esc(String(l.tecnico).slice(0,400))}</code></details>` : ''}</td>
    </tr>`;
  };

  const tab = (k, t, n) => `<button class="tab${filtro===k?' on':''}" data-logf="${k}">${t}
    <span class="b">${n}</span></button>`;

  $('#wrap').innerHTML = `
    <div class="aviso">Cada renglón es algo que esta app le escribió a Mercado Libre.
      <b>hecho</b> quiere decir que Meli lo aceptó <i>y</i> que al releer la publicación el cambio
      estaba puesto — no solamente que contestó que sí.</div>

    <div class="buscador">
      <input type="text" id="qlog" placeholder="Buscar por SKU, producto o campaña" value="${esc(S.q)}" autocomplete="off">
      <span style="color:var(--ink3);font-size:12px">${visibles.length} de ${todo.length}</span>
    </div>

    <div class="tabs">
      ${tab('todos','Todo',todo.length)}
      ${tab('hecho','Hechos',cuenta('hecho'))}
      ${tab('dudoso','Dudosos',cuenta('dudoso'))}
      ${tab('rechazado','Rechazados',cuenta('rechazado'))}
    </div>

    ${repes.size ? `<div class="aviso warn"><b>Hay ${repes.size} renglones marcados como
      repetidos.</b> Son acciones iguales sobre el mismo producto en pocos minutos: la huella
      típica de que la app avisó mal y se rehizo algo que ya estaba hecho. Antes de repetir una
      acción, mirá si el renglón anterior dice <b>dudoso</b> y no <b>rechazado</b>: dudoso casi
      siempre significa que sí quedó.</div>` : ''}

    <div class="panel"><div class="scroll"><table class="listado">
      <thead><tr>
        <th>Cuándo</th><th>Acción</th><th>Producto</th><th>Campaña</th>
        <th class="r">Precio</th><th>Resultado</th><th>Detalle</th>
      </tr></thead>
      <tbody>${visibles.map(fila).join('') ||
        '<tr><td colspan="7"><div class="empty"><b>Nada por acá</b><p>' +
        (todo.length ? 'Ningún movimiento coincide con el filtro.'
                     : 'Todavía no se escribió nada desde la app.') + '</p></div></td></tr>'}</tbody>
    </table></div></div>`;

  $$('[data-logf]').forEach(b => b.onclick = () => { S.logFiltro = b.dataset.logf; render(); });
  const q = $('#qlog');
  if (q) { let t; q.oninput = ev => { clearTimeout(t);
    t = setTimeout(() => { S.q = ev.target.value.trim(); render();
      const c = $('#qlog'); if (c) { c.focus(); c.selectionStart = c.value.length; } }, 250); }; }
}

/** El tipo de promo en corto, para la columna de campaña. */
const tipoPromoCorto = t => ({
  LIGHTNING:'relámpago', PRICE_DISCOUNT:'descuento propio', DOD:'oferta del día',
  SMART:'inteligente', DEAL:'campaña', PRICE_MATCHING:'igualación',
  PRE_NEGOTIATED:'pre-negociada', SELLER_COUPON_CAMPAIGN:'cupón',
  UNHEALTHY_STOCK:'liquidación', PRECIO:'precio de lista', 'CUPÓN':'cupón'
}[t] || String(t).toLowerCase());

/* ═══ SUMAR ═══ */
let sumarActual = null;
function abrirSumar(o) {
  if (!o || !o.p) return;
  sumarActual = o;
  const {it,p} = o;
  const solo = p.aceptaSolo, ligh = p.tipo === 'LIGHTNING';
  // Si Meli ya propuso un precio para esta publicación, ese es el que va: es el
  // que respeta la regla del 5% contra lo que estás vendiendo hoy. El sugerido
  // genérico puede estar por encima y hacer que la oferta rebote.
  const def = p.precio || p.sug || p.max;

  $('#sTit').textContent = 'Sumar a ' + nombrePromo(p);
  $('#sOk').classList.remove('hide');
  $('#sBody').innerHTML = `
    <div class="rango"><span>${esc(it.titulo.slice(0,44))}</span></div>
    <div class="rango">
      <span class="chip acc">${esc(cuotasPub(it))}</span>
      <span>Lista <b class="n">${pes(it.lista)}</b></span>
      ${it.precioActivo?`<span>Hoy <b class="n">${pes(it.precioActivo)}</b></span>`:''}
      <span class="chip mut">${esc(p.tipo)}</span></div>
    ${solo ? `<div class="aviso">Esta campaña la define Mercado Libre: vos solo aceptás.
        Precio <b>${pes(p.precio || p.sug)}</b>${p.meliPct!=null?` — ML pone ${p.meliPct}% y vos ${p.sellerPct}%`:''}.</div>
        ${avisoVisibilidad(visibilidad(it, p.precio, p.inicio, p.fin))}`
    : `<div class="fld"><label>Precio final al comprador</label>
      <div class="par">
        <div><span class="par-lbl">Precio</span>
          <input type="number" id="fPrecio" value="${def?Math.round(def):''}" step="1"></div>
        <span class="par-eq">=</span>
        <div><span class="par-lbl">Descuento de la lista</span>
          <div class="par-pct"><input type="number" id="fDesc" step="0.1" min="0" max="99"
            value="${def && it.lista ? ((1 - def/it.lista)*100).toFixed(1) : ''}"><span>%</span></div></div>
      </div>
      <div class="rango">
        ${p.max?`<button type="button" data-set="${p.max}">Techo ${pes(p.max)}</button>`:''}
        ${p.sug?`<button type="button" data-set="${p.sug}">Sugerido ${pes(p.sug)}</button>`:''}
        ${p.min?`<button type="button" data-set="${p.min}">Piso ${pes(p.min)}</button>`:''}
      </div><span class="help" id="fCalc"></span></div>
    <div id="fVis"></div>
    ${ligh?`<div class="fld"><label>Stock a reservar</label>
      <input type="number" id="fStock" value="${p.stockMin||1}" min="${p.stockMin||1}" ${p.stockMax?`max="${p.stockMax}"`:''}>
      <span class="help">Meli pide entre ${p.stockMin??'—'} y ${p.stockMax??'—'} unidades.</span></div>`:''}
    <div id="fCred"></div>
    ${p.tipo==='PRICE_DISCOUNT'?`<div class="aviso">Máximo 14 días. Descuento entre 5% y 80%.
      Si el ítem ya está en un DEAL, no se aplica hasta que el DEAL termine.</div>`:''}`}
    ${ligh?`<div class="aviso bad">Mientras esté <b>programada</b> la podés eliminar. Una vez que
      arranca ya no: el único camino es pausar la publicación entera. Además, cuando se agota el
      stock que reservaste, Meli da la oferta por terminada sola.</div>`:''}`;

  const calc = () => {
    const el = $('#fCalc'); if (!el) return;
    const v = +($('#fPrecio')||{}).value;
    if (!v || !it.lista) { el.textContent=''; return; }
    const fuera = (p.max && v > p.max) || (p.min && v < p.min);
    // "Descuento 33,5%" a secas se confunde con el 5% de credibilidad, que se
    // mide contra otra cosa. Va con la referencia escrita, y al lado el otro.
    const dLista = (1 - v/it.lista)*100;
    const dHoy = it.precioActivo && v < it.precioActivo
      ? (1 - v/it.precioActivo)*100 : null;
    el.innerHTML = `Descuento <b>${pct(dLista)}</b> de la lista` +
      (dHoy != null ? ` · <b>${pct2(dHoy)}</b> de lo que cobrás hoy` : '') +
      (fuera?` — <span style="color:var(--bad)">fuera del rango (${pes(p.min)} a ${pes(p.max)})</span>`:'');
    // Al cambiar el precio cambia si la oferta llega a verse: se recalcula vivo.
    const vis = $('#fVis');
    if (vis) vis.innerHTML = avisoVisibilidad(visibilidad(it, v, p.inicio, p.fin));
    // Y la regla del 5%: el precio tiene que estar al menos 5% por debajo del
    // más bajo de los últimos 7 días. Sin histórico completo, lo que estás
    // vendiendo hoy es la mejor referencia que tenemos, y suele ser la que Meli
    // usa. Avisar antes es mejor que comerse el rechazo.
    const cr = $('#fCred');
    if (cr) cr.innerHTML = avisoCredibilidad(it, v, p);
  };
  /* Los dos campos van atados: escribís el precio y sale el descuento, o
     escribís el descuento y sale el precio.

     La regla para que no se peleen: el campo donde estás tipeando NUNCA se
     reescribe. Si al escribir "30" en el descuento la app recalculara también
     el descuento desde el precio redondeado, te aparecería "29,9" abajo del
     cursor. Por eso cada uno actualiza solo al otro.

     El descuento es contra la LISTA, que es como lo pensás en Actualizar
     precios: lista = precio ÷ (1 − descuento). El otro porcentaje —el de la
     regla del 5%, contra lo que cobrás hoy— sigue apareciendo abajo, con su
     nombre, porque son cosas distintas y ya nos confundió una vez. */
  const desdePrecio = () => {
    const d = $('#fDesc'); if (!d || !it.lista) return;
    const v = +($('#fPrecio')||{}).value;
    d.value = v > 0 ? ((1 - v / it.lista) * 100).toFixed(1) : '';
    calc();
  };
  const desdeDesc = () => {
    const pr = $('#fPrecio'); if (!pr || !it.lista) return;
    const d = ($('#fDesc')||{}).value;
    pr.value = d === '' ? '' : Math.round(it.lista * (1 - (+d) / 100));
    calc();
  };
  // Los botones de techo/sugerido/piso escriben el precio y arrastran el %.
  $$('#sBody [data-set]').forEach(b => b.onclick = () => {
    $('#fPrecio').value = Math.round(+b.dataset.set); desdePrecio();
  });
  if ($('#fPrecio')) { $('#fPrecio').oninput = desdePrecio; }
  if ($('#fDesc'))   { $('#fDesc').oninput   = desdeDesc; }
  calc();
  const err = $('#sError'); if (err) err.remove();
  $('#dSumar').showModal();
}

/**
 * La regla del 5%, aplicada al precio que estás por poner.
 *
 * Meli valida el descuento contra el precio más bajo de los últimos 7 días. No
 * tenemos ese histórico completo, pero lo que estás vendiendo hoy es la mejor
 * referencia y en la práctica es la que rebota. Avisar acá evita el rechazo.
 */
/**
 * La regla del 5%, contada con las dos referencias a la vista.
 *
 * El error fácil —y ya lo cometimos— es restar porcentajes de lista. Con lista
 * 11.427, vendiendo a 7.999 (−30,0%) y una relámpago a 7.599 (−33,5%), la resta
 * da "3,5 puntos" y parece que no llega al 5%. Pero Meli no mide contra la
 * lista: 7.599 es 5,0% más barato que 7.999, y por eso lo acepta. Los dos
 * números van escritos, cada uno con su referencia, para que no haya que
 * deducir cuál es cuál.
 */
/** Porcentaje con dos decimales: al filo del 5%, un decimal no alcanza. */
const pct2 = n => (n == null || isNaN(n)) ? '—' : n.toFixed(2).replace('.', ',') + '%';

function avisoCredibilidad(it, precio, promo) {
  const ref = it.precioActivo;
  if (!precio || !ref) return '';

  /* ¿Contra qué precio compara Meli? Contra el más bajo de los últimos 7 días
     ANTES de que la oferta arranque. Si la promoción que estás por poner
     empieza cuando la de hoy ya terminó, el precio de hoy NO es esa base.

     Esto daba un cartel rojo absurdo: CYBER FEST arranca el 31-ago, cuando
     DESCUENTAZOS —que hoy vende a 307.069— ya venció. La app comparaba los
     374.999 de la campaña futura contra los 307.069 de hoy, cantaba
     "−22,1%, Meli lo va a rechazar", y Meli lo aceptó sin chistar. No podía
     ser de otra manera: para el 31 de agosto ese precio ya no existe.

     Cuando la oferta arranca después de que se cae la de hoy, no tenemos con
     qué comparar —dependería de qué precio quede vigente entonces— y lo
     honesto es decirlo en vez de inventar un veredicto. */
  if (promo && it.vigente && promo !== it.vigente) {
    const arranca = tIni(promo), termina = tFin(it.vigente);
    if (arranca > termina) {
      const d = it.lista ? (1 - precio / it.lista) * 100 : null;
      return `<div class="aviso">Esta promoción arranca el <b>${esc(fecha(promo.inicio))}</b>,
        cuando <b>${esc(nombrePromo(it.vigente))}</b> —la que hoy vende a ${pes(ref)}— ya terminó.
        La regla del 5% mira el precio más bajo de los ${VENTANA} días previos al arranque, así que
        <b>no se puede saber desde acá</b> contra qué va a comparar Meli: depende de a cuánto
        estés vendiendo para entonces.${d != null
          ? ` Lo que sí es seguro: a ${pes(precio)} el descuento es <b>${pct(d)}</b> de la
             lista de ${pes(it.lista)}.` : ''}</div>`;
    }
  }

  const pc = (1 - precio / ref) * 100;
  const deLista = it.lista ? (1 - precio / it.lista) * 100 : null;

  // Los dos porcentajes, cada uno con su referencia escrita. El error fácil es
  // restar los de lista: con lista 11.427, vendiendo a 7.999 y oferta a 7.599,
  // contra la lista dan 30,0% y 33,5% —la resta sugiere "3,5%"— pero contra lo
  // que cobrás son 5,0%, que es lo único que Meli mira.
  const dosNumeros = deLista != null
    ? `<div class="sub" style="margin-top:6px">En la pantalla vas a ver
       <b>−${pct(deLista)}</b>, que es contra la lista de ${pes(it.lista)}. Para la regla del 5%
       el que cuenta es el otro: <b>−${pct2(pc)}</b> contra los ${pes(ref)} que cobrás hoy.</div>`
    : '';

  if (pc >= 5.1)
    return `<div class="aviso ok">Cumple la regla del 5%: es <b>${pct(pc)}</b> más barato
      que los ${pes(ref)} a los que vendés hoy.${dosNumeros}</div>`;

  /* La franja del filo.
     Acá la app no puede afirmar nada, y afirmarlo ya salió mal una vez: dijo
     "Meli va a rechazar" sobre un precio que Meli aceptó. Dos motivos:

       · El precio que cobrás casi nunca es redondo. Meli devuelve 7.998,60 y la
         pantalla muestra 7.999; el 5% de uno y del otro difieren en un peso, y
         justo en el borde ese peso decide.
       · La regla no compara contra lo que cobrás hoy sino contra el precio más
         bajo de los últimos 7 días. Casi siempre son el mismo número, pero
         "casi siempre" no es "siempre", y este aviso usa lo de hoy como
         aproximación.

     Así que en la franja se dice que está al filo y cuánto bajar para no
     depender de la suerte, en vez de dar un veredicto que no nos consta. */
  const seguro = Math.floor(ref * 0.9485);     // deja el 5,15%, fuera de la franja
  if (pc >= 4.85)
    return `<div class="aviso warn"><b>Está justo en el filo del 5%.</b>
      A ${pes(precio)} son <b>${pct2(pc)}</b> abajo de los ${pes(ref)} que cobrás hoy — la regla
      pide 5%. Puede entrar o rebotar: Meli compara contra el precio más bajo de los últimos
      ${VENTANA} días y lo redondea distinto que esta pantalla, y en el borde un peso decide.
      Con <b>${pes(seguro)}</b> o menos no depende de la suerte.${dosNumeros}</div>`;

  return `<div class="aviso bad"><b>Meli va a rechazar este precio.</b>
    Hoy cobrás <b>${pes(ref)}</b> y la oferta tiene que ser al menos <b>5% más barata</b>.
    A ${pes(precio)} son ${pct2(pc)}, y hace falta ${pes(seguro)} o menos.${dosNumeros}</div>`;
}

/** Deja el error a la vista dentro del diálogo, en vez de un toast que se va. */
function mostrarErrorSumar(msg) {
  const b = $('#sBody'); if (!b) { toast(msg, 'bad'); return; }
  var caja = $('#sError');
  if (!caja) {
    caja = document.createElement('div');
    caja.id = 'sError'; caja.className = 'aviso bad';
    caja.style.marginTop = '12px';
    b.appendChild(caja);
  }
  caja.innerHTML = '<b>Mercado Libre rechazó el cambio.</b><br>' + esc(msg);
  caja.scrollIntoView({ block: 'nearest' });
  toast(msg, 'bad');
}

/* ═══ CREAR DESCUENTO INDIVIDUAL A MANO ═══ */

    <div class="fld"><label>Precio final al comprador</label>

        <span class="par-eq">=</span>
        <div><span class="par-lbl">Descuento de la lista</span>
          <div class="par-pct"><input type="number" id="fDesc" step="0.1" min="0" max="99"
            value="${techo && it.lista ? ((1 - techo/it.lista)*100).toFixed(1) : ''}"><span>%</span></div></div>
      </div>
      <div class="rango">
        ${techo?`<button type="button" data-set="${techo}">Mínimo 5% · ${pes(techo)}</button>`:''}
        ${it.lista?`<button type="button" data-set="${Math.floor(it.lista*0.9)}">10% · ${pes(Math.floor(it.lista*0.9))}</button>`:''}
        ${it.lista?`<button type="button" data-set="${Math.floor(it.lista*0.85)}">15% · ${pes(Math.floor(it.lista*0.85))}</button>`:''}
      </div>
      <span class="help" id="fCalc"></span></div>

    <div class="fld" style="flex-direction:row;gap:12px">
      <div class="fld" style="flex:1"><label>Desde</label>

      <div class="fld" style="flex:1"><label>Hasta</label>

    </div>

    ${it.dias != null && it.dias < VENTANA && it.muestras > 0
      ? `<div class="aviso bad">Esta publicación lleva solo <b>${it.dias} de ${VENTANA} días</b> sin oferta.
         Si el precio no le resulta creíble a Meli, el descuento va a ser rechazado.</div>` : ''}`;

  const calc = () => {
    const el = $('#fCalc'); if (!el) return;

  const desdeDesc2 = () => {

$('#sOk').onclick = async () => {
  const o = sumarActual; if (!o) return;
  const {it} = o;

  // Descuento individual creado a mano
  if (o.manual) {
    const v = +($('#fPrecio')||{}).value;
    if (!v) { toast('Falta el precio','bad'); return; }
    const d = (1 - v/it.lista)*100;
    if (d < 5 || d >= 80) { toast('El descuento tiene que estar entre 5% y 80%','bad'); return; }
    const ini = ($('#fIni')||{}).value, f = ($('#fFin')||{}).value;
    if ((new Date(f) - new Date(ini))/864e5 > 14) { toast('El máximo son 14 días','bad'); return; }
    try {
      await escribir('sumar', { item_id: it.id, promotion_type:'PRICE_DISCOUNT', deal_price: v,
        start_date: ini + 'T00:00:00', finish_date: f + 'T00:00:00' }, 'Descuento creado', $('#sOk'));
      $('#dSumar').close();

    // Ahora el error queda fijo adentro del diálogo, con el precio a la vista.
    mostrarErrorSumar(e.message);
  }
};

/* ═══════════════════════════════════════════════════════════
   INDICADOR DE TRABAJO
   Cualquier cosa que salga a la red pasa por acá: el botón muestra el
   cronómetro, arriba corre una barra, y se recuerda cuánto tardó la última vez
   para poder decir "12,4s de ~14s" en vez de dejarte adivinando.
   ═══════════════════════════════════════════════════════════ */
const DURACIONES = JSON.parse(localStorage.getItem('cdp_dur') || '{}');

function ocupar(el, etiqueta, clave) {
  const t0 = Date.now();
  const previo = DURACIONES[clave] || null;
  const original = el ? el.innerHTML : null;
  if (el) el.disabled = true;
  const barra = $('#barra i'), pill = $('#trabajando');
  if (pill) pill.hidden = false;

  const pinta = () => {
    const s = (Date.now() - t0) / 1000;
    const txt = (s < 10 ? s.toFixed(1) : Math.round(s)) + 's';
    if (el) el.innerHTML = '<span class="spin"></span> ' + etiqueta + ' · ' + txt;
    if (pill) pill.innerHTML = '<span class="spin"></span> ' + etiqueta +
      ' · <b>' + txt + '</b>' + (previo ? ' <small>de ~' + previo + 's</small>' : '');
    // Con referencia, la barra va proporcional; sin ella, avanza y frena en 90%
    // para no mentir que terminó.
    if (barra) barra.style.width = (previo ? Math.min(97, (s / previo) * 100)
                                           : Math.min(90, s * 14)) + '%';
  };
  const timer = setInterval(pinta, 120);
  pinta();

  return function fin(ok) {
    clearInterval(timer);
    const s = Math.max(1, Math.round((Date.now() - t0) / 1000));
    if (ok !== false) { DURACIONES[clave] = s; localStorage.setItem('cdp_dur', JSON.stringify(DURACIONES)); }
    if (barra) { barra.style.width = '100%'; setTimeout(() => { barra.style.width = '0'; }, 400); }
    if (pill) pill.hidden = true;
    if (el) { el.disabled = false; el.innerHTML = original; }
    return s;
  };
}

/**
 * Aplica el resultado de una escritura sin volver a bajar todo.
 *
 * Antes, cada "Sumar" o "Salir" terminaba en cargar(): el backend volvía a leer
 * las 1320 filas de Datos, el histórico y el log enteros, los serializaba y los
 * mandaba de nuevo. Varios segundos, para un ítem que cambió.
 *
 * Ahora el backend devuelve las filas frescas de ESE ítem y acá se reemplazan
 * en memoria. La red se usa una sola vez, para la escritura.
 */
function parchar(itemId, filas) {
  if (!S.data || !filas || !filas.length) return false;
  S.data.datos = S.data.datos.filter(r => String(r.item_id) !== String(itemId)).concat(filas);
  procesar(S.data);
  render();
  return true;
}

/**
 * Verifica que el cambio haya quedado, mirando el dato fresco.
 *
 * Que la llamada no tire error no alcanza: Meli puede contestar 200 y que la
 * promoción siga como disponible. Como el backend devuelve las filas
 * actualizadas de esa publicación, se puede comprobar de verdad en vez de
 * suponer. Si no se puede confirmar, se dice — no se da por hecho.
 */
function verificar(accion, body, filas, r) {
  const tipo = body.promotion_type;

  /* El backend ya averiguó si quedó, y mirando la fuente correcta: primero la
     publicación y, si esa va atrasada, la lista de la campaña —que es la que
     ve el seller center y la que se actualiza primero—. Cuando manda ese dato,
     manda ese dato: recalcularlo acá desde `filas` fue justo el error que hizo
     que la app dijera "no quedó" sobre cosas que sí habían quedado. */
  if (r && typeof r.confirmado === 'boolean') {
    const quiere = accion !== 'salir';
    if (r.confirmado === quiere || (accion === 'salir' && r.confirmado)) {
      // La fila que corresponde a esta promo. Se prefiere una ya puesta —trae
      // precio y fechas—, pero si las filas vienen atrasadas sirve cualquiera
      // del mismo tipo y campaña: al menos da el nombre, que es lo que se lee.
      const dela = (filas || []).filter(x => String(x.promo_tipo) === tipo &&
        (!body.promotion_id || String(x.promo_id) === String(body.promotion_id)));
      const f = dela.find(x => x.status === 'started' || x.status === 'pending') || dela[0];
      if (accion === 'salir')
        return { ok: true, titulo: 'Saliste de la promoción',
                 detalle: 'Confirmado contra ' + (r.fuente || 'Mercado Libre') +
                          '. Ojo: el reloj de credibilidad arranca ahora.' };
      const cuando = f && f.inicio ? ' · ' + fecha(f.inicio) + (f.fin ? ' → ' + fecha(f.fin) : '') : '';
      return { ok: true, titulo: 'Confirmado por Mercado Libre',
               detalle: ((f && f.promo_nombre) || NOMBRE_TIPO[tipo] || tipo) + ' quedó ' +
                        (f && f.status === 'started' ? 'activa'
                          : f && f.status === 'pending' ? 'programada' : 'puesta') +
                        (f && f.precio_promo ? ' a ' + pes(+f.precio_promo) : '') + cuando +
                        '. Comprobado contra ' + (r.fuente || 'Mercado Libre') + '.' };
    }
    return accion === 'salir'
      ? { ok: false, titulo: 'Puede que no haya salido',
          detalle: 'Meli aceptó el pedido pero ni la publicación ni la lista de la campaña lo ' +
                   'reflejan todavía. Fijate en Meli antes de rehacerlo.' }
      : { ok: false, titulo: 'Puede que no haya quedado',
          detalle: 'Meli aceptó el pedido pero ni la publicación ni la lista de la campaña lo ' +
                   'reflejan todavía. Fijate en Meli antes de rehacerlo.' };
  }

  // Backend viejo, sin el dato: se deduce de las filas, como antes.
  if (!filas || !filas.length)
    return { ok: null, titulo: 'No pude confirmarlo',
             detalle: 'El pedido salió sin error, pero no me llegó el estado actualizado. Sincronizá y revisá antes de rehacerlo.' };

  const suyas = filas.filter(f => String(f.promo_tipo) === tipo &&
    (!body.promotion_id || String(f.promo_id) === String(body.promotion_id)));
  const adentro = suyas.filter(f => f.status === 'started' || f.status === 'pending');

  /* Ojo con lo que sigue: estas filas salen de /seller-promotions/items/{id},
     que tarda en ponerse al día después de escribir. El backend ya relee una
     segunda vez cuando la primera foto contradice lo que se hizo, así que si
     igual contradice hay motivo para dudar — pero no es una sentencia. Por eso
     el texto dice qué mirar en vez de afirmar que falló. */
  if (accion === 'salir') {
    return adentro.length
      ? { ok: false, titulo: 'Puede que no haya salido',
          detalle: 'Meli aceptó el pedido pero, releyendo dos veces, la promoción sigue figurando ' +
                   'como aceptada. A veces es la vista de la publicación que va atrasada: fijate ' +
                   'en Meli antes de rehacerlo, y si allá ya salió, es solo el refresco.' }
      : { ok: true,  titulo: 'Saliste de la promoción', detalle: 'Ya no participa. Ojo: el reloj de credibilidad arranca ahora.' };
  }

  if (!adentro.length)
    return { ok: false, titulo: 'Puede que no haya quedado',
             detalle: 'Meli aceptó el pedido pero, releyendo dos veces, la promoción sigue ' +
                      'figurando como disponible. A veces es la vista de la publicación que va ' +
                      'atrasada: fijate en Meli antes de rehacerlo, y si allá ya está, es solo el refresco.' };

  const f = adentro[0];
  const cuando = f.inicio ? ' · ' + fecha(f.inicio) + (f.fin ? ' → ' + fecha(f.fin) : '') : '';
  return { ok: true, titulo: 'Confirmado por Mercado Libre',
           detalle: (f.promo_nombre || tipo) + ' quedó ' +
                    (f.status === 'started' ? 'activa' : 'programada') +
                    (f.precio_promo ? ' a ' + pes(+f.precio_promo) : '') + cuando + '.' };
}

/** Escribe en Meli, refresca solo lo que cambió, y comprueba que haya quedado. */
async function escribir(accion, body, mensaje, boton) {
  const fin = ocupar(boton, accion === 'salir' ? 'Saliendo' : 'Sumando', 'escritura');
  try {
    const r = await api(accion, body);
    const seg = fin();
    const filas = r && r.filas;
    if (!parchar(body.item_id, filas)) cargar();

    const v = verificar(accion, body, filas, r);
    S.resultado = Object.assign({ item: body.item_id, seg: seg }, v);
    render();
    /* Antes, una verificación dudosa se tiraba como error: el diálogo quedaba
       abierto con un cartel rojo y uno volvía a apretar. Pero acá Meli YA
       aceptó el pedido —si lo hubiera rechazado, api() habría tirado antes—,
       así que rehacerlo es lo último que conviene. La duda se muestra en el
       cartel de arriba, que no se va solo, y el diálogo se cierra. Los errores
       de verdad —precio no creíble, sitio no habilitado— siguen tirando desde
       api() y siguen abriendo el cartel rojo adentro del diálogo. */
    toast(v.titulo + ' · ' + seg + 's', v.ok ? 'ok' : 'warn');
  } catch (e) {
    fin(false);
    /* Un rechazo de Meli merece el mismo trato que una confirmación: cartel
       fijo arriba, con el texto ENTERO. El toast se va solo a los nueve
       segundos y encima se corta contra el borde de la pantalla —el error
       llegaba a leerse "Errors:" y nada más—.

       Y se vuelve a leer el registro: el backend ya anotó el rechazo con el
       motivo, pero la copia que tiene la app es la de la última carga, así
       que el renglón no aparecía en Registro hasta recargar a mano. */
    const msg = String(e.message || e);
    // Si el rechazo es por permisos, se anota el tipo: la próxima vez la app
    // no ofrece un botón que Meli no va a cumplir.
    const aprendido = accion === 'salir' &&
      aprenderSalidaBloqueada(body.promotion_type, msg);
    S.resultado = { ok: false, item: body.item_id,
      titulo: 'Mercado Libre rechazó el pedido',
      detalle: msg + (aprendido
        ? ' — Lo anoté: de las campañas ' + (NOMBRE_TIPO[body.promotion_type] ||
            body.promotion_type) + ' la app ya no va a ofrecer el botón de salir.'
        : '') };
    render();
    refrescarRegistro();
    throw e;
  }
}

/** Relee el registro sin tocar el resto de la pantalla. */
async function refrescarRegistro() {
  try {
    const d = await api('datos');
    S.log = d.log || S.log;
    if (S.data) S.data.log = S.log;
    render();
  } catch (err) { /* si falla, el registro se ve en la próxima carga */ }
}

/**
 * El resultado de la última escritura, arriba de la pantalla y hasta que lo
 * cierres. Un toast se va solo a los tres segundos y uno termina sin saber si
 * se guardó — que es justo lo que no puede pasar con cambios de precio.
 */
function bannerResultado() {
  const r = S.resultado;
  if (!r) return '';
  const clase = r.ok === true ? 'ok' : r.ok === false ? 'bad' : '';
  const icono = r.ok === true ? '✓' : r.ok === false ? '✕' : '?';
  return `<div class="aviso ${clase} resultado">
    <span class="ico">${icono}</span>
    <div><b>${esc(r.titulo)}</b> ${esc(r.detalle)}
      ${r.item ? `<div class="sub">${esc(r.item)}${r.seg?' · '+r.seg+'s':''}</div>` : ''}</div>
    <button class="btn xs" id="cerrarRes">cerrar</button></div>`;
}

/**
 * Antigüedad del dato, arriba de todo.
 * La app solo puede mostrar lo que se sincronizó: una promoción nueva —una
 * relámpago, una propuesta que entró ayer— existe en Meli y no acá hasta la
 * próxima sync. Cuando algo "no aparece", este es el primer lugar a mirar.
 */
function pintarFrescura(u) {
  const el = $('#frescura');
  if (!el) return;
  if (!u || !u.cuando) {
    el.className = 'frescura muyvieja';
    el.innerHTML = 'Sin sincronizar — la app no tiene datos de Meli todavía';
    return;
  }
  const hs = (Date.now() - new Date(u.cuando)) / 36e5;
  const cuando = new Date(u.cuando).toLocaleString('es-AR',
    {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', timeZone:TZ_AR});
  const clase = hs > 24 ? 'muyvieja' : hs > 8 ? 'vieja' : '';
  const edad = hs < 1 ? 'hace ' + Math.max(1, Math.round(hs*60)) + ' min'
             : hs < 24 ? 'hace ' + Math.round(hs) + ' h'
             : 'hace ' + Math.round(hs/24) + ' días';
  el.className = 'frescura ' + clase;
  el.innerHTML = 'Datos de <b>' + esc(cuando) + '</b> · ' + edad +
    ' · ' + (u.publicaciones||0) + ' publicaciones' +
    (clase ? ' — <b>sincronizá antes de decidir</b>' : '') +
    ' <span class="ver" title="Versión del index.html que está corriendo en el navegador">v' + VERSION + '</span>' +
    versionBackChip();
}

/**
 * La versión del backend, al lado de la del front.
 *
 * El /exec sirve la última versión IMPLEMENTADA, no la que tenés pegada en el
 * editor. Si te olvidás de "Implementar → Versión nueva", la app sigue usando
 * código viejo y no hay forma de darse cuenta. Ahora sí.
 */
function versionBackChip() {
  const vb = S.data && S.data.versionBack;
  const c  = (S.data && S.data.contrato) || 0;
  if (!vb) return ' <span class="ver desfasado" title="El backend implementado es viejo. Hacé Implementar → Versión nueva.">back: ?</span>';
  // Comparar versión contra versión daba falsas alarmas: el front cambia mucho
  // más seguido que el backend y no siempre necesita nada nuevo de él. Lo que
  // importa es el CONTRATO — qué acciones sabe responder. Solo se avisa cuando
  // al backend le falta algo que el front va a pedir.
  const falta = c < CONTRATO_MINIMO;
  return ' <span class="ver' + (falta ? ' desfasado' : '') + '" title="' +
    (falta ? 'Al backend implementado le faltan acciones que esta versión de la app usa (tiene contrato ' +
             c + ', necesita ' + CONTRATO_MINIMO + '). Hacé Implementar → Versión nueva en Apps Script.'
           : 'Backend ' + vb + ' · contrato ' + c + ': tiene todo lo que la app necesita.') +
    '">back ' + esc(vb) + (falta ? ' ◄ le faltan funciones' : '') + '</span>';
}

/* ═══ carga ═══ */
async function cargar() {
  if (!S.url || !S.key) { render(); return; }
  const finCarga = ocupar($('#recargar'), 'Leyendo', 'datos');
  try {
    procesar(await api('datos'));
    const u = S.data.ultimaSync || {};
    $('#pie').innerHTML = u.cuando
      ? 'Sync ' + new Date(u.cuando).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
        + '<br>' + (u.publicaciones||0) + ' publicaciones · ' + (u.filas||0) + ' filas'
      : 'Conectado, sin sincronizar';
    pintarFrescura(u);
  } catch (e) { toast(e.message,'bad'); }
  finally { finCarga(); render(); }
}
$('#sync').onclick = async () => {
  const fin = ocupar($('#sync'), 'Sincronizando', 'sync');
  try { const r = await api('sync');
    const seg = fin();
    // Si Meli frenó por rate limit, decirlo: explica por qué tardó más.
    const fr = r.rate && r.rate.r429
      ? ' · Meli frenó ' + r.rate.r429 + ' llamadas (lote bajó a ' + r.rate.menorTam + ')' : '';
    toast(r.publicaciones + ' publicaciones y ' + r.filas + ' promociones · ' + seg + 's' + fr,
          r.rate && r.rate.r429 ? 'warn' : 'ok');
    await cargar(); }
  catch (e) { fin(false); toast(e.message,'bad'); }
};
$('#recargar').onclick = cargar;

function ir(v) {
  S.vista = v;
  $$('.nav').forEach(n => n.setAttribute('aria-current', n.dataset.v===v ? 'true':'false'));
  if (v !== 'listado') S.campFiltro = null;
  render();
}
$$('.nav').forEach(n => n.onclick = () => ir(n.dataset.v));

function abrirCfg(){ $('#cUrl').value = S.url; $('#cKey').value = S.key; $('#dCfg').showModal(); }
$('#cfg').onclick = abrirCfg;
$('#cCancel').onclick = () => $('#dCfg').close();
$('#cSave').onclick = () => {
  S.url = $('#cUrl').value.trim(); S.key = $('#cKey').value.trim();
  localStorage.setItem('cdp_url', S.url); localStorage.setItem('cdp_key', S.key);
  $('#dCfg').close(); cargar();
};
$('#sCancel').onclick = () => $('#dSumar').close();

$('#tema').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':cur==='light'?'':'dark';
  next ? document.documentElement.setAttribute('data-theme',next)
       : document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('cdp_tema', next); } catch(e){}
};
try { const t = localStorage.getItem('cdp_tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){}

pintarFrescura(null);
if (!S.url) abrirCfg();
cargar();
</script>
</body>

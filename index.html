<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDP Kenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F4F7F6; --panel:#FFFFFF; --panel2:#EDF2F1; --panel3:#E3EAE8;
  --ink:#15201E; --ink2:#4C5D59; --ink3:#7A8B87;
  --line:#D8E0DD; --line2:#BDC9C5;
  --acc:#0E6B63; --acc2:#DBEDEA;
  --ok:#2C7A4B; --okbg:#DDF0E4;
  --warn:#8A5D06; --warnbg:#F8EBD1;
  --bad:#A63A2E; --badbg:#F8E2DE;
  --shadow:0 1px 2px rgba(21,32,30,.06),0 10px 28px -20px rgba(21,32,30,.3);
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1312; --panel:#151E1C; --panel2:#1C2624; --panel3:#24302D;
  --ink:#E2E9E6; --ink2:#A3B3AF; --ink3:#788A86;
  --line:#28352F; --line2:#3A4844;
  --acc:#54B8AB; --acc2:#123029;
  --ok:#6BC489; --okbg:#132F1D;
  --warn:#D9A63F; --warnbg:#31260C;
  --bad:#E2786A; --badbg:#351A16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -20px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#0D1312; --panel:#151E1C; --panel2:#1C2624; --panel3:#24302D;
  --ink:#E2E9E6; --ink2:#A3B3AF; --ink3:#788A86;
  --line:#28352F; --line2:#3A4844;
  --acc:#54B8AB; --acc2:#123029;
  --ok:#6BC489; --okbg:#132F1D;
  --warn:#D9A63F; --warnbg:#31260C;
  --bad:#E2786A; --badbg:#351A16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.015em}
.n{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc)}

#app{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:900px){#app{grid-template-columns:206px 1fr}}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:18px 12px}
@media(min-width:900px){aside{position:sticky;top:0;height:100vh}}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:"Bricolage Grotesque";font-size:17px;font-weight:700}
.brand span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-family:"JetBrains Mono"}
.nav{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r);border:0;background:none;
  cursor:pointer;text-align:left;width:100%;font-family:"Bricolage Grotesque";font-weight:500;font-size:13.5px;color:var(--ink2)}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--acc2);color:var(--acc);font-weight:700}
.nav .b{margin-left:auto;font:600 10.5px "JetBrains Mono";background:var(--panel3);color:var(--ink2);padding:1px 6px;border-radius:20px}
.nav[aria-current="true"] .b{background:var(--acc);color:var(--panel)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot small{color:var(--ink3);font-size:11px;line-height:1.45}

main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;background:var(--ground);border-bottom:1px solid var(--line);
  padding:14px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-size:19px;font-weight:700;margin-right:auto}
.wrap{padding:20px 22px 60px;display:flex;flex-direction:column;gap:16px}

.btn{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 13px;cursor:pointer;
  font-family:"Bricolage Grotesque";font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.xs{padding:2px 7px;font-size:11px;font-family:"JetBrains Mono"}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
input[type=text],input[type=number],input[type=password],select{
  border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 10px}
input:focus-visible,select:focus-visible,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* ── buscador SKU grande ── */
.buscador{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#qsku{font-family:"JetBrains Mono";font-size:17px;padding:12px 14px;min-width:230px;flex:1;max-width:420px;letter-spacing:.02em}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sug{border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:5px 12px;cursor:pointer;
  font:600 12px "JetBrains Mono"}
.sug:hover{border-color:var(--acc);color:var(--acc)}
.sug small{font-family:system-ui;font-weight:400;color:var(--ink3);margin-left:6px}

/* ── leyenda ── */
.leyenda{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.leyenda summary{padding:12px 16px;cursor:pointer;font-family:"Bricolage Grotesque";font-weight:600;
  font-size:13px;color:var(--acc);list-style:none;display:flex;align-items:center;gap:8px}
.leyenda summary::-webkit-details-marker{display:none}
.leyenda summary::before{content:"›";font-size:17px;line-height:1;transition:transform .15s;display:inline-block}
.leyenda[open] summary::before{transform:rotate(90deg)}
.ley-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ley-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px}
.ley-g div{display:flex;flex-direction:column;gap:3px}
.ley-g b{font:400 10px "JetBrains Mono";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.ley-g span{font-size:12.5px;color:var(--ink2);line-height:1.5}
.ley-g span b{font-family:inherit;font-size:inherit;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600}
.ley-n{background:var(--panel2);border-radius:6px;padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.55}

/* ── cabecera de SKU ── */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;
  display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero img{width:64px;height:64px;object-fit:contain;border-radius:6px;background:var(--panel2);flex:none}
.hero .txt{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.hero .sk{font:600 12px "JetBrains Mono";letter-spacing:.1em;color:var(--acc)}
.hero h2{font-size:19px;font-weight:700;line-height:1.2}
.hero .stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px}
.hero .stats div{display:flex;flex-direction:column}
.hero .stats span{font:400 10px "JetBrains Mono";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.hero .stats b{font-family:"JetBrains Mono";font-size:17px;font-variant-numeric:tabular-nums}

/* ── matriz ── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.panel>h3{font-size:13.5px;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:center}
.panel>h3 .hint{font-family:system-ui;font-weight:400;font-size:12px;color:var(--ink3);margin-left:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);z-index:2;font:400 10px/1.3 "JetBrains Mono";
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:9px 11px;
  border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:bottom}
th.r,td.r{text-align:right}
th.c,td.c{text-align:center}
td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
.matriz th:first-child,.matriz td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;min-width:150px}
.matriz thead th:first-child{background:var(--panel2);z-index:3}
.matriz tr:hover td:first-child{background:var(--panel2)}
.celda{display:flex;flex-direction:column;gap:2px;align-items:center;font-size:11px}
.celda .pz{font-family:"JetBrains Mono";font-variant-numeric:tabular-nums;font-size:11.5px}

.chip{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1 "JetBrains Mono";letter-spacing:.05em;
  text-transform:uppercase;padding:3px 6px;border-radius:4px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.mut{background:var(--panel3);color:var(--ink3)}
.chip.acc{background:var(--acc2);color:var(--acc)}

/* ── bloque publicación ── */
.pub{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.pub-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:var(--panel2)}
.pub-h .cuota{font-family:"Bricolage Grotesque";font-weight:700;font-size:14.5px}
.pub-h .id{font:400 10.5px "JetBrains Mono";color:var(--ink3)}
.pub-h .sep{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.pub-h .sep b{font-family:"JetBrains Mono";font-variant-numeric:tabular-nums}
.conds{display:flex;gap:5px;flex-wrap:wrap}
.reloj{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2)}
.prog{height:5px;width:64px;border-radius:3px;background:var(--panel3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc)}
.prog.done i{background:var(--ok)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font:400 10px/1 "JetBrains Mono";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-family:"JetBrains Mono";font-weight:600;font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .d{font-size:11px;color:var(--ink3)}
.kpi.hot .v{color:var(--bad)}
.kpi.good .v{color:var(--ok)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;
  display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--line2);box-shadow:var(--shadow)}
.card.urg{border-top-color:var(--bad)} .card.pron{border-top-color:var(--warn)} .card.calm{border-top-color:var(--ok)}
.card .tipo{font:400 9.5px "JetBrains Mono";letter-spacing:.09em;color:var(--ink3)}
.card .nom{font-family:"Bricolage Grotesque";font-weight:700;font-size:14.5px;line-height:1.2}
.card .venc{font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.card .venc b{font-family:"JetBrains Mono";font-variant-numeric:tabular-nums}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;
  max-width:520px;width:calc(100% - 32px);box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,18,16,.55)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);font-family:"Bricolage Grotesque";font-weight:700;font-size:16px}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font:400 10.5px "JetBrains Mono";letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.fld .help{font-size:11.5px;color:var(--ink3)}
.rango{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.rango button{border:1px solid var(--line2);background:var(--panel2);border-radius:5px;padding:3px 8px;cursor:pointer;font:600 11px "JetBrains Mono"}
.rango button:hover{border-color:var(--acc);color:var(--acc)}

.aviso{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:10px 13px;font-size:12.5px;line-height:1.5}
.aviso.bad{background:var(--badbg);color:var(--bad)}
.aviso.ok{background:var(--okbg);color:var(--ok)}
.empty{padding:42px 22px;text-align:center;color:var(--ink3);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{font-family:"Bricolage Grotesque";font-size:15px;color:var(--ink2)}
.empty p{max-width:46ch;font-size:13px;line-height:1.6}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast>div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r);
  padding:11px 14px;font-size:13px;box-shadow:var(--shadow)}
.toast>div.bad{border-left-color:var(--bad)} .toast>div.ok{border-left-color:var(--ok)}
.hide{display:none !important}
</style>
</head>
<body>

<div id="app">
  <aside>
    <div class="brand"><b>CDP Kenta</b><span>Central de Promociones</span></div>
    <nav>
      <button class="nav" data-v="sku" aria-current="true">Por SKU <span class="b" id="bS">0</span></button>
      <button class="nav" data-v="sinpromo">Sin promo <span class="b" id="bH">0</span></button>
      <button class="nav" data-v="oportunidades">Oportunidades <span class="b" id="bO">0</span></button>
      <button class="nav" data-v="tarjetas">Campañas <span class="b" id="bT">0</span></button>
      <button class="nav" data-v="credibilidad">Credibilidad <span class="b" id="bC">0</span></button>
      <button class="nav" data-v="registro">Registro</button>
    </nav>
    <div class="side-foot">
      <button class="btn sm" id="cfg">Configuración</button>
      <button class="btn sm" id="tema">Tema</button>
      <small id="pie">Sin conectar</small>
    </div>
  </aside>

  <main>
    <div class="bar">
      <h1 id="tit">Por SKU</h1>
      <button class="btn" id="recargar">Recargar</button>
      <button class="btn p" id="sync">Sincronizar con Meli</button>
    </div>
    <div class="wrap" id="wrap"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<dialog id="dCfg">
  <div class="dlg-h">Conexión</div>
  <div class="dlg-b">
    <div class="fld"><label>URL del Apps Script</label>
      <input type="text" id="cUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <span class="help">Implementar → Administrar implementaciones → URL de la app web.</span></div>
    <div class="fld"><label>Clave</label>
      <input type="password" id="cKey" placeholder="la que pusiste en CLAVE_APP">
      <span class="help">Queda guardada solo en este navegador.</span></div>
  </div>
  <div class="dlg-f"><button class="btn" id="cCancel">Cancelar</button><button class="btn p" id="cSave">Guardar</button></div>
</dialog>

<dialog id="dSumar">
  <div class="dlg-h" id="sTit">Sumar a promoción</div>
  <div class="dlg-b" id="sBody"></div>
  <div class="dlg-f"><button class="btn" id="sCancel">Cancelar</button><button class="btn p" id="sOk">Confirmar</button></div>
</dialog>

<script>
"use strict";

const S = {
  url: localStorage.getItem('cdp_url') || '',
  key: localStorage.getItem('cdp_key') || '',
  data:null, filas:[], items:[], skus:[], camps:[], reloj:{}, log:[], oport:[],
  vista:'sku', q:'', skuSel: localStorage.getItem('cdp_sku') || '', campFiltro:null, sel:new Set()
};
const VENTANA = 7;
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => (n === '' || n == null || isNaN(n)) ? '—' :
  new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(Math.round(n));
const pes = n => (n === '' || n == null || isNaN(n)) ? '—' : '$ ' + num(n);
const pct = n => (n == null || isNaN(n)) ? '—' : n.toFixed(1).replace('.',',') + '%';
const fecha = s => { if(!s) return '—'; const d = new Date(s);
  return isNaN(d) ? '—' : d.toLocaleDateString('es-AR',{day:'2-digit',month:'short'}); };

/** "3x_campaign" → "3 cuotas" · vacío → "Contado" */
/** Número tolerante: '', null, undefined o basura → null. Evita los NaN en pantalla
 *  cuando la hoja todavía tiene los nombres de columna viejos. */
const nn = v => (v === '' || v == null || isNaN(+v)) ? null : +v;

const cuotasLabel = c => {
  const t = String(c || '').trim();
  if (!t) return 'Contado';
  const m = t.match(/(\d+)/);
  return m ? m[1] + ' cuotas' : t;
};

async function api(accion, extra) {
  if (!S.url || !S.key) { abrirCfg(); throw new Error('Falta configurar la conexión'); }
  const r = await fetch(S.url, {
    method:'POST', redirect:'follow',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ accion, clave:S.key }, extra || {}))
  });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch(e) { throw new Error('Respuesta inesperada: ' + t.slice(0,140)); }
  if (!j.ok) throw new Error(j.error === 'clave_invalida' ? 'Clave incorrecta' : j.error);
  return j.data;
}
function toast(msg, tipo) {
  const d = document.createElement('div');
  if (tipo) d.className = tipo; d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), tipo === 'bad' ? 9000 : 4500);
}

/* ══ normalización ══ */
const ACEPTAR_SOLO = ['MARKETPLACE_CAMPAIGN','SMART','PRICE_MATCHING','PRE_NEGOTIATED','VOLUME','UNHEALTHY_STOCK'];

function procesar(d) {
  S.data = d; S.camps = d.campanias || []; S.reloj = d.reloj || {}; S.log = d.log || [];
  const vence = {};
  S.camps.forEach(c => { vence[c.promo_id] = c.vence_aceptacion; });

  S.filas = (d.datos || []).map(r => {
    const lista = nn(r.original_price) || nn(r.precio_vidriera) || nn(r.precio_lista) || 0;
    const max = nn(r.max_disc), min = nn(r.min_disc), sug = nn(r.sugerido);
    const pp  = nn(r.precio_promo);
    return {
      id:String(r.item_id||''), sku:String(r.sku||''), titulo:String(r.titulo||''),
      foto:r.foto, link:r.link, lista, stock:+r.stock||0,
      listingType:r.listing_type||'', cuotas:r.cuotas||'',
      envioGratis:r.envio_gratis==='SI', catalogo:r.catalogo==='SI',
      tipo:r.promo_tipo||'', promoId:String(r.promo_id||''), promo:r.promo_nombre||'', status:r.status||'',
      precio: pp && pp > 0 ? pp : null, max, min, sug,
      meliPct: nn(r['meli_%']), sellerPct: nn(r['seller_%']),
      boost:r.boost==='SI', precioBoost: nn(r.precio_boost),
      inicio:r.inicio, fin:r.fin, vence: vence[String(r.promo_id||'')] || '',
      stockMin: nn(r.stock_min), stockMax: nn(r.stock_max),
      subType:r.sub_type||'', montoFijo: nn(r.monto_fijo), pctFijo: nn(r.pct_fijo),
      pisoPct: (max && lista) ? (1 - max/lista)*100 : null,
      techoPct:(min && lista) ? (1 - min/lista)*100 : null,
      sugPct:  (sug && lista) ? (1 - sug/lista)*100 : null,
      promoPct:(pp && lista)  ? (1 - pp/lista)*100  : null,
      aceptaSolo: ACEPTAR_SOLO.includes(r.promo_tipo),
      esCupon: r.promo_tipo === 'SELLER_COUPON_CAMPAIGN'
    };
  });

  // publicaciones
  const m = new Map();
  S.filas.forEach(f => {
    if (!m.has(f.id)) m.set(f.id, {
      id:f.id, sku:f.sku, titulo:f.titulo, foto:f.foto, link:f.link, lista:f.lista, stock:f.stock,
      listingType:f.listingType, cuotas:f.cuotas, envioGratis:f.envioGratis, catalogo:f.catalogo, promos:[]
    });
    m.get(f.id).promos.push(f);
  });
  S.items = [...m.values()].map(it => {
    const act = it.promos.filter(p => (p.status==='started') && p.precio);
    it.activas = act;
    // "dentro" incluye las programadas: ya están comprometidas aunque no hayan arrancado.
    it.dentro = it.promos.filter(p => (p.status==='started' || p.status==='pending') && !p.esCupon);
    it.precioActivo = act.length ? Math.min(...act.map(p => p.precio)) : null;
    it.descActivo = it.precioActivo && it.lista ? (1 - it.precioActivo/it.lista)*100 : null;
    it.candidatas = it.promos.filter(p => p.status==='candidate' && !p.esCupon);
    it.cupones = it.promos.filter(p => p.esCupon);
    it.dias = (S.reloj[it.id]||{}).diasSinOferta ?? null;
    it.muestras = (S.reloj[it.id]||{}).muestras ?? 0;
    it.sinPromo = it.dentro.length === 0;
    return it;
  });

  // SKUs
  const g = new Map();
  S.items.forEach(it => {
    const k = it.sku || ('s/sku · ' + it.titulo.slice(0,24));
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(it);
  });
  S.skus = [...g.entries()].map(([sku, pubs]) => {
    pubs.sort((a,b) => (a.lista||0) - (b.lista||0));
    const campSet = new Map();
    pubs.forEach(p => p.promos.forEach(x => {
      if (x.esCupon) return;
      const k = x.tipo + '|' + x.promoId;
      if (!campSet.has(k)) campSet.set(k, {clave:k, tipo:x.tipo, promoId:x.promoId, nombre:x.promo, vence:x.vence});
    }));
    return {
      sku, pubs,
      titulo: pubs[0].titulo, foto: pubs[0].foto,
      stock: Math.max(...pubs.map(p => p.stock || 0)),
      campanias: [...campSet.values()].sort((a,b) => (a.tipo+a.nombre).localeCompare(b.tipo+b.nombre)),
      nCand: pubs.reduce((a,p) => a + p.candidatas.length, 0),
      nAct:  pubs.reduce((a,p) => a + p.activas.length, 0)
    };
  }).sort((a,b) => a.sku.localeCompare(b.sku, 'es', {numeric:true}));

  // huérfanas: publicaciones sin ninguna promo activa ni programada
  S.huerfanas = S.items.filter(it => it.sinPromo)
    .sort((a,b) => (b.lista||0) - (a.lista||0));

  // oportunidades
  S.oport = [];
  S.items.forEach(it => it.candidatas.forEach(p => {
    if (!p.max || !it.lista) return;
    const ref = it.precioActivo;
    S.oport.push({ it, p,
      brechaSug: ref && p.sug ? p.sug - ref : null,
      brechaTecho: ref ? p.max - ref : null });
  }));
  S.oport.sort((a,b) => (b.brechaSug ?? -1e12) - (a.brechaSug ?? -1e12));
}

/* ══ router ══ */
function render() {

const vacio = (t,p) => `<div class="panel"><div class="empty"><b>${t}</b><p>${p}</p></div></div>`;

/** Qué significa cada columna, y cómo se llama lo mismo en el seller center. */
function leyenda() {
  return `<details class="leyenda">
    <summary>¿Qué significa cada número?</summary>
    <div class="ley-b">
      <div class="ley-g">
        <div><b>Precio</b><span>A cuánto queda la publicación en esa campaña. Solo aparece si ya estás adentro
          o si Mercado Libre fijó el precio.</span></div>
        <div><b>Techo · máx. permitido</b><span>El precio <b>más alto</b> que Meli te acepta. Dicho al revés:
          el descuento <b>mínimo obligatorio</b>. Es el precio que más margen te deja.</span></div>
        <div><b>Sugerido por Meli</b><span>Lo que Meli te recomienda para que la oferta sea competitiva.
          No es obligatorio, y casi siempre está por debajo del techo.</span></div>
        <div><b>Piso · mín. permitido</b><span>El precio <b>más bajo</b> permitido, o sea el descuento máximo.
          Rara vez conviene, pero marca el otro extremo de la ventana.</span></div>
        <div><b>Co-fondeo</b><span>Cuánto del descuento paga Mercado Libre y cuánto vos. En el seller center
          esto aparece como “a tu cargo” y “Mercado Libre”, pero en pesos en vez de porcentaje.</span></div>
        <div><b>Estados</b><span><span class="chip ok">adentro</span> ya participa ·
          <span class="chip warn">programada</span> aceptada, arranca después ·
          <span class="chip acc">disponible</span> te invitaron y todavía no entraste.</span></div>
      </div>
      <div class="ley-n"><b>Los nombres no coinciden con los del seller center.</b>
        Meli muestra el cartel comercial de la campaña (DESCUENTAZOS, CYBER FEST) más un texto de marketing;
        la API devuelve el nombre técnico y el tipo. El mismo cartel “DESCUENTAZOS” puede envolver
        varias promociones distintas. Para saber si dos filas son la misma, compará el <b>precio final</b>:
        ese sí coincide peso por peso.</div>
    </div>
  </details>`;
}

function heroSku(g) {
  const listas = g.pubs.map(p => p.lista).filter(Boolean);
  return `<div class="hero">
    ${g.foto ? `<img src="${esc(g.foto)}" alt="" loading="lazy">` : ''}
    <div class="txt">
      <span class="sk">SKU ${esc(g.sku)}</span>
      <h2>${esc(g.titulo)}</h2>
      <div class="stats">
        <div><span>Publicaciones</span><b>${g.pubs.length}</b></div>
        <div><span>Rango de lista</span><b>${listas.length ? pes(Math.min(...listas)) + ' – ' + pes(Math.max(...listas)) : '—'}</b></div>
        <div><span>Stock</span><b>${num(g.stock)}</b></div>
        <div><span>Campañas</span><b>${g.campanias.length}</b></div>
        <div><span>Adentro</span><b style="color:var(--ok)">${g.nAct}</b></div>
        <div><span>Disponibles</span><b style="color:var(--acc)">${g.nCand}</b></div>
      </div>
    </div>
  </div>`;
}

/** Matriz publicaciones × campañas: el panorama de un vistazo. */
function matrizSku(g) {
  if (!g.campanias.length) return '';
  const cols = g.campanias;
  const cab = cols.map(c => {
    const d = diasPara(c.vence);
    return `<th class="c">${esc((c.nombre || c.tipo).slice(0,20))}
      <div style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink3);margin-top:3px">
        ${esc(c.tipo.toLowerCase())}${d!=null ? ` · ${d<0?'vencida':d+'d'}` : ''}</div></th>`;
  }).join('');

  const filas = g.pubs.map(p => {
    const celdas = cols.map(c => {
      const x = p.promos.find(y => y.tipo === c.tipo && y.promoId === c.promoId);
      if (!x) return `<td class="c" style="color:var(--ink3)">—</td>`;
      const est = x.status === 'started' ? 'ok' : x.status === 'pending' ? 'warn' : 'acc';
      const txt = x.status === 'started' ? 'adentro' : x.status === 'pending' ? 'programada' : 'disponible';
      const precio = x.precio || x.sug || x.max;
      return `<td class="c"><div class="celda">
        <span class="chip ${est}">${txt}</span>
        ${precio ? `<span class="pz">${pes(precio)}</span>` : ''}
        ${x.promoPct != null ? `<span style="color:var(--ink3)">−${pct(x.promoPct)}</span>`
          : x.pisoPct != null ? `<span style="color:var(--ink3)">mín −${pct(x.pisoPct)}</span>` : ''}
      </div></td>`;
    }).join('');
    return `<tr><td><b style="font-size:12.5px">${esc(cuotasLabel(p.cuotas))}</b>
      <div style="font:400 10px 'JetBrains Mono';color:var(--ink3)">${esc(p.listingType)} · ${pes(p.lista)}</div></td>${celdas}</tr>`;
  }).join('');

  return `<div class="panel"><h3>Panorama
    <span class="hint">Publicaciones en filas, campañas en columnas</span></h3>
    <div class="scroll"><table class="matriz">
      <thead><tr><th>Publicación</th>${cab}</tr></thead>
      <tbody>${filas}</tbody></table></div></div>`;
}

const diasPara = s => { if (!s) return null; const d = new Date(s);
  return isNaN(d) ? null : Math.ceil((d - new Date())/864e5); };

/** Un bloque por publicación con TODAS sus promos y todos los campos. */
function bloquePub(p, g) {
  const conds = [
    `<span class="chip mut">${esc(p.listingType)}</span>`,
    `<span class="chip ${p.cuotas?'acc':'mut'}">${esc(cuotasLabel(p.cuotas))}</span>`,
    p.envioGratis ? '<span class="chip mut">envío gratis</span>' : '<span class="chip mut">envío comprador</span>',
    p.catalogo ? '<span class="chip mut">catálogo</span>' : ''
  ].filter(Boolean).join('');

  const rel = p.muestras > 0 ? (() => {
    const ok = p.dias >= VENTANA;
    const w = Math.min(100, Math.round((p.dias/VENTANA)*100));
    return `<div class="reloj" title="Días consecutivos sin oferta activa">
      <div class="prog ${ok?'done':''}"><i style="width:${w}%"></i></div>
      <span>${p.dias}/${VENTANA} d ${ok?'· podés subir precio':''}</span></div>`;
  })() : `<span style="font-size:11.5px;color:var(--ink3)">reloj: sin histórico aún</span>`;

  const promos = p.promos.filter(x => !x.esCupon)
    .sort((a,b) => (a.status==='started'?0:a.status==='pending'?1:2) - (b.status==='started'?0:b.status==='pending'?1:2));

  const filas = promos.map(x => {
    const est = x.status==='started' ? ['ok','adentro'] : x.status==='pending' ? ['warn','programada'] : ['acc','disponible'];
    const d = diasPara(x.vence);
    const accion = x.status === 'candidate'
      ? `<button class="btn xs" data-add="${esc(p.id)}|${esc(x.tipo)}|${esc(x.promoId)}">Sumar</button>`
      : `<button class="btn xs danger" data-del="${esc(p.id)}|${esc(x.tipo)}|${esc(x.promoId)}">Salir</button>`;
    return `<tr>
      <td><span class="chip ${est[0]}">${est[1]}</span></td>
      <td><b style="font-size:12px">${esc(x.promo || x.tipo)}</b>
        <div style="font:400 10px 'JetBrains Mono';color:var(--ink3)">${esc(x.tipo)}${x.aceptaSolo?' · solo aceptar':' · definís precio'}</div></td>
      <td class="r n">${x.precio?pes(x.precio):'—'}<div style="font-size:10.5px;color:var(--ink3)">${x.promoPct!=null?'−'+pct(x.promoPct):''}</div></td>
      <td class="r n">${x.max?pes(x.max):'—'}<div style="font-size:10.5px;color:var(--ink3)">${x.pisoPct!=null?'−'+pct(x.pisoPct):''}</div></td>
      <td class="r n">${x.sug?pes(x.sug):'—'}<div style="font-size:10.5px;color:var(--ink3)">${x.sugPct!=null?'−'+pct(x.sugPct):''}</div></td>
      <td class="r n">${x.min?pes(x.min):'—'}<div style="font-size:10.5px;color:var(--ink3)">${x.techoPct!=null?'−'+pct(x.techoPct):''}</div></td>
      <td class="c">${x.meliPct!=null?`<span class="chip ok">ML ${x.meliPct}%</span><div style="font-size:10.5px;color:var(--ink3);margin-top:2px">vos ${x.sellerPct}%</div>`:'<span style="color:var(--ink3)">—</span>'}</td>
      <td style="font-size:11px;color:var(--ink2);white-space:nowrap">
        ${x.inicio?fecha(x.inicio)+' → '+fecha(x.fin):'—'}
        ${d!=null?`<div style="color:${d<3?'var(--bad)':'var(--ink3)'}">${d<0?'vencida':'quedan '+d+'d'}</div>`:''}</td>
      <td>${x.boost?'<span class="chip warn">boost</span>':''}
        ${x.stockMin!=null&&x.stockMax!=null?`<span class="chip mut">stock ${x.stockMin}–${x.stockMax}</span>`:''}</td>
      <td class="r">${accion}</td>
    </tr>`;
  }).join('');

  return `<div class="pub">
    <div class="pub-h">
      <span class="cuota">${esc(cuotasLabel(p.cuotas))}</span>
      ${p.sinPromo ? '<span class="chip bad">sin promo</span>' : ''}
      <span class="id">${esc(p.id)}</span>
      ${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener" style="font-size:11.5px">ver en Meli ↗</a>`:''}
      <div class="conds">${conds}</div>
      <div class="sep">
        <span>Lista <b>${pes(p.lista)}</b></span>
        <span>Stock <b>${num(p.stock)}</b></span>
        <span>Vendiendo a <b>${p.precioActivo?pes(p.precioActivo):'—'}</b>${p.descActivo?` <small style="color:var(--ink3)">−${pct(p.descActivo)}</small>`:''}</span>
        ${rel}
      </div>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th>Estado</th><th>Campaña</th><th class="r">Precio</th>
        <th class="r">Techo<br>máx. permitido</th><th class="r">Sugerido<br>por Meli</th><th class="r">Piso<br>mín. permitido</th>
        <th class="c">Co-fondeo</th><th>Vigencia</th><th></th><th></th>
      </tr></thead>
      <tbody>${filas || '<tr><td colspan="10" style="color:var(--ink3);padding:16px">Sin promociones para esta publicación.</td></tr>'}</tbody>
    </table></div>
    ${!p.candidatas.length ? `<div style="padding:11px 16px;border-top:1px solid var(--line);
        display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink2)">
      <span>Ninguna campaña invitó a esta publicación.</span>
      <button class="btn xs p" data-man="${esc(p.id)}">Crear descuento individual</button>
    </div>` : ''}
  </div>`;
}

function cuponesSku(g) {
  const cup = g.pubs[0] ? g.pubs[0].cupones : [];
  if (!cup.length) return '';
  return `<div class="panel"><h3>Cupones del vendedor
    <span class="hint">Aplican a nivel cuenta, no por publicación</span></h3>
    <div class="scroll"><table>
      <thead><tr><th>Cupón</th><th>Tipo</th><th class="r">Beneficio</th><th>Vigencia</th><th>Estado</th></tr></thead>
      <tbody>${cup.map(c => `<tr>
        <td><b style="font-size:12px">${esc(c.promo)}</b></td>
        <td><span class="chip mut">${esc(c.subType)}</span></td>
        <td class="r n">${c.montoFijo!=null?pes(c.montoFijo):c.pctFijo!=null?c.pctFijo+'%':'—'}</td>
        <td style="font-size:11.5px">${fecha(c.inicio)} → ${fecha(c.fin)}</td>
        <td><span class="chip ${c.status==='started'?'ok':'acc'}">${esc(c.status)}</span></td>

function engancharBuscador() {
  const i = $('#qsku');
  if (i) {
    let t;
    i.oninput = e => { clearTimeout(t); t = setTimeout(() => {
      S.q = e.target.value.trim();
      const exacto = S.skus.find(x => x.sku.toLowerCase() === S.q.toLowerCase());
      if (exacto) { S.skuSel = exacto.sku; localStorage.setItem('cdp_sku', exacto.sku); }
      else if (S.skuSel && !S.q) { }
      render();
      const j = $('#qsku'); if (j) { j.focus(); j.setSelectionRange(j.value.length, j.value.length); }
    }, 200); };
  }
  $$('[data-sku]').forEach(b => b.onclick = () => {
    S.skuSel = b.dataset.sku; S.q = ''; localStorage.setItem('cdp_sku', S.skuSel); render();
  });
  if ($('#limpiarSku')) $('#limpiarSku').onclick = () => {
    S.skuSel = ''; S.q = ''; localStorage.removeItem('cdp_sku'); render();
  };
}

function engancharAcciones() {
  $$('[data-man]').forEach(b => b.onclick = () => {
    const it = S.items.find(x => x.id === b.dataset.man);
    if (it) abrirManual(it);
  });
  $$('[data-add]').forEach(b => b.onclick = () => {
    const [id,tipo,pid] = b.dataset.add.split('|');
    const it = S.items.find(x => x.id === id);
    const p  = it && it.promos.find(x => x.tipo===tipo && x.promoId===pid);
    if (p) abrirSumar({it, p}); else toast('No encontré esa promoción','bad');
  });
  $$('[data-del]').forEach(b => b.onclick = async () => {
    const [id,tipo,pid] = b.dataset.del.split('|');
    if (!confirm('¿Sacar esta publicación de ' + tipo + '?\n\nOjo: el reloj de credibilidad de 7 días arranca recién ahora.')) return;
    try { await api('salir',{item_id:id, promotion_type:tipo, promotion_id:pid||undefined});
      toast('Salió de ' + tipo,'ok'); cargar(); }
    catch(e){ toast(e.message,'bad'); }
  });
}

/* ═══════════════════════════════════════════════════════════
   VISTA 2 · SIN PROMO — publicaciones que quedaron afuera
   ═══════════════════════════════════════════════════════════ */
function vSinPromo() {
  $('#tit').textContent = 'Sin promo';

  const conCand = S.huerfanas.filter(it => it.candidatas.length);
  const sinCand = S.huerfanas.filter(it => !it.candidatas.length);
  const plata = conCand.reduce((a,it) => {
    const mejor = mejorCandidata(it);
    return a + (mejor && mejor.sug ? mejor.sug : 0);
  }, 0);

  if (!S.huerfanas.length) {
    $('#wrap').innerHTML = vacio('Todo cubierto',
      'Las ' + S.items.length + ' publicaciones activas tienen al menos una promoción corriendo o programada.');
    return;
  }

  const fila = (it, modo) => {
    const mejor = modo === 'cand' ? mejorCandidata(it) : null;
    const rel = it.muestras > 0
      ? `<span class="chip ${it.dias>=VENTANA?'ok':'mut'}">${it.dias}/${VENTANA} d sin oferta</span>`
      : `<span style="color:var(--ink3);font-size:11px">sin histórico</span>`;
    return `<tr>
      <td class="n"><b>${esc(it.sku || '—')}</b></td>
      <td><span class="chip ${it.cuotas?'acc':'mut'}">${esc(cuotasLabel(it.cuotas))}</span></td>
      <td><b style="font-size:12px">${esc(it.titulo.slice(0,44))}</b>
        <div style="font:400 10px 'JetBrains Mono';color:var(--ink3)">${esc(it.id)} · ${esc(it.listingType)}</div></td>
      <td class="r n">${pes(it.lista)}</td>
      <td class="r n">${num(it.stock)}</td>
      <td>${rel}</td>
      ${modo === 'cand'
        ? `<td>${it.candidatas.length} disponible${it.candidatas.length===1?'':'s'}
             <div style="font-size:10.5px;color:var(--ink3)">${esc((mejor && (mejor.promo||mejor.tipo))||'')}</div></td>
           <td class="r n">${mejor && mejor.sug ? pes(mejor.sug) : mejor && mejor.max ? pes(mejor.max) : '—'}</td>
           <td class="r"><button class="btn xs" data-sp="${esc(it.id)}|${esc(mejor?mejor.tipo:'')}|${esc(mejor?mejor.promoId:'')}">Sumar</button>
             <button class="btn xs" data-goto="${esc(it.sku)}">SKU</button></td>`
        : `<td colspan="2" style="font-size:11.5px;color:var(--ink3)">Ninguna campaña la invitó</td>
           <td class="r"><button class="btn xs p" data-man="${esc(it.id)}">Crear descuento</button>
             <button class="btn xs" data-goto="${esc(it.sku)}">SKU</button></td>`}
    </tr>`;
  };

  const cab = extra => `<thead><tr><th>SKU</th><th>Opción</th><th>Publicación</th>

    </div>

    ${conCand.length ? `<div class="panel"><h3>Tienen campaña disponible y no están adentro
      <span class="hint">${conCand.length} publicaciones · se suman directo</span></h3>
      <div class="scroll"><table>
        ${cab('<th>Campañas</th><th class="r">Precio sugerido</th><th></th>')}
        <tbody>${conCand.map(it => fila(it,'cand')).join('')}</tbody>
      </table></div></div>` : ''}

      <span class="hint">${sinCand.length} publicaciones · descuento individual</span></h3>
      <div class="scroll"><table>
        ${cab('<th colspan="2">Situación</th><th></th>')}

      </div></div>` : ''}`;

  $$('[data-sp]').forEach(b => b.onclick = () => {
    const [id,tipo,pid] = b.dataset.sp.split('|');
    const it = S.items.find(x => x.id === id);
    const p = it && it.promos.find(x => x.tipo===tipo && x.promoId===pid);
    if (p) abrirSumar({it,p}); else toast('No encontré esa promoción','bad');

    const it = S.items.find(x => x.id === b.dataset.man);

  });
}

/** La candidata que deja el mejor precio: el techo más alto. */
function mejorCandidata(it) {
  const c = it.candidatas.filter(p => p.max || p.sug || p.precio);
  if (!c.length) return it.candidatas[0] || null;
  return c.slice().sort((a,b) => (b.max||b.sug||b.precio||0) - (a.max||a.sug||a.precio||0))[0];
}

/* ═══ SUMAR ═══ */
let sumarActual = null;
function abrirSumar(o) {
  if (!o || !o.p) return;
  sumarActual = o;
  const {it,p} = o;
  const solo = p.aceptaSolo, ligh = p.tipo === 'LIGHTNING';
  const def = p.sug || p.max;

  $('#sTit').textContent = 'Sumar a ' + (p.promo || p.tipo);
  $('#sOk').classList.remove('hide');
  $('#sBody').innerHTML = `
    <div class="rango"><span>${esc(it.titulo.slice(0,44))}</span></div>
    <div class="rango">
      <span class="chip acc">${esc(cuotasLabel(it.cuotas))}</span>
      <span>Lista <b class="n">${pes(it.lista)}</b></span>
      ${it.precioActivo?`<span>Hoy <b class="n">${pes(it.precioActivo)}</b></span>`:''}
      <span class="chip mut">${esc(p.tipo)}</span></div>
    ${solo ? `<div class="aviso">Esta campaña la define Mercado Libre: vos solo aceptás.
        Precio <b>${pes(p.precio || p.sug)}</b>${p.meliPct!=null?` — ML pone ${p.meliPct}% y vos ${p.sellerPct}%`:''}.</div>`
    : `<div class="fld"><label>Precio final al comprador</label>
      <input type="number" id="fPrecio" value="${def?Math.round(def):''}" step="1">
      <div class="rango">
        ${p.max?`<button type="button" data-set="${p.max}">Techo ${pes(p.max)}</button>`:''}
        ${p.sug?`<button type="button" data-set="${p.sug}">Sugerido ${pes(p.sug)}</button>`:''}
        ${p.min?`<button type="button" data-set="${p.min}">Piso ${pes(p.min)}</button>`:''}
      </div><span class="help" id="fCalc"></span></div>
    ${ligh?`<div class="fld"><label>Stock a reservar</label>
      <input type="number" id="fStock" value="${p.stockMin||1}" min="${p.stockMin||1}" ${p.stockMax?`max="${p.stockMax}"`:''}>
      <span class="help">Meli pide entre ${p.stockMin??'—'} y ${p.stockMax??'—'} unidades.</span></div>`:''}
    ${p.tipo==='PRICE_DISCOUNT'?`<div class="aviso">Máximo 14 días. Descuento entre 5% y 80%.
      Si el ítem ya está en un DEAL, no se aplica hasta que el DEAL termine.</div>`:''}`}
    ${ligh?`<div class="aviso bad">Una vez activa, la relámpago <b>no se puede eliminar</b>. Solo pausar el ítem.</div>`:''}`;

  const calc = () => {
    const el = $('#fCalc'); if (!el) return;
    const v = +($('#fPrecio')||{}).value;
    if (!v || !it.lista) { el.textContent=''; return; }
    const fuera = (p.max && v > p.max) || (p.min && v < p.min);
    el.innerHTML = `Descuento <b>${pct((1 - v/it.lista)*100)}</b>` +
      (fuera?` — <span style="color:var(--bad)">fuera del rango (${pes(p.min)} a ${pes(p.max)})</span>`:'');
  };
  $$('#sBody [data-set]').forEach(b => b.onclick = () => { $('#fPrecio').value = Math.round(+b.dataset.set); calc(); });
  if ($('#fPrecio')) { $('#fPrecio').oninput = calc; calc(); }
  $('#dSumar').showModal();
}

/* ═══ CREAR DESCUENTO INDIVIDUAL A MANO ═══ */
const iso = d => d.toISOString().slice(0,10);
function abrirManual(it) {
  // Sin invitación de campaña, el único camino es PRICE_DISCOUNT: lo crea el vendedor.
  // La API no devuelve techo ni piso para esto, así que aplicamos la regla documentada 5%–80%.
  const techo = it.lista ? Math.floor(it.lista * 0.95) : null;   // descuento mínimo 5%
  const piso  = it.lista ? Math.ceil(it.lista * 0.20)  : null;   // descuento máximo 80%
  const hoy = new Date(), fin = new Date(Date.now() + 13*864e5);

  sumarActual = { it, manual:true };
  $('#sTit').textContent = 'Crear descuento individual';
  $('#sOk').classList.remove('hide');
  $('#sBody').innerHTML = `
    <div class="rango"><span>${esc(it.titulo.slice(0,44))}</span></div>
    <div class="rango">
      <span class="chip acc">${esc(cuotasLabel(it.cuotas))}</span>
      <span class="chip mut">SKU ${esc(it.sku||'—')}</span>
      <span>Lista <b class="n">${pes(it.lista)}</b></span>
      <span>Stock <b class="n">${num(it.stock)}</b></span></div>

    <div class="aviso">Esta publicación no fue invitada a ninguna campaña, así que va por
      <b>descuento individual</b>. Lo definís vos entero: Meli no da techo ni sugerencia acá.</div>

    <div class="fld"><label>Precio final al comprador</label>
      <input type="number" id="fPrecio" value="${techo||''}" step="1">
      <div class="rango">
        ${techo?`<button type="button" data-set="${techo}">Mínimo 5% · ${pes(techo)}</button>`:''}
        ${it.lista?`<button type="button" data-set="${Math.floor(it.lista*0.9)}">10% · ${pes(Math.floor(it.lista*0.9))}</button>`:''}
        ${it.lista?`<button type="button" data-set="${Math.floor(it.lista*0.85)}">15% · ${pes(Math.floor(it.lista*0.85))}</button>`:''}
      </div>
      <span class="help" id="fCalc"></span></div>

    <div class="fld" style="flex-direction:row;gap:12px">
      <div class="fld" style="flex:1"><label>Desde</label>
        <input type="text" id="fIni" value="${iso(hoy)}" placeholder="AAAA-MM-DD"></div>
      <div class="fld" style="flex:1"><label>Hasta</label>
        <input type="text" id="fFin" value="${iso(fin)}" placeholder="AAAA-MM-DD"></div>
    </div>
    <span class="help">Máximo 14 días. Las fechas cuentan el día entero: arranca 00:00 y termina 23:59.</span>

    ${it.dias != null && it.dias < VENTANA && it.muestras > 0
      ? `<div class="aviso bad">Esta publicación lleva solo <b>${it.dias} de ${VENTANA} días</b> sin oferta.
         Si el precio no le resulta creíble a Meli, el descuento va a ser rechazado.</div>` : ''}`;

  const calc = () => {
    const el = $('#fCalc'); if (!el) return;
    const v = +$('#fPrecio').value;
    if (!v || !it.lista) { el.textContent=''; return; }
    const d = (1 - v/it.lista)*100;
    const fuera = d < 5 || d >= 80;
    el.innerHTML = `Descuento <b>${pct(d)}</b>` + (fuera
      ? ` — <span style="color:var(--bad)">fuera del 5%–80% permitido (${pes(piso)} a ${pes(techo)})</span>` : '');
  };
  $$('#sBody [data-set]').forEach(b => b.onclick = () => { $('#fPrecio').value = +b.dataset.set; calc(); });
  $('#fPrecio').oninput = calc; calc();
  $('#dSumar').showModal();
}

$('#sOk').onclick = async () => {
  const o = sumarActual; if (!o) return;
  const {it} = o;

  // Descuento individual creado a mano
  if (o.manual) {
    const v = +($('#fPrecio')||{}).value;
    if (!v) { toast('Falta el precio','bad'); return; }
    const d = (1 - v/it.lista)*100;
    if (d < 5 || d >= 80) { toast('El descuento tiene que estar entre 5% y 80%','bad'); return; }
    const ini = ($('#fIni')||{}).value, f = ($('#fFin')||{}).value;
    if ((new Date(f) - new Date(ini))/864e5 > 14) { toast('El máximo son 14 días','bad'); return; }
    $('#sOk').disabled = true; $('#sOk').innerHTML = '<span class="spin"></span> Creando';
    try {
      await api('sumar', { item_id: it.id, promotion_type:'PRICE_DISCOUNT', deal_price: v,
        start_date: ini + 'T00:00:00', finish_date: f + 'T00:00:00' });
      $('#dSumar').close(); toast('Descuento creado', 'ok'); cargar();
    } catch (e) { toast(e.message, 'bad'); }
    finally { $('#sOk').disabled = false; $('#sOk').textContent = 'Confirmar'; }
    return;
  }

  const p = o.p;
  const body = { item_id: it.id, promotion_type: p.tipo };
  if (p.promoId) body.promotion_id = p.promoId;
  if (!p.aceptaSolo) {
    const v = +($('#fPrecio')||{}).value;
    if (!v) { toast('Falta el precio','bad'); return; }
    body.deal_price = v;
    if (p.tipo === 'LIGHTNING') body.stock = +($('#fStock')||{}).value || 1;
  }
  $('#sOk').disabled = true; $('#sOk').innerHTML = '<span class="spin"></span> Enviando';
  try { await api('sumar', body); $('#dSumar').close();
    toast('Sumado a ' + (p.promo || p.tipo), 'ok'); cargar(); }
  catch (e) { toast(e.message, 'bad'); }
  finally { $('#sOk').disabled = false; $('#sOk').textContent = 'Confirmar'; }
};

/* ═══ carga ═══ */
async function cargar() {
  if (!S.url || !S.key) { render(); return; }
  $('#recargar').innerHTML = '<span class="spin"></span>';
  try {
    procesar(await api('datos'));
    const u = S.data.ultimaSync || {};
    $('#pie').innerHTML = u.cuando
      ? 'Sync ' + new Date(u.cuando).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
        + '<br>' + (u.publicaciones||0) + ' publicaciones · ' + (u.filas||0) + ' filas'
      : 'Conectado, sin sincronizar';
  } catch (e) { toast(e.message,'bad'); }
  finally { $('#recargar').textContent = 'Recargar'; render(); }
}
$('#sync').onclick = async () => {
  const b = $('#sync'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Sincronizando';
  try { const r = await api('sync');
    toast(r.publicaciones + ' publicaciones y ' + r.filas + ' promociones en ' + r.segundos + 's','ok');
    await cargar(); }
  catch (e) { toast(e.message,'bad'); }
  finally { b.disabled = false; b.textContent = 'Sincronizar con Meli'; }
};
$('#recargar').onclick = cargar;

function ir(v) {
  S.vista = v;
  $$('.nav').forEach(n => n.setAttribute('aria-current', n.dataset.v===v ? 'true':'false'));
  if (v !== 'oportunidades') S.campFiltro = null;
  render();
}
$$('.nav').forEach(n => n.onclick = () => ir(n.dataset.v));

function abrirCfg(){ $('#cUrl').value = S.url; $('#cKey').value = S.key; $('#dCfg').showModal(); }
$('#cfg').onclick = abrirCfg;
$('#cCancel').onclick = () => $('#dCfg').close();
$('#cSave').onclick = () => {
  S.url = $('#cUrl').value.trim(); S.key = $('#cKey').value.trim();
  localStorage.setItem('cdp_url', S.url); localStorage.setItem('cdp_key', S.key);
  $('#dCfg').close(); cargar();
};
$('#sCancel').onclick = () => $('#dSumar').close();

$('#tema').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':cur==='light'?'':'dark';
  next ? document.documentElement.setAttribute('data-theme',next)
       : document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('cdp_tema', next); } catch(e){}
};
try { const t = localStorage.getItem('cdp_tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){}

if (!S.url) abrirCfg();
cargar();
</script>
</body>
</html>
